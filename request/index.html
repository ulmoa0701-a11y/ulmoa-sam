<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="../favicon.ico">
<meta name="robots" content="noindex,nofollow">
<title>생각 남기기 — 일단 해봄노트</title>
<meta name="description" content="자료, 정보, 아이디어를 간단히 남기는 페이지입니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="../assets/styles.css">
<link rel="stylesheet" href="../assets/notebook-subpages.css?v=20261005-clean3">
</head>
<body class="note-subpage">
<header class="sub-header">
  <a class="sub-brand" href="../"><span>✦</span><b>일단 해봄노트</b></a>
  <nav class="sub-nav"><a href="../#made">써보기</a><a class="mobile-priority" href="../materials/">자료</a><a class="mobile-priority" href="../info/">정보</a><a href="../#share">소통</a><a href="../about/">소개</a><a class="accent" href="../request/">생각 남기기</a></nav>
</header>

<main class="sub-main">
  <a class="back-link" href="../">← 해봄노트로 돌아가기</a>
  <section class="notebook-page request-note">
    <div class="request-intro">
      <p class="sub-kicker" id="requestKicker">아이디어</p>
      <h1 id="requestHeading">필요한 게<br>있나요?</h1>
      <p id="requestLead">한 줄이면 충분해요.</p>
    </div>

    <section class="request-form-note" aria-labelledby="requestTitle">
      <div class="form-line" id="audienceBlock">
        <span id="requestTitle">누가 쓰나요?</span>
        <div class="choice-row-note" id="audienceChoices">
          <button type="button" data-value="아이와">아이와</button>
          <button type="button" data-value="선생님">선생님</button>
          <button type="button" data-value="센터·학교">센터·학교</button>
          <button type="button" data-value="그냥 아이디어">그냥 아이디어</button>
        </div>
      </div>

      <div class="form-line">
        <span id="subjectLabel">무엇이 필요해요?</span>
        <input id="requestSubject" maxlength="50" placeholder="예: 보강한 수업만 한눈에 보고 싶어요">
      </div>

      <div class="form-line" id="linkBlock" hidden>
        <span id="linkLabel">링크</span>
        <input id="requestLink" type="url" maxlength="500" placeholder="https://">
      </div>

      <div class="form-line">
        <span id="bodyLabel">설명</span>
        <textarea id="requestBody" maxlength="800" placeholder="필요한 내용을 적어주세요."></textarea>
        <div class="helper">개인정보는 적지 마세요.</div>
      </div>

      <div class="send-row">
        <button id="copyAndKakao" type="button">복사하고 카카오 열기</button>
        <a id="emailRequest" href="mailto:ulmoa0701@gmail.com">이메일로 보내기</a>
      </div>
    </section>

    <div class="preview-note">
      <span>내가 남길 메모</span>
      <pre id="requestPreview">[아이디어]
대상: 아직 선택 안 함

제목: 

내용: </pre>
    </div>
  </section>
</main>

<footer class="sub-footer"><div><b>일단 해봄노트</b><span>울모아쌤</span></div><nav><a href="../">홈</a><a href="../about/">만든 사람</a></nav></footer>
<div class="toast" id="toast" role="status"></div>
<script>
const choices=[...document.querySelectorAll('#audienceChoices button')];
const subject=document.querySelector('#requestSubject');
const body=document.querySelector('#requestBody');
const preview=document.querySelector('#requestPreview');
const email=document.querySelector('#emailRequest');
const copyKakao=document.querySelector('#copyAndKakao');
const toast=document.querySelector('#toast');
const link=document.querySelector('#requestLink');
const linkBlock=document.querySelector('#linkBlock');
const modeParam=new URLSearchParams(location.search).get('mode');
const mode=['cheer','share','build'].includes(modeParam)?modeParam:'idea';
const storageKey={cheer:'ulmoa-cheer-draft',share:'ulmoa-share-draft',build:'ulmoa-build-draft',idea:'ulmoa-request-draft'}[mode];
let audience=mode==='cheer'?'작업 응원':mode==='share'?'정보 공유':'';

if(mode==='cheer'){
  document.title='작업 응원하기 — 일단 해봄노트';
  document.querySelector('#requestKicker').textContent='응원';
  document.querySelector('#requestHeading').innerHTML='한 줄<br>남기기';
  document.querySelector('#requestLead').textContent='';
  document.querySelector('#audienceBlock').hidden=true;
  document.querySelector('#subjectLabel').textContent='한 줄';
  subject.placeholder='예: 차근차근 놀이터 재밌게 써봤어요';
  document.querySelector('#bodyLabel').textContent='더 남기기';
  body.placeholder='좋았던 점이나 다음에 보고 싶은 것.';
}
if(mode==='share'){
  document.title='정보 공유 — 일단 해봄노트';
  document.querySelector('#requestKicker').textContent='정보 공유';
  document.querySelector('#requestHeading').innerHTML='추천<br>자료';
  document.querySelector('#requestLead').textContent='';
  document.querySelector('#audienceBlock').hidden=true;
  document.querySelector('#subjectLabel').textContent='자료 이름';
  subject.placeholder='예: 초등 사회성 활동 자료';
  linkBlock.hidden=false;
  document.querySelector('#bodyLabel').textContent='한 줄 설명';
  body.placeholder='한 줄만 적어도 좋아요.';
}
if(mode==='build'){
  document.title='함께 만들어봐요 — 일단 해봄노트';
  const buildChoices=[['치료사','치료사'],['특수교사','특수교사'],['학부모','학부모'],['특수교육대상자','특수교육대상자']];
  choices.forEach((btn,i)=>{btn.textContent=buildChoices[i][0];btn.dataset.value=buildChoices[i][1];});
  document.querySelector('#requestKicker').textContent='함께 만들기';
  document.querySelector('#requestTitle').textContent='누가 쓰나요?';
  document.querySelector('#requestHeading').innerHTML='필요한 자료 ·<br>도구';
  document.querySelector('#requestLead').textContent='';
  document.querySelector('#subjectLabel').textContent='무엇을 만들까요?';
  subject.placeholder='예: 받아쓰기 싫어하는 아이가 할 수 있는 게임';
  document.querySelector('#bodyLabel').textContent='설명';
  body.placeholder='필요한 내용을 적어주세요.';
}

function buildText(){
  const label={cheer:'작업 응원',share:'정보 공유',build:'함께 만들기',idea:'아이디어'}[mode];
  const audienceLine=(mode==='cheer'||mode==='share')?'':'대상: '+(audience||'아직 선택 안 함')+'\n\n';
  const linkLine=mode==='share'&&link.value.trim()?'링크: '+link.value.trim()+'\n\n':'';
  return '['+label+']\n'+audienceLine+'한 줄: '+subject.value.trim()+'\n\n'+linkLine+'내용: '+body.value.trim();
}
function sync(){
  const text=buildText();
  preview.textContent=text;
  const mailTitle={cheer:'울모아쌤 작업 응원',share:'울모아쌤 정보 공유',build:'울모아쌤 함께 만들기',idea:'울모아쌤 아이디어'}[mode];
  email.href='mailto:ulmoa0701@gmail.com?subject='+encodeURIComponent(mailTitle+' · '+(subject.value.trim()||'메모'))+'&body='+encodeURIComponent(text);
  localStorage.setItem(storageKey,JSON.stringify({audience,subject:subject.value,link:link.value,body:body.value}));
}
function showToast(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800);}
choices.forEach(btn=>btn.addEventListener('click',()=>{audience=btn.dataset.value;choices.forEach(x=>x.classList.toggle('selected',x===btn));sync();}));
subject.addEventListener('input',sync);link.addEventListener('input',sync);body.addEventListener('input',sync);
copyKakao.addEventListener('click',async()=>{const text=buildText();try{await navigator.clipboard.writeText(text);showToast(mode==='cheer'?'응원 메모를 복사했어요':mode==='share'?'정보를 복사했어요':'메모를 복사했어요');}catch{showToast('복사가 안 되면 미리보기 내용을 직접 복사해주세요');}setTimeout(()=>window.open('http://pf.kakao.com/_wEGJn','_blank','noopener'),180);});
try{const saved=JSON.parse(localStorage.getItem(storageKey)||'null');if(saved){audience=mode==='cheer'?'작업 응원':mode==='share'?'정보 공유':(saved.audience||'');subject.value=saved.subject||'';link.value=saved.link||'';body.value=saved.body||'';choices.forEach(x=>x.classList.toggle('selected',x.dataset.value===audience));}}catch{}
sync();
</script>
</body>
</html>
