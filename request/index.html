<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>앱 요청하기 — 울모아쌤</title>
<meta name="description" content="이런 게 있으면 좋겠다. 울모아쌤에게 앱·도구·자료 아이디어를 남겨주세요.">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="../assets/styles.css">
</head>
<body class="request-page">
<header class="site-header">
  <div class="wrap nav">
    <a class="brand" href="../"><span class="brand-mark" aria-hidden="true"><i></i></span><b>울모아쌤</b></a>
    <nav><a href="../#made">만든 것</a><a href="../#growing">만드는 중</a><a href="../about/">만든 사람</a><a class="request-btn" href="./">앱 요청하기</a></nav>
  </div>
</header>

<main>
  <div class="wrap">
    <a class="request-back" href="../">← 돌아가기</a>

    <section class="request-hero">
      <span>REQUEST</span>
      <h1>이런 거 있으면 좋겠다.</h1>
      <p>완벽하게 설명하지 않아도 돼요. 한 줄이면 충분해요.</p>
    </section>

    <section class="request-form" aria-labelledby="requestTitle">
      <div class="form-block">
        <span id="requestTitle">누가 쓰면 좋을까요?</span>
        <div class="choice-row" id="audienceChoices">
          <button type="button" data-value="아이와">아이와</button>
          <button type="button" data-value="선생님">선생님</button>
          <button type="button" data-value="센터·학교">센터·학교</button>
          <button type="button" data-value="그냥 아이디어">그냥 아이디어</button>
        </div>
      </div>

      <div class="form-block">
        <span>한 줄 제목</span>
        <input id="requestSubject" maxlength="50" placeholder="예: 보강한 수업만 한눈에 보고 싶어요">
      </div>

      <div class="form-block">
        <span>어떤 게 있으면 좋을까요?</span>
        <textarea id="requestBody" maxlength="800" placeholder="불편한 점, 만들었으면 하는 것, 재밌을 것 같은 아이디어를 편하게 적어주세요."></textarea>
        <div class="helper">아동 이름·생년월일·검사결과 같은 민감정보는 적지 않아도 됩니다.</div>
      </div>

      <div class="request-send">
        <button id="copyAndKakao" type="button">내용 복사하고 카카오 열기</button>
        <a id="emailRequest" href="mailto:ulmoa0701@gmail.com">이메일로 보내기</a>
      </div>
    </section>

    <div class="request-preview">
      <span>보낼 내용 미리보기</span>
      <pre id="requestPreview">[앱 요청]
대상: 아직 선택 안 함

제목: 

내용: </pre>
    </div>
  </div>
</main>

<footer>
  <div class="wrap footer-inner">
    <div><b>울모아쌤</b><span>생각난 걸 만들어보는 곳</span></div>
    <div><a href="http://ulmoa.co.kr" target="_blank" rel="noopener">울모아 연구소</a><a href="../about/">만든 사람</a></div>
  </div>
</footer>

<div class="toast" id="toast" role="status"></div>
<script>
const choices=[...document.querySelectorAll('#audienceChoices button')];
const subject=document.querySelector('#requestSubject');
const body=document.querySelector('#requestBody');
const preview=document.querySelector('#requestPreview');
const email=document.querySelector('#emailRequest');
const copyKakao=document.querySelector('#copyAndKakao');
const toast=document.querySelector('#toast');
let audience='';

function buildText(){
  return '[앱 요청]\n대상: '+(audience||'아직 선택 안 함')+'\n\n제목: '+subject.value.trim()+'\n\n내용: '+body.value.trim();
}
function sync(){
  const text=buildText();
  preview.textContent=text;
  email.href='mailto:ulmoa0701@gmail.com?subject='+encodeURIComponent('울모아쌤 앱 요청 · '+(subject.value.trim()||'아이디어'))+'&body='+encodeURIComponent(text);
  localStorage.setItem('ulmoa-request-draft',JSON.stringify({audience,subject:subject.value,body:body.value}));
}
function showToast(msg){
  toast.textContent=msg;toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'),1800);
}
choices.forEach(btn=>btn.addEventListener('click',()=>{
  audience=btn.dataset.value;
  choices.forEach(x=>x.classList.toggle('selected',x===btn));
  sync();
}));
subject.addEventListener('input',sync);
body.addEventListener('input',sync);
copyKakao.addEventListener('click',async()=>{
  const text=buildText();
  try{await navigator.clipboard.writeText(text);showToast('요청 내용을 복사했어요');}
  catch{showToast('복사가 안 되면 미리보기 내용을 직접 복사해주세요');}
  setTimeout(()=>window.open('http://pf.kakao.com/_wEGJn','_blank','noopener'),180);
});
try{
  const saved=JSON.parse(localStorage.getItem('ulmoa-request-draft')||'null');
  if(saved){
    audience=saved.audience||'';
    subject.value=saved.subject||'';
    body.value=saved.body||'';
    choices.forEach(x=>x.classList.toggle('selected',x.dataset.value===audience));
  }
}catch{}
sync();
</script>
</body>
</html>
