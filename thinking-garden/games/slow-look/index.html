<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>모아의 생각정원 | 차근차근 탐험단 | 시지각·공간·차분한 반응 연습</title>
<style>
:root{--ink:#233e4b;--teal:#237b80;--pale:#ecf5f4;--cream:#fffdf8;--bg:#f6f8f6;--line:#c8d9dc;--soft:#62777f;--coral:#e8a992;--gold:#efc970;--white:#fff}
*{box-sizing:border-box}html{font-family:Pretendard,SUIT,'Noto Sans KR','Malgun Gothic',system-ui,sans-serif}body{margin:0;background:var(--bg);color:var(--ink);line-height:1.48;-webkit-tap-highlight-color:transparent}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:4px solid #f4b350;outline-offset:3px}button:disabled{opacity:.45;cursor:not-allowed}button,select{touch-action:manipulation}
header{background:var(--ink);color:#fff;padding:16px max(18px,calc((100vw - 1060px)/2));display:flex;gap:18px;justify-content:space-between;align-items:center}header .brand{font-size:clamp(19px,3vw,24px);font-weight:800;letter-spacing:-.03em}header small{display:block;color:#d4e3e6;font-size:12px;font-weight:400;margin-top:3px}.home-link{color:white;background:transparent;border:1px solid #8eacb2;border-radius:12px;padding:8px 12px;white-space:nowrap}
main{max-width:980px;margin:0 auto;padding:20px 18px 50px}.intro{margin:10px 0 24px}.intro h1{font-size:clamp(23px,4.5vw,33px);margin:0 0 8px;letter-spacing:-.045em}.intro p{color:var(--soft);margin:0}.panel{background:white;border:1px solid #d9e5e5;border-radius:23px;padding:20px;box-shadow:0 5px 20px #183d4508}.settings{display:flex;gap:18px;flex-wrap:wrap;align-items:end;margin-bottom:18px}.field{display:grid;gap:5px;flex:1 1 180px}.field label{font-size:13px;font-weight:700;color:#546a73}.field select{width:100%;height:46px;padding:0 12px;border-radius:12px;background:#fff;border:1px solid #bccdd0;color:var(--ink)}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.mode{background:#fff;text-align:left;min-height:157px;padding:17px;border:2px solid #dce8e8;border-radius:18px;color:var(--ink);transition:.15s}.mode:hover,.mode:focus{border-color:var(--teal);background:var(--pale)}.mode .sym{font-size:31px;display:block;margin-bottom:8px}.mode strong{font-size:18px;display:block}.mode small{display:block;color:var(--soft);margin-top:5px;font-size:13px}.note{font-size:13px;color:var(--soft);padding:12px 2px}.tip{background:var(--pale);border-radius:12px;padding:11px 14px;margin:12px 0;color:#27565d;font-size:14px}
.tagline{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}.crumb{font-size:13px;color:#54707a;font-weight:700}.progress{display:flex;gap:6px}.progress span{height:8px;width:32px;border-radius:9px;background:#dde8e8}.progress .done{background:#278b8c}.progress .active{background:#efc970}
.taskHead{display:flex;justify-content:space-between;gap:12px;align-items:start}.taskHead h1{margin:0 0 7px;font-size:clamp(21px,4.2vw,28px)}.taskHead>.btn{white-space:nowrap;font-size:13px;padding:9px 11px;min-height:42px;align-self:flex-start}.taskHead p{color:var(--soft);margin:0;font-size:14px}.stage{min-height:320px;margin-top:20px;display:grid;align-content:center}.lab{margin:0 auto 9px;text-align:center;font-size:13px;font-weight:800;color:var(--teal)}.gridwrap{display:flex;align-items:start;gap:clamp(12px,4vw,46px);justify-content:center;flex-wrap:wrap}.gridcol{text-align:center}.board{--n:4;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:0;width:min(36vw,270px);aspect-ratio:1;margin:0 auto}.board.large{width:min(85vw,370px)}.tile{border:1.5px solid #8fa7b0;display:grid;place-items:center;min-width:0;min-height:0;padding:1px;background:#fff;color:var(--ink);border-radius:0;position:relative}.tile.square-on{background:#257c82}.tile.user-on{background:#53aeb0}.tile.targetmark{outline:3px solid var(--gold);outline-offset:-4px}.tile .symbol{width:61%;height:61%;stroke:var(--ink);fill:none;stroke-width:2.9;stroke-linejoin:round}.tile.selected::after{content:'✓';position:absolute;right:2px;bottom:-5px;font-size:clamp(18px,4vw,27px);font-weight:900;color:#156d6e;text-shadow:0 1px white}.celltext{font-size:12px;color:var(--soft);margin-top:7px}
.promptbox{padding:15px 16px;background:var(--pale);color:#245f64;font-weight:800;border-radius:15px;margin:17px auto 0;width:max-content;max-width:100%;text-align:center}.actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:20px}.btn{background:#fff;color:var(--ink);border:1px solid #bdd0d3;border-radius:14px;padding:12px 17px;font-weight:700;min-height:48px}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn.ghost{border:0;background:#eff4f3;color:#40656d}.btn.warn{background:#fdf3e4;border-color:#edd7ad;color:#856138}.btn.big{font-size:17px;min-height:53px;padding:13px 22px}.teacher{background:#fbfcfc;border:1px dashed #b7cbce;color:#566970;border-radius:16px;padding:12px;margin-top:18px;font-size:12px}.teacher strong{color:#385661}.teacher summary{cursor:pointer;font-weight:800;color:#4b6771}.teacher p{margin:9px 0 5px}body.zoomed .gridwrap{flex-direction:column;align-items:center}body.zoomed .board{width:min(76vw,350px)}body.zoomed .stage{min-height:0}.feedback{padding:14px;border:1px solid #b8d8d7;border-radius:14px;background:#f0f8f6;margin-top:17px;text-align:center}.feedback strong{font-size:17px;display:block}.feedback small{color:#58717b}.name-card{display:grid;place-items:center;min-height:270px;width:min(100%,430px);margin:0 auto;border:3px solid #d8e8e8;border-radius:25px;background:#fff}.animal{font-size:clamp(110px,25vw,160px);line-height:1}.colorball{width:170px;max-width:47vw;aspect-ratio:1;border-radius:50%;border:3px solid #6b848b}.stepmarks{display:flex;align-items:center;justify-content:center;gap:11px;margin:13px auto 20px;font-weight:800}.stepmarks span{padding:7px 10px;border-radius:50px;background:#e8eeee;color:#64787c;font-size:13px}.stepmarks span.now{background:#dfefed;color:#1c7379}.answers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;max-width:540px;margin:14px auto 0}.choice{background:#fff;border:2px solid #d7e4e4;border-radius:13px;padding:15px 4px;font-weight:800;color:var(--ink)}.choice:active{background:var(--pale)}.answerReveal{font-size:19px;color:var(--teal);font-weight:800;text-align:center;margin-top:12px}.mini{color:var(--soft);font-size:13px;text-align:center}.summarynum{font-size:38px;font-weight:900;color:var(--teal);letter-spacing:-.03em}.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f1f7f6;text-align:center;padding:13px 5px;border-radius:14px}.stat .n{font-size:22px;font-weight:800;color:var(--teal)}.stat small{display:block;color:#59747b;font-size:12px}.history{max-height:210px;overflow:auto;margin-top:18px;border:1px solid #dce5e5;border-radius:12px}.history div{border-bottom:1px solid #e7eeee;padding:8px 12px;font-size:13px}.history div:last-child{border-bottom:0}.resultline{color:#2d6b72}.footerline{text-align:center;color:#64777e;font-size:12px;padding:20px 0}.tools{display:flex;gap:6px;flex-wrap:wrap}.hidden{display:none!important}
@media(max-width:700px){main{padding:14px 12px 30px}.panel{padding:15px;border-radius:18px}.modes{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.mode{min-height:145px;padding:12px}.mode strong{font-size:16px}.mode small{font-size:12px}.settings{gap:8px}.field{flex:1 1 130px}.gridwrap{gap:17px;flex-wrap:nowrap}.board{width:min(41vw,220px)}.tile{border-width:1px}.stage{min-height:207px;margin-top:12px}.actions{margin-top:13px}.teacher{margin-top:12px}.tagline{gap:6px}.statrow{gap:5px}.stat{padding:10px 3px}.actions{gap:7px}.actions .btn{flex:1 1 135px}.intro{margin:7px 0 18px}.name-card{min-height:226px}.answers{gap:6px}.choice{padding:12px 3px}}
@media (max-width:370px){.mode{min-height:143px}.mode .sym{font-size:26px}.board{width:min(40vw,180px)}.gridwrap{gap:10px}}
@media print {header,.actions,.teacher,.home-link{display:none!important}.panel{box-shadow:none;border:0}}
</style><link rel="stylesheet" href="garden-theme.css?v=20261014-garden-design1"></head><body><header class="garden-topbar"><a class="garden-brand" href="../../"><img src="../../assets/moa-default.png" alt=""><span>모아의 생각정원<small>인지 · 주의 · 기억 · 공간</small></span></a><nav class="garden-crumbs" aria-label="게임 이동"><button id="homeBtn" type="button">탐험 고르기</button><a href="../../" aria-label="생각정원 게임 목록으로 돌아가기">← 게임 목록</a></nav></header><main id="app"></main>
<script>
'use strict';
const $=(s)=>document.querySelector(s);
const modes={scan:{name:'도형 탐험',icon:'🔎',detail:'숨은 도형을 하나씩 찾아봐요'},place:{name:'위치 탐험',icon:'🧭',detail:'표시된 자리를 찾아 정원 지도를 완성해요'},block:{name:'블록 건축가',icon:'🧩',detail:'샘과 함께 같은 모양의 정원을 만들어요'},name:{name:'이름 탐험',icon:'🐰',detail:'친구 이름을 보고 생각한 뒤 말해요'},memory:{name:'기억 탐험',icon:'🌸',detail:'꽃이 피었던 자리를 기억해요'},everyday:{name:'생활 탐험',icon:'🎒',detail:'필요한 물건을 차근차근 찾아봐요'}};
const animals=[['강아지','🐶'],['고양이','🐱'],['토끼','🐰'],['곰','🐻'],['돼지','🐷'],['개구리','🐸']];
const colors=[['노란색','#F2BE45'],['파란색','#3C8DD1'],['초록색','#55A879'],['빨간색','#D66E66'],['보라색','#8C70BC'],['주황색','#ED985D']];
const things=[['책','📖'],['연필','✏️'],['지우개','🧼'],['가위','✂️'],['물병','🧴'],['자','📏']];
const patterns={place:[[[0,1],[2,0]],[[0,0],[1,2]],[[0,2],[2,1]],[[1,0],[2,2]]],placeMid:[[[0,2],[1,0],[2,1]],[[0,0],[1,1],[2,2]],[[0,1],[1,2],[2,0]],[[0,2],[1,1],[2,0]]],placeHard:[[[0,0],[1,3],[3,1]],[[0,2],[2,1],[3,3]],[[0,3],[1,0],[2,2]],[[1,2],[3,1],[3,3]]],block:[[[0,1],[1,1]],[[1,0],[1,1]],[[0,0],[0,1]],[[1,1],[2,1]]],blockMid:[[[0,1],[1,1],[1,2]],[[0,0],[0,1],[1,0]],[[1,0],[1,1],[2,1]],[[0,1],[1,0],[1,1]]],blockHard:[[[0,1],[1,0],[1,1],[2,1]],[[1,1],[1,2],[2,0],[2,1]],[[0,0],[0,1],[1,1],[2,1]],[[0,1],[1,1],[1,2],[2,2]]]} ;
const app=$('#app');let setting={level:1,cue:'guide',kind:'animal',response:'speech',zoom:false};let session=null;
function esc(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));}
function choose(arr,i){return arr[((i%arr.length)+arr.length)%arr.length]}
function levelLabel(){return ['','쉬움','보통','확장'][setting.level]}
function cueLabel(){return {guide:'전략 안내',wait:'충분히 기다리기',self:'스스로 확인하기'}[setting.cue]}
function intro(){return `<div class="garden-intro-hero"><div class="garden-intro-copy"><span class="garden-tag">샘과 모아의 확인정원</span><h1>차근차근<br>탐험단!</h1><p>정원에 숨어 있는 단서를 찾아요.<br>눈으로 보고, 생각하고, 준비되면 대답해요.</p></div><div class="garden-hero-friends" aria-hidden="true"><img src="../../assets/moa-default.png" alt=""><img src="../../assets/friend-saem.png" alt=""></div></div><section class="panel"><div class="garden-intro-settings"><h2 class="garden-section-title">탐험 준비</h2><p class="garden-section-caption">선생님이 아이에게 맞는 속도와 도움을 골라줄 수 있어요.</p><div class="settings"><div class="field"><label for="difficulty">난이도</label><select id="difficulty"><option value="1" ${setting.level===1?'selected':''}>쉬움</option><option value="2" ${setting.level===2?'selected':''}>보통</option><option value="3" ${setting.level===3?'selected':''}>확장</option></select></div><div class="field"><label for="cues">도움 방법</label><select id="cues"><option value="guide" ${setting.cue==='guide'?'selected':''}>보고·생각하기 안내</option><option value="wait" ${setting.cue==='wait'?'selected':''}>충분히 기다리기</option><option value="self" ${setting.cue==='self'?'selected':''}>스스로 해보기</option></select></div></div></div><h2 class="garden-section-title">어느 길을 탐험해 볼까?</h2><p class="garden-section-caption">하나를 골라 시작해요. 중간에 쉬어가도 괜찮아요.</p><div class="modes">${Object.entries(modes).map(([k,m])=>`<button class="mode" data-action="start" data-mode="${k}"><span class="sym">${m.icon}</span><strong>${m.name}</strong><small>${m.detail}</small></button>`).join('')}</div><p class="garden-note">한 활동은 4문제(이름 탐험 6문제)예요. 빠른 반응보다 천천히 확인하는 과정을 연습해요. 교사용 기록은 필요할 때만 CSV로 저장할 수 있어요.</p></section><div class="footerline">인지·시지각·공간관계 활동을 위한 연습 도구이며 진단검사가 아닙니다. · <a href="../../">모아의 생각정원으로</a></div>`;}
function home(){if(session&&!session.completed){if(!confirm('현재 활동을 끝내고 처음 화면으로 돌아갈까요?'))return;}session=null;app.innerHTML=intro();}
function newSession(mode){session={mode,level:setting.level,cue:setting.cue,kind:setting.kind,response:setting.response,total:mode==='name'?6:4,round:0,records:[],selected:new Set(),phase:'look',attempt:0,firstCorrect:null,hinted:false,modelHidden:false,finished:false,startedAt:new Date().toISOString()};render();}
function pattern(mode,level,idx){if(mode==='block')return choose(level===1?patterns.block:level===2?patterns.blockMid:patterns.blockHard,idx);return choose(level===1?patterns.place:level===2?patterns.placeMid:patterns.placeHard,idx);}
function nFor(mode,level){if(mode==='block')return 4;if(mode==='scan')return level===3?5:4;return level===3?4:3}
function steps(){return `<div class="stepmarks"><span class="${session.phase==='look'?'now':''}">① 눈으로 보기</span><span class="${session.phase==='think'?'now':''}">② 생각하기</span><span class="${session.phase==='answer'?'now':''}">③ 표현하기</span></div>`}
function cueMessage(){if(session.cue==='guide')return '눈으로 보고 → 생각하고 → 준비되면 표현해요.';if(session.cue==='wait')return '답을 서두르지 않아도 괜찮아요.';return '스스로 편한 방법으로 확인해요.';}
function render(){if(!session){home();return;}if(session.completed){summary();return;}const s=session,m=modes[s.mode];app.innerHTML=`<div class="play-shell"><div class="tagline"><div class="crumb">🌱 ${m.name} · ${['','쉬움','보통','확장'][s.level]} · ${cueLabel()}</div><div class="progress" aria-label="문제 진행 상황">${Array.from({length:s.total},(_,i)=>`<span class="${i<s.round?'done':i===s.round?'active':''}"></span>`).join('')}</div></div><section class="panel task-card"><div class="taskHead"><div><h1>${m.name}</h1><p>${heading(s.mode)} · ${s.round+1} / ${s.total}</p></div><button class="btn ghost" data-action="finish">여기서 마치기</button></div><div class="guide-line"><img src="../../assets/friend-saem.png" alt="샘"><div class="guide-bubble">${cueMessage()}</div></div><div class="stage">${taskHtml()}</div><div id="msg" aria-live="polite"></div><div class="actions">${actionHtml()}</div><details class="teacher"><summary>선생님 도구 · 관찰과 화면 조절</summary><p>${teacherHint(s.mode)} ${s.mode==='name'?'음성을 녹음하거나 자동 평가하지 않으며 교사가 채점합니다.':'정확도는 화면의 동일 위치·도형 기준으로 계산합니다.'}</p><button class="btn ghost" data-action="zoom">${setting.zoom?'보통 크기로 보기':'큰 칸으로 보기'}</button></details></section></div>`;}
function heading(mode){return {scan:'동그라미를 찾아 표시해요.',place:'왼쪽과 같은 위치에 표시해요.',block:'같은 위치에 블록을 놓아봐요.',name:'잘 보고 생각한 뒤에 표현해요.',memory:'위치를 기억해요.',everyday:'말한 물건을 찾아요.'}[mode]}
function teacherHint(mode){return {scan:'모양만 바꾸고 크기·색은 일정하게 유지합니다.',place:'원본을 계속 보여준 상태에서 진행합니다.',block:'같은 크기·색의 정사각 블록만 사용합니다.',name:'정답을 먼저 발설하지 않고 교사의 표정 힌트도 줄입니다.',memory:'원본을 보고 옮기는 과제와 기억 과제를 구분합니다.',everyday:'일상 물건의 이름을 이해하는지 먼저 확인합니다.'}[mode]}
function shapeSvg(kind){return `<svg class="symbol" viewBox="0 0 42 42" aria-hidden="true">${kind==='circle'?'<circle cx="21" cy="21" r="15"/>':kind==='square'?'<rect x="6" y="6" width="30" height="30" rx="1"/>':'<path d="M21 5 L38 36 L4 36 Z"/>'}</svg>`;}
function locGrid(arr,n,which){let keys=new Set(arr.map(v=>v.join(',')));return `<div class="board" style="--n:${n}" role="group" aria-label="${which==='sample'?'보기':'내가 표시할 격자'}">${Array.from({length:n*n},(_,i)=>{let r=Math.floor(i/n),c=i%n,k=`${r},${c}`;if(which==='sample')return `<div class="tile ${keys.has(k)?'square-on':''}" aria-label="${r+1}행 ${c+1}열"></div>`;return `<button class="tile ${session.selected.has(k)?'user-on':''}" aria-label="${r+1}행 ${c+1}열 선택" aria-pressed="${session.selected.has(k)}" data-action="cell" data-cell="${k}"></button>`}).join('')}</div>`;}
function scanData(){const n=nFor('scan',session.level),count=session.level===1?2:3,offset=session.round;const keys=[[0,0],[0,n-1],[n-1,0],[n-1,n-1],[1,2],[2,1],[3,2]];return{n,target:keys.slice(0,count).map(([r,c])=>[(r+offset)%n,(c+offset*2)%n])};}
function scanGrid(){let {n,target}=scanData(),keyset=new Set(target.map(t=>t.join(',')));return `<div class="lab">동그라미 ${target.length}개 찾기</div><div class="board large" style="--n:${n}">${Array.from({length:n*n},(_,i)=>{const r=Math.floor(i/n),c=i%n,k=`${r},${c}`;return `<button class="tile ${session.selected.has(k)?'selected':''}" data-action="cell" data-cell="${k}" aria-pressed="${session.selected.has(k)}" aria-label="${r+1}행 ${c+1}열 도형">${shapeSvg(keyset.has(k)?'circle':((r+c)%2?'triangle':'square'))}</button>`}).join('')}</div>`;}
function getNameItem(){return choose(session.kind==='animal'?animals:colors,session.round)}
function nameHtml(){let [label,pic]=getNameItem();let visual=session.kind==='animal'?`<div class="animal" aria-label="동물 그림">${pic}</div>`:`<div class="colorball" style="background:${pic}" aria-label="색깔 원"></div>`;let ans=session.phase==='scored'?`<div class="answerReveal">확인: ${label}</div>`:'';let choices='';if(session.response==='point' && session.phase==='answer'){
 const pool=session.kind==='animal'?animals:colors;const ids=[session.round,(session.round+2)%6,(session.round+4)%6].sort((a,b)=>((a+session.round)%3)-((b+session.round)%3));choices=`<div class="answers">${ids.map(i=>`<button class="choice" data-action="choice" data-choice="${i}">${pool[i][0]}</button>`).join('')}</div>`;}
 return `<div>${steps()}<div class="name-card">${visual}</div>${choices}${ans}<div class="mini">${session.response==='speech'?'아동은 말로 대답하고, 교사는 아래에서 반응을 기록합니다.':'아동이 준비됐을 때 보기에서 손으로 선택합니다.'}</div></div>`;}
function everydayData(){const base=[['연필','pencil'],['책','book'],['가위','scissors'],['지우개','eraser'],['자','ruler'],['물병','bottle']];const count=session.level===1?6:session.level===2?9:12;let arr=Array.from({length:count},(_,i)=>base[(i*5+session.round+i%3)%base.length]);const target=arr[(session.round*2+1)%arr.length][0];return{arr,target,correct:arr.map((x,i)=>x[0]===target?i:null).filter(x=>x!==null).map(i=>`${Math.floor(i/3)},${i%3}`)}}
function pictureSvg(k){const shapes={pencil:'<g transform="rotate(32 50 50)"><rect x="39" y="19" width="22" height="54" rx="2"/><path d="M39 73 L50 91 L61 73 Z"/><path d="M39 26 H61"/></g>',book:'<rect x="18" y="20" width="64" height="61" rx="5"/><path d="M50 21 V80 M27 34 H42 M58 34 H74 M27 45 H42 M58 45 H74"/>',scissors:'<circle cx="30" cy="71" r="12"/><circle cx="68" cy="71" r="12"/><path d="M40 61 L75 15 M59 62 L24 15"/>',eraser:'<g transform="rotate(-18 50 50)"><rect x="14" y="33" width="72" height="38" rx="8"/><path d="M53 35 V70"/></g>',ruler:'<g transform="rotate(-16 50 50)"><rect x="9" y="35" width="82" height="30" rx="3"/><path d="M20 35 V48 M31 35 V54 M42 35 V48 M53 35 V54 M64 35 V48 M75 35 V54"/></g>',bottle:'<rect x="28" y="29" width="44" height="61" rx="14"/><rect x="37" y="15" width="26" height="16" rx="3"/><path d="M28 56 H72"/>'};return `<svg viewBox="0 0 100 100" style="width:75%;height:75%;stroke:#233e4b;stroke-width:3.2;stroke-linejoin:round;fill:#fff" aria-hidden="true">${shapes[k]}</svg>`;}
function everydayGrid(){let {arr,target}=everydayData();let n=3;return `<div class="lab">${esc(target)}을(를) 모두 찾아요.</div><div class="board large" style="--n:${n};aspect-ratio:3 / ${Math.ceil(arr.length/3)}">${arr.map((obj,i)=>{let k=`${Math.floor(i/3)},${i%3}`;return `<button class="tile ${session.selected.has(k)?'selected':''}" data-action="cell" data-cell="${k}" aria-pressed="${session.selected.has(k)}" aria-label="${Math.floor(i/3)+1}행 ${i%3+1}열 물건">${pictureSvg(obj[1])}</button>`}).join('')}</div>`;}
function taskHtml(){const s=session;if(s.mode==='scan')return scanGrid();if(s.mode==='name')return nameHtml();if(s.mode==='everyday')return everydayGrid();let pat=pattern(s.mode,s.level,s.round),n=nFor(s.mode,s.level);
let sample=s.mode==='memory'&&s.modelHidden?`<div class="board" style="--n:${n};background:#e6eeee;border:2px solid #9ebcbc;display:grid;place-items:center;color:#53777d;font-weight:800">보기 가림</div>`:locGrid(pat,n,'sample');return `<div class="gridwrap"><div class="gridcol"><div class="lab">보기</div>${sample}</div><div class="gridcol"><div class="lab">내가 표시할 곳</div>${locGrid([],n,'response')}</div></div>${s.mode==='memory'?`<div class="mini">${s.modelHidden?'기억한 칸을 선택해요.':'충분히 기억했으면 ‘보기 가리기’를 눌러요.'}</div>`:''}`;}
function actionHtml(){let s=session;if(s.phase==='result')return `<button class="btn primary big" data-action="next">${s.round+1===s.total?'활동 결과 보기':'다음 문제 보기 →'}</button>`;
 if(s.mode==='name'){
  if(s.phase==='look')return `<button class="btn primary big" data-action="ready">이제 대답할게요</button><button class="btn ghost" data-action="skip">쉬어가기 / 넘어가기</button>`;
  if(s.phase==='answer'&&s.response==='speech')return `<button class="btn primary" data-action="score" data-correct="yes">정확하게 말했어요</button><button class="btn" data-action="score" data-correct="no">다른 이름을 말했어요</button><button class="btn ghost" data-action="score" data-correct="unknown">어려워요 / 미응답</button>`;
  if(s.phase==='answer'&&s.response==='point')return `<button class="btn ghost" data-action="skip">쉬어가기 / 넘어가기</button>`;
  return '';
 }
 if(s.mode==='memory'&&!s.modelHidden)return `<button class="btn primary big" data-action="hideModel">보기 가리기</button><button class="btn ghost" data-action="skip">넘어가기</button>`;
 if(s.phase==='retry')return `<button class="btn primary" data-action="check">다시 확인했어요</button><button class="btn ghost" data-action="hint">교사 도움 받기</button><button class="btn" data-action="moveon">이 문제 마치기</button>`;
 return `<button class="btn primary big" data-action="check">확인하기</button>${s.mode==='memory'?'<button class="btn ghost" data-action="showModel">보기 다시 보여주기</button>':''}<button class="btn ghost" data-action="skip">넘어가기</button>`;
}
function solution(){let s=session;if(s.mode==='scan')return scanData().target.map(k=>k.join(','));if(s.mode==='everyday')return everydayData().correct;return pattern(s.mode,s.level,s.round).map(k=>k.join(','));}
function same(a,b){if(a.length!==b.length)return false;let set=new Set(b);return a.every(k=>set.has(k));}
function record(accurate,status){const s=session,rec={활동:modes[s.mode].name,난이도:['','쉬움','보통','확장'][s.level],지원방식:{guide:'전략안내',wait:'기다리기',self:'스스로'}[s.cue],제시번호:s.round+1,반응형식:s.mode==='name'?(s.response==='speech'?'말하기':'가리키기'):'선택하기',최초정확:s.firstCorrect===true?'O':s.firstCorrect===false?'X':'미확인',최종정확:accurate===true?'O':accurate===false?'X':'미평가',재시도:s.attempt,단서:s.hinted?'있음':'없음',반응:status};s.records.push(rec);s.phase='result';s.last=rec;render();let msg=$('#msg');if(msg){msg.innerHTML=`<div class="feedback"><strong>${accurate===true?'차근차근 확인했어요.':accurate===false?'기록했어요. 이제 잠깐 쉬어도 괜찮아요.':'이 문제는 넘어갔어요.'}</strong><small>빠르기보다 자신의 방법으로 확인하는 것이 중요해요.</small></div>`;}
}
function check(){let s=session,actual=[...s.selected],expected=solution(),okay=same(actual,expected);if(s.firstCorrect===null)s.firstCorrect=okay;
 if(okay){record(true,s.attempt?'재확인 후 정확':'처음부터 정확');return;}
 s.attempt++;
 if(s.attempt>=2){record(false,'재확인 후에도 불일치');return;}
 s.phase='retry';render();$('#msg').innerHTML='<div class="feedback"><strong>다시 한 번 천천히 살펴볼까요?</strong><small>교사는 정답 위치를 바로 알려주기 전에 아동이 스스로 확인할 시간을 주세요.</small></div>';
}
function next(){session.round++;session.phase='look';session.attempt=0;session.firstCorrect=null;session.hinted=false;session.selected=new Set();session.modelHidden=false;
 if(session.round>=session.total){session.completed=true;summary();}else render();}
function summary(){const s=session;const total=s.records.length,first=s.records.filter(r=>r.최초정확==='O').length,correct=s.records.filter(r=>r.최종정확==='O').length,hints=s.records.filter(r=>r.단서==='있음').length;app.innerHTML=`<div class="play-shell"><section class="panel task-card"><div class="result-hero"><img class="result-art" src="../../assets/moa-cheer.png" alt="모아"><h1>오늘의 탐험 끝!</h1><p>어떤 방법으로 확인하면 더 편한지 살펴봤어요.</p></div><div class="statrow"><div class="stat"><div class="n">${first}/${total}</div><small>첫 반응 정확</small></div><div class="stat"><div class="n">${correct}/${total}</div><small>마지막 수행 정확</small></div><div class="stat"><div class="n">${hints}</div><small>추가 도움 표시</small></div></div><details class="teacher"><summary>선생님 기록 · 문제별 결과</summary><div class="history">${s.records.map(r=>`<div><span class="resultline">${r.제시번호}번</span> · ${r.반응} · 첫 반응 ${r.최초정확} · 결과 ${r.최종정확}${r.단서==='있음'?' · 단서 사용':''}</div>`).join('')||'<div>아직 기록이 없습니다.</div>'}</div><p class="little">첫 반응 정확도는 게임 내 관찰값일 뿐 진단 점수나 치료효과를 뜻하지 않습니다.</p></details><div class="actions"><button class="btn primary" data-action="csv">교사용 CSV 기록 저장</button><button class="btn" data-action="restart">같은 활동 다시 하기</button><button class="btn ghost" data-action="home">다른 탐험 고르기</button></div></section></div>`;}
 app.innerHTML=`<div class="intro"><h1>탐험을 여기까지 했어요.</h1><p>많이 맞히는 것보다, 도움이 되는 확인 방법을 찾아보는 시간이었습니다.</p></div><section class="panel"><div class="tagline"><strong>${modes[s.mode].name} · ${['','쉬움','보통','확장'][s.level]}</strong><span class="crumb">총 ${total}문제 기록</span></div><div class="statrow"><div class="stat"><div class="n">${first}/${total}</div><small>첫 반응 정확</small></div><div class="stat"><div class="n">${correct}/${total}</div><small>마지막 수행 정확</small></div><div class="stat"><div class="n">${hints}</div><small>추가 도움 표시</small></div></div><div class="history">${s.records.map(r=>`<div><span class="resultline">${r.제시번호}번</span> · ${r.반응} · 첫 반응 ${r.최초정확} · 결과 ${r.최종정확}${r.단서==='있음'?' · 단서 사용':''}</div>`).join('')||'<div>아직 기록이 없습니다.</div>'}</div><div class="tip">주의: 첫 반응 정확률은 게임 내 조건에서의 관찰값입니다. 진단 점수나 치료효과를 뜻하지 않습니다. 이름 말하기는 교사 채점입니다.</div><div class="actions"><button class="btn primary" data-action="csv">교사용 CSV 기록 저장</button><button class="btn" data-action="restart">같은 활동 다시 하기</button><button class="btn ghost" data-action="home">다른 활동 선택</button></div></section>`;
}
function downloadCsv(){const rows=[['활동','난이도','지원방식','제시번호','반응형식','최초정확','최종정확','재시도','단서','반응'],...session.records.map(r=>[r.활동,r.난이도,r.지원방식,r.제시번호,r.반응형식,r.최초정확,r.최종정확,r.재시도,r.단서,r.반응])];let csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a'),u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.href=u;a.download=`차근차근탐험단_${new Date().toISOString().slice(0,10)}.csv`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function skip(){record(null,'넘어감/휴식');}
function handler(e){let el=e.target.closest('[data-action]');if(!el)return;let a=el.dataset.action;
 if(a==='start'){setting.level=Number($('#difficulty').value);setting.cue=$('#cues').value;let m=el.dataset.mode;if(m==='name'){nameSetup();}else newSession(m);return;}
 if(a==='home'){home();return;}if(!session)return;if(a==='zoom'){setting.zoom=!setting.zoom;document.body.classList.toggle('zoomed',setting.zoom);render();return;}
 if(a==='cell'){let k=el.dataset.cell;if(session.selected.has(k))session.selected.delete(k);else session.selected.add(k);render();return;}
 if(a==='check'){check();return;}if(a==='next'){next();return;}if(a==='hideModel'){session.modelHidden=true;render();return;}
 if(a==='showModel'){session.modelHidden=false;session.hinted=true;render();return;}
 if(a==='ready'){session.phase='answer';render();return;}
 if(a==='choice'){let trueIdx=session.round%6,yes=Number(el.dataset.choice)===trueIdx;session.firstCorrect=yes;record(yes,yes?'정확한 이름 선택':'다른 이름 선택');return;}
 if(a==='score'){let yes=el.dataset.correct==='yes';session.firstCorrect=el.dataset.correct==='unknown'?null:yes;record(el.dataset.correct==='unknown'?null:yes,el.dataset.correct==='yes'?'교사평가 정확':el.dataset.correct==='no'?'교사평가 다른 이름':'어려움/미응답');return;}
 if(a==='hint'){session.hinted=true;render();$('#msg').innerHTML='<div class="feedback"><strong>필요하면 보기와 답을 한 칸씩 비교해요.</strong></div>';return;}
 if(a==='moveon'){record(false,'불일치 후 마침');return;}
 if(a==='skip'){skip();return;}if(a==='finish'){session.completed=true;summary();return;}
 if(a==='csv'){downloadCsv();return;}if(a==='restart'){newSession(session.mode);return;}
}
function nameSetup(){app.innerHTML=`<div class="garden-intro-hero"><div class="garden-intro-copy"><span class="garden-tag">샘의 친구 이름 길</span><h1>이름 탐험</h1><p>눈으로 확인하고, 생각한 뒤 말해요.</p></div><div class="garden-hero-friends" aria-hidden="true"><img src="../../assets/moa-default.png" alt=""><img src="../../assets/friend-saem.png" alt=""></div></div><section class="panel garden-intro-settings"><h2 class="garden-section-title">탐험 준비</h2><div class="settings"><div class="field"><label for="kind">무엇을 볼까요?</label><select id="kind"><option value="animal">동물</option><option value="color">색깔</option></select></div><div class="field"><label for="response">어떻게 대답할까요?</label><select id="response"><option value="speech">말로 답하기(교사 기록)</option><option value="point">글자 선택하기(읽기 가능한 아동)</option></select></div></div><div class="tip">말하기는 선생님이 직접 반응을 기록해요. 글자 선택은 읽기 능력도 필요하므로 말하기 과제와 구분해 주세요.</div><div class="actions"><button class="btn primary big" id="nameGo">이름 탐험 시작 →</button><button class="btn ghost" data-action="home">뒤로</button></div></section>`;$('#kind').value=setting.kind;$('#response').value=setting.response;$('#nameGo').addEventListener('click',()=>{setting.kind=$('#kind').value;setting.response=$('#response').value;newSession('name')});}
app.addEventListener('click',handler);$('#homeBtn').addEventListener('click',home);home();
</script></body></html>
