<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>모아 구조대! — 아트 V2 프리뷰</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;background:#0c2f28;color:#173b31}button{font:inherit}.top{height:64px;background:#0a3027;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:relative;z-index:20}.top b{font-size:22px}.top button{width:44px;height:44px;border:0;border-radius:14px;background:#fff;color:#173b31;font-size:24px;cursor:pointer}.wrap{max-width:1180px;margin:0 auto;padding:18px}.scene{position:relative;width:100%;aspect-ratio:566/400;border-radius:28px;overflow:hidden;background:url('scene.jpg') center/cover no-repeat;box-shadow:0 22px 70px #001f1880;border:5px solid #f8f4df;isolation:isolate}.shade{position:absolute;inset:0;background:linear-gradient(180deg,#071e1544,#071e1511 45%,#071e1544);pointer-events:none}.mission{position:absolute;left:18px;top:18px;display:flex;align-items:center;gap:12px;background:#fff8e9f5;border:3px solid #704d2f;border-radius:20px;padding:10px 14px;box-shadow:0 6px 0 #5d3e27,0 12px 24px #1234;z-index:5;max-width:min(520px,66%)}.mission .badge{background:#7a4f2b;color:#fff;padding:5px 9px;border-radius:10px;font-weight:900;font-size:13px;white-space:nowrap}.mission strong{font-size:clamp(18px,2vw,28px);line-height:1.15}.score{margin-left:auto;white-space:nowrap;background:#153d32;color:#fff;border-radius:16px;padding:8px 12px;font-weight:900}.start{position:absolute;inset:0;display:grid;grid-template-columns:1.05fr .95fr;align-items:center;background:linear-gradient(90deg,#102f25f2 0%,#102f25d4 45%,#102f2566 72%,#102f2522);z-index:12;padding:48px}.start-copy{color:#fff;max-width:520px}.start-copy small{display:inline-block;padding:7px 12px;background:#f6cf5e;color:#244637;border-radius:99px;font-weight:900}.start-copy h1{font-size:clamp(42px,7vw,84px);line-height:.95;margin:18px 0 14px;text-shadow:0 5px 0 #0b241d}.start-copy p{font-size:clamp(18px,2vw,28px);line-height:1.5;color:#ecf7f2;margin:0 0 26px}.start-btn{border:0;border-radius:22px;background:linear-gradient(#ffd766,#f5ad21);color:#3d2a11;padding:17px 32px;font-size:28px;font-weight:1000;box-shadow:0 7px 0 #b76e13;cursor:pointer}.heroes{position:relative;height:100%}.heroes img{position:absolute;object-fit:contain;filter:drop-shadow(0 15px 12px #0d2c2388)}.hong{width:58%;right:34%;bottom:2%}.moa{width:52%;right:0;bottom:5%}.hot{position:absolute;border:0;background:transparent;border-radius:50%;cursor:pointer;z-index:6;touch-action:manipulation}.hot:focus-visible{outline:4px solid #fff}.h-r1{left:2%;top:49%;width:16%;height:22%}.h-pig{left:19%;top:38%;width:18%;height:20%}.h-cow{left:46%;top:36%;width:21%;height:24%}.h-r2{left:7%;top:61%;width:20%;height:26%}.h-duck{left:71%;top:59%;width:25%;height:35%}.hot.wrong{animation:shake .35s}.hot.correct:after{content:"";position:absolute;inset:-8px;border:7px solid #ffe15d;border-radius:50%;box-shadow:0 0 0 8px #fff8,0 0 44px 16px #ffe15daa;animation:pulse .65s infinite alternate}.toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#183c31ee;color:#fff;padding:13px 18px;border-radius:99px;font-weight:900;font-size:18px;opacity:0;z-index:9;transition:.25s;box-shadow:0 8px 22px #1236}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.rescuer{position:absolute;width:16%;right:-20%;bottom:4%;z-index:8;opacity:0;filter:drop-shadow(0 10px 8px #183a2b66)}.rescuer.go{animation:rescueRun 1.05s cubic-bezier(.2,.8,.25,1) forwards}.success{position:absolute;inset:0;background:#0f3129cc;backdrop-filter:blur(3px);display:none;place-items:center;z-index:15;padding:24px}.success.show{display:grid}.success-card{width:min(560px,94%);background:#fffbed;border:4px solid #fff;border-radius:30px;padding:28px;text-align:center;box-shadow:0 22px 70px #001b1688;animation:pop .36s ease-out}.success-card img{width:150px;max-width:36%;filter:drop-shadow(0 9px 8px #174b3530)}.success-card h2{font-size:40px;margin:6px 0 4px;color:#1d5a43}.success-card p{font-size:19px;margin:0 0 18px;color:#60756c}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.actions button{border:0;padding:13px 18px;border-radius:16px;font-weight:900;cursor:pointer}.again{background:#1d704f;color:#fff}.back{background:#e8efe9;color:#214237}@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}@keyframes pulse{from{transform:scale(.92);opacity:.7}to{transform:scale(1.05);opacity:1}}@keyframes rescueRun{0%{right:-20%;bottom:4%;opacity:0;transform:scale(.8)}20%{opacity:1}72%{right:14%;bottom:12%;transform:scale(1)}100%{right:17%;bottom:15%;opacity:1;transform:scale(.92)}}@keyframes pop{from{transform:scale(.82);opacity:0}to{transform:scale(1);opacity:1}}
@media(max-width:640px){.top{height:58px;padding:0 10px}.top b{font-size:18px}.wrap{padding:0}.scene{border:0;border-radius:0;width:100vw;height:calc(100svh - 58px);aspect-ratio:auto;background-size:cover;background-position:72% center;box-shadow:none}.start{grid-template-columns:1fr;padding:24px 20px;background:#0d2d25d9;text-align:center;align-content:center}.start-copy{margin:auto}.start-copy h1{font-size:52px}.start-copy p{font-size:17px}.start-btn{font-size:22px}.heroes{height:220px;margin-top:8px}.hong{width:44%;right:48%;bottom:0}.moa{width:41%;right:12%;bottom:3%}.mission{left:10px;right:10px;top:10px;max-width:none;padding:8px 10px;gap:8px}.mission strong{font-size:17px}.mission .badge{font-size:11px}.score{font-size:13px;padding:6px 8px}.h-r1{left:-5%;top:48%;width:25%;height:18%}.h-pig{left:7%;top:37%;width:28%;height:18%}.h-cow{left:35%;top:35%;width:31%;height:20%}.h-r2{left:3%;top:61%;width:29%;height:22%}.h-duck{left:72%;top:59%;width:30%;height:30%}.rescuer{width:29%}.toast{bottom:18px;font-size:15px;white-space:nowrap}.success-card h2{font-size:34px}.success-card p{font-size:16px}}
</style></head><body><header class="top"><button id="back" aria-label="생각정원으로 돌아가기">←</button><b>🌱 모아 구조대!</b><button id="sound" aria-label="소리 켜기/끄기">🔊</button></header><main class="wrap"><section class="scene" id="scene" aria-label="숲속 구조 현장"><div class="shade"></div><div class="mission"><span class="badge">미션 1/1</span><strong>🦆 노란색 큰 오리를 찾아 구조해!</strong><span class="score">⭐ 0/1</span></div><div class="start" id="start"><div class="start-copy"><small>시각·주의 · 조건찾기</small><h1>모아 구조대!</h1><p>설명판을 푸는 게 아니라, 숲속 현장에서 조건에 맞는 친구를 직접 찾아 구조해요.</p><button class="start-btn" id="startBtn">🚨 출동하기</button></div><div class="heroes"><img class="hong" src="../../assets/friend-hong.png" alt="홍"><img class="moa" src="../../assets/moa-discovery.png" alt="모아"></div></div><button class="hot h-r1" data-name="토끼" aria-label="토끼"></button><button class="hot h-pig" data-name="돼지" aria-label="돼지"></button><button class="hot h-cow" data-name="소" aria-label="소"></button><button class="hot h-r2" data-name="토끼" aria-label="토끼"></button><button class="hot h-duck" data-good="1" data-name="큰 노란 오리" aria-label="큰 노란 오리"></button><img class="rescuer" id="rescuer" src="../../assets/moa-discovery.png" alt="구조하러 달려오는 모아"><div class="toast" id="toast" role="status"></div><div class="success" id="success"><div class="success-card"><img src="../../assets/moa-cheer.png" alt="기뻐하는 모아"><h2>구조 성공! ✨</h2><p>노란색 · 큰 크기 · 오리, 세 조건을 모두 확인했어요.</p><div class="actions"><button class="again" id="again">한 번 더 찾기</button><button class="back" id="toGarden">생각정원으로</button></div></div></div></section></main><script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let sound=true,done=false;const say=t=>{if(!sound||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.92;speechSynthesis.speak(u)};function tone(ok){if(!sound)return;try{const A=window.AudioContext||window.webkitAudioContext,a=new A(),o=a.createOscillator(),g=a.createGain();o.frequency.value=ok?740:180;g.gain.value=.05;o.connect(g).connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.22);o.stop(a.currentTime+.23)}catch{}}function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>el.classList.remove('show'),900)}$('#back').onclick=$('#toGarden').onclick=()=>location.href='../../';$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent=sound?'🔊':'🔇';if(!sound)speechSynthesis?.cancel?.()};$('#startBtn').onclick=()=>{$('#start').style.display='none';say('노란색 큰 오리를 찾아 구조해 줘!')};$$('.hot').forEach(b=>b.onclick=()=>{if(done)return;if(!b.dataset.good){tone(false);b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');toast(`${b.dataset.name}는 조건이 달라!`);return}done=true;tone(true);b.classList.add('correct');$('.score').textContent='⭐ 1/1';toast('찾았다! 모아가 구조하러 가요!');$('#rescuer').classList.add('go');say('찾았다! 노란색 큰 오리야. 구조 성공!');setTimeout(()=>$('#success').classList.add('show'),1450)});$('#again').onclick=()=>{done=false;$('#success').classList.remove('show');$('#rescuer').classList.remove('go');$('.h-duck').classList.remove('correct');$('.score').textContent='⭐ 0/1';setTimeout(()=>say('다시 찾아볼까? 노란색 큰 오리!'),100)};
</script></body></html>
