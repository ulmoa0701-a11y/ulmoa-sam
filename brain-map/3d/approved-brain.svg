<title id="title">부위별 색으로 구분한 귀여운 파스텔 뇌 일러스트</title>
<desc id="desc">전두엽은 보라색, 두정엽은 노란색, 측두엽은 연두색, 후두엽은 살구색, 소뇌는 파란색, 뇌줄기는 연보라 회색으로 표시된 교육용 개념도</desc>
