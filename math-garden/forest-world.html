<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5a8f72"><meta name="description" content="모아의 숲 세계 — 모으고, 반려동물을 돌보고, 마을을 짓고, 숲길 모험을 떠나는 하나의 세계">
<title>모아의 숲 세계 | 모아의 숫자 숲</title><link rel="icon" href="../assets/habom-favicon-v3-32.png">
<link rel="stylesheet" href="./forest-world.css?v=20261027-gather1"><script defer src="./forest-world.js?v=20261027-gather1"></script></head>
<body><div class="shell">
<header class="mast"><a href="./" class="back">← 숫자 숲</a><div class="identity">모아의 숫자 숲 <span>· 숲 세계</span></div><div class="controls"><button type="button" id="sound" aria-pressed="true" aria-label="효과음 끄기"></button></div></header>
<main class="main">
<nav class="tabbar" id="tabbar" aria-label="놀이 선택"></nav>
<section class="stage" id="stage" aria-label="모아의 숲 세계">
 <div class="scenery" aria-hidden="true"></div>
 <div id="feedbackFlash" class="feedback-flash" aria-hidden="true"></div>
 <div class="resource-bar" id="resourceBar" aria-label="모은 자원"></div>
 <div class="scenecontent" id="world">

  <div class="panel panel-quest" id="panelQuest" data-panel="quest" hidden>
   <div class="topline"><div><span class="overline">숲속 친구들이 기다려요</span><h1 id="missionTitle">숲길 모험</h1></div><div class="chapters" id="chapters" aria-label="모험 진행 단계"></div></div>
   <div class="storybar"><div class="story-character"><img src="./assets/mission-v4/characters/bear_waiting.png" alt=""></div><div class="story-cloud"><small id="kicker">모아의 숲 세계</small><p id="instruction">어느 숲길로 떠나볼까?</p></div><button id="visualHint" type="button" class="look" aria-label="그림으로 도움받기" title="그림 힌트">?</button></div>
   <div id="play" class="play" aria-live="polite"></div>
   <div class="lower"><p id="status" aria-live="polite"></p><div class="lower-actions"><button id="help" type="button" hidden></button><button id="change" type="button" hidden></button></div></div>
  </div>

  <div class="panel panel-gather" id="panelGather" data-panel="gather" hidden>
   <div id="gatherGuide" class="gather-guide" aria-label="곰돌이의 부탁"></div>
   <div id="gatherTargets" class="gather-targets" aria-label="이번 간식 수량 목표"></div>
   <div class="gather-spots" id="gatherSpots"></div>
   <div id="gatherActions" class="gather-actions"></div>
   <p id="gatherStatus" class="gather-status" role="status" aria-live="polite"></p>
  </div>
  <div class="panel" id="panelPet" data-panel="pet" hidden>
   <div class="pet-scene" id="petScene"></div>
  </div>
  <div class="panel" id="panelBuild" data-panel="build" hidden>
   <div class="build-plot" id="buildPlot" aria-label="내가 지은 마을"></div>
   <div class="build-palette" id="buildPalette" aria-label="지을 수 있는 것"></div>
  </div>

 </div>
</section>
<div id="info" class="small-info">로그인·결제 없이 놀이할 수 있어요. 진행 상황은 이 기기에만 저장돼요. 곰돌이 부탁에 맞게 수를 세어 간식을 준비해요. 모은 간식은 반려동물에게 주거나 마을을 짓는 데 쓸 수 있어요.</div>
</main><footer>모아의 숫자 숲 · 일단 해봄 <a href="./">다른 놀이로 돌아가기 →</a></footer>
</div></body></html>
