<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4c846d">
<meta name="description" content="모아의 숫자 숲. 손으로 나누고, 세고, 모으며 자연스럽게 수 개념을 만나는 무료 놀이 게임. 그림 시범·도움 없는 수행·다른 그림 연습을 구분하는 기초수학 놀이입니다.">
<title>모아의 숫자 숲 — 일단 해봄</title>
<link rel="icon" href="../assets/habom-favicon-v3-32.png">
<link rel="stylesheet" href="../assets/habom-gamja-font.css?v=20261012-readable2">
<link rel="stylesheet" href="./style.css?v=20261021a">
<link rel="stylesheet" href="./v2.css?v=20261021-story1">
<link rel="stylesheet" href="./learning.css?v=20261021-phase1">
<script src="./learning-engine.js?v=20261021-phase1" defer></script>
<script src="./game.js?v=20261021-phase1" defer></script>
</head>
<body>
<div class="app">
<header class="topbar">
 <a href="../gardens/#learning" class="back-link" aria-label="학습정원으로 돌아가기"><span aria-hidden="true">←</span><span>정원으로</span></a>
 <a href="../" class="game-brand" aria-label="일단 해봄 홈페이지"><img src="../assets/habom-approved-wordmark.webp" alt="일단 해봄" width="96" height="33"></a>
 <div class="top-tools"><button id="soundToggle" class="tool-button" type="button" aria-pressed="true" aria-label="소리 끄기">소리 켜짐</button><button id="stageToggle" class="tool-button" type="button" aria-expanded="false" aria-controls="stagePanel">다른 놀이</button></div>
</header>
<main class="game-shell">
 <div class="stage-panel" id="stagePanel" hidden><h2>어디서 놀까?</h2><p>어느 곳이든 자유롭게 시작할 수 있어요.</p><div class="stage-grid" id="stageGrid"></div></div>
 <div class="game-top"><div><p class="eyebrow">모아와 함께하는 숫자 모험</p><h1>모아의 <span>숫자 숲</span></h1></div><div class="hud"><span id="stageName" class="stage-name">숲속 친구들</span><div class="seed-progress" id="seedProgress" aria-label="진행 상태"></div></div></div>
 <section class="world" id="world" aria-label="숫자 숲 게임 화면">
  <div class="sky-decor"><span class="cloud cloud-one"></span><span class="cloud cloud-two"></span><span class="sun"></span><span class="hill hill-one"></span><span class="hill hill-two"></span></div>
  <div class="world-frame">
   <div class="story-guide"><img src="../thinking-garden/assets/moa-discovery.png" alt="" class="moa-character" loading="eager"><div class="guide-bubble"><p class="guide-kicker" id="guideKicker">숫자 숲에 온 걸 환영해!</p><p class="guide-text" id="guideText">숲속 친구들과 놀아 볼까?</p></div><button class="hear-button" id="hearButton" type="button" aria-label="그림 힌트 보기" title="그림 힌트 보기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Zm12-1c2 2 2 6 0 8m2-11c4 4 4 10 0 14"/></svg></button></div>
   <div id="playfield" class="playfield" role="group" aria-label="놀이 공간">
    <div class="welcome"><div class="welcome-trees" aria-hidden="true"><span class="tree"></span><span class="tree small"></span><span class="tree"></span></div><div class="welcome-board"><div class="welcome-fruits" aria-hidden="true"><span class="fruit"></span><span class="fruit"></span><span class="fruit"></span></div><h2>친구들이 기다리고 있어!</h2><p>누르면 숲속 놀이가 시작돼요.</p><button class="primary-button" id="startButton" type="button">숲으로 출발 <span aria-hidden="true">→</span></button></div></div>
   </div>
   <div class="world-ground" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  </div>
 </section>
 <div class="bottom-bar"><p id="status" class="status" role="status" aria-live="polite">준비되면 출발!</p><div class="bottom-actions"><button id="hintButton" type="button" class="secondary-button" hidden>힌트 보기</button><button id="restartButton" type="button" class="secondary-button" hidden>처음부터</button></div></div>
 <p class="small-note">아이마다 배움의 속도는 달라요. 그림 시범과 눈 모양의 도움을 이용할 수 있어요. 도움받은 해결과 스스로 해결한 기록을 구분하며, 기록은 이 기기에만 저장됩니다. 학습효과를 진단하거나 보장하는 기능은 아니에요.</p>
</main>
<footer><a href="../gardens/#learning">모아의 학습정원</a><span>직접 해보고, 조금씩 고쳐가는 일단 해봄</span></footer>
</div>
</body>
</html>
