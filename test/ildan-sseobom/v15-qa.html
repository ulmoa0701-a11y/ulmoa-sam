<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>일단써봄 v15 브라우저 QA</title><style>body{font:16px system-ui}iframe{height:750px;width:95%;border:1px solid #ccd}#log{white-space:pre-wrap}</style></head><body><h1>v15 자동 브라우저 QA · 합성자료 전용</h1><div id="log"></div><iframe id="target" title="테스트 앱" src="design-v15/"></iframe><script>
const log=document.getElementById('log'),frame=document.getElementById('target');
const say=s=>{log.textContent+=s+'\n';console.log(s)};
const ok=(value,message)=>{if(!value)throw Error(message);say('PASS '+message)};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function until(fn,limit=5000){const start=Date.now();while(Date.now()-start<limit){try{if(fn())return;}catch(_){}await sleep(45)}throw Error('TIMEOUT')}
function enter(role){const d=frame.contentDocument;d.querySelector('[data-login-role="'+role+'"]').click();d.getElementById('oneLogin').click();}
function input(el,text){el.value=text;el.dispatchEvent(new Event('input',{bubbles:true}))}
async function run(){
 const d=()=>frame.contentDocument,w=()=>frame.contentWindow;
 try{
  await until(()=>d().getElementById('oneLogin'));
  enter('student');await until(()=>d().getElementById('entryForm'));
  ok(d().getElementById('entryForm').dataset.journalMode==='quick','간편 기록 기본');
  const moodBlock=d().querySelector('#entryForm .student-emotion-quick');
  ok(!!moodBlock&&moodBlock.getBoundingClientRect().height>35,'간편 기록에 감정 선택이 바로 표시됨');
  ok(d().querySelectorAll('#entryForm input[name="emotionChoice"][value="잘 모르겠음"]').length===1,'잘 모르겠음 감정 선택 중복 없음');
  const moodInput=d().querySelector('#entryForm input[name="emotionChoice"][value="걱정"]');
  moodInput.click();
  ok(moodInput.checked,'감정 선택은 선택형 체크박스로 작동');
  ok(!!d().querySelector('.student-examples:not([open])'),'학생 작성 예시는 기본 접힘');
  ok(!d().querySelector('textarea[name="note"]').value,'학생 예시는 기록란에 자동 입력되지 않음');
  const form=d().getElementById('entryForm'),row=form.querySelector('.student-datetime-grid');
  const date=form.querySelector('input[name="date"]'),time=form.querySelector('input[name="time"]'),place=form.querySelector('input[name="place"]');
  ok(!!date&&!!time&&!!place,'날짜·시간·장소 세 항목 실제 입력 필드');
  ok(place.closest('.student-datetime-grid')===row,'장소가 날짜·시간과 같은 줄을 이루는 컨테이너로 이동');
  ok(form.querySelectorAll('input[name="place"]').length===1,'장소 중복 입력 없음');
  const dc=date.getBoundingClientRect(),tc=time.getBoundingClientRect(),pc=place.getBoundingClientRect();
  if(w().innerWidth>=1091){
   ok(Math.abs(dc.top-tc.top)<4&&Math.abs(tc.top-pc.top)<4,'넓은 화면에서 날짜·시간·장소 한 줄 배치');
   ok(dc.right<=tc.left&&tc.right<=pc.left,'넓은 화면에서 세 필드 겹침 없음');
  }else if(w().innerWidth>355){
   ok(Math.abs(dc.top-tc.top)<4&&pc.top>tc.bottom-2,'작은 화면은 날짜·시간 두 칸, 장소 다음 줄');
  }else ok(dc.top<tc.top&&tc.top<pc.top,'좁은 화면은 한 칸씩 배치');
  ok(d().documentElement.scrollWidth<=w().innerWidth+3,'학생 입력 폼 화면 가로 넘침 없음');
  input(place,'가상의 장소');
  const sharePlace=form.querySelector('input[name="shareField"][value="place"]');
  ok(sharePlace&&!sharePlace.disabled,'간편 모드에 보이는 장소를 공유 항목으로 선택 가능');
  form.querySelector('[data-journal-mode="detail"]').click();
  ok(form.querySelector('.student-extra-grid input[name="title"]')!==null,'자세히 모드에서 제목이 단독 줄');
  ok(form.querySelectorAll('input[name="place"]').length===1,'모드 전환 시 장소 중복 없음');
  ok(place.value==='가상의 장소','모드 전환 시 장소 내용 유지');
  form.querySelector('[data-journal-mode="quick"]').click();
  ok(place.value==='가상의 장소','간편 모드로 돌아가도 장소 내용 유지');

  ok(d().querySelector('[data-workspace-target="coding"]')===null,'코딩 실험실 기본 메뉴에서 분리');
  const note='가상 메모: '+('반복 검토를 유발하지 않는 자유로운 문장 연습. '.repeat(9))+'끝까지 보이는 내용';
  input(d().querySelector('textarea[name="note"]'),note);
  d().querySelector('input[name="share"]').click();
  d().getElementById('studentSelectAll').click();
  ok(d().querySelector('input[name="shareField"][value="experience"]').disabled,'간편 화면의 숨김 항목 공유 불가');
  ok(!d().querySelector('input[name="shareField"][value="mood"]').disabled,'간편 화면에서 선택한 감정 공유 여부를 고를 수 있음');
  ok(d().querySelector('input[name="shareField"][value="mood"]').checked,'학생이 전체 선택한 경우에만 선택 감정도 공유');
  d().getElementById('saveEntry').click();
  await until(()=>d().getElementById('shareReviewDialog')?.open);
  ok(d().querySelector('.share-review-body').textContent.includes('끝까지 보이는 내용'),'공유 확인 모달에 전체 글 표시');
  d().querySelector('[data-approve]').click();
  await until(()=>w().PREVIEW_RECORDS.length===1&&d().querySelector('[data-unshare]'));
  ok(w().PREVIEW_RECORDS[0].shared,'가상 학생 공유 등록');
  ok(w().PREVIEW_RECORDS[0].entry.mood.includes('걱정'),'간편 기록 감정 선택이 기록에 저장됨');
  ok(w().PREVIEW_RECORDS[0].sharedEntry.mood.includes('걱정'),'선택한 감정 공유 시에만 치료사 전달 필드에 포함됨');
  w().confirm=()=>true;
  d().querySelector('[data-unshare]').click();
  await until(()=>w().PREVIEW_RECORDS[0]&&!w().PREVIEW_RECORDS[0].shared);
  ok(!w().PREVIEW_RECORDS[0].shared,'공유 취소 및 치료사 접근 중단');
  d().querySelector('[data-workspace-target="write"]').click();
  await until(()=>d().querySelector('textarea[name="note"]'));
  input(d().querySelector('textarea[name="note"]'),'저장 전 임시 보관된 체험글');
  ok(!!w().sessionStorage.getItem('ildan-v15-preview-draft-student'),'체험판 작성 중 세션 임시보관');
  frame.src='design-v15/?qa=restore';
  await until(()=>d().getElementById('oneLogin')&&w().PREVIEW_ROLE==='guest');
  enter('student');
  await until(()=>d().querySelector('textarea[name="note"]')?.value==='저장 전 임시 보관된 체험글');
  ok(true,'새로고침 후 체험 기록 복구');
  d().getElementById('signOut').click();
  await until(()=>d().getElementById('oneLogin'));
  enter('parent');
  await until(()=>d().querySelector('textarea[name="observation"]'));
  const parentQuick=d().getElementById('entryForm');
  const parentRow=parentQuick.querySelector('.parent-when');
  const parentDate=parentQuick.querySelector('input[name="date"]'),parentTime=parentQuick.querySelector('input[name="time"]'),parentPlace=parentQuick.querySelector('input[name="place"]');
  ok(!!parentDate&&!!parentTime&&!!parentPlace&&parentPlace.closest('.parent-when')===parentRow,'학부모 날짜·시간·장소 같은 입력행');
  ok(parentQuick.querySelectorAll('input[name="place"]').length===1,'학부모 장소 중복 없음');
  const pdr=parentDate.getBoundingClientRect(),ptr=parentTime.getBoundingClientRect(),ppr=parentPlace.getBoundingClientRect();
  if(w().innerWidth>=1091)ok(Math.abs(pdr.top-ptr.top)<4&&Math.abs(ptr.top-ppr.top)<4,'PC 학부모 날짜·시간·장소 한 줄');
  else if(w().innerWidth>355)ok(Math.abs(pdr.top-ptr.top)<4&&ppr.top>ptr.bottom-2,'모바일 학부모 날짜·시간 및 장소 자동 줄바꿈');
  else ok(pdr.top<ptr.top&&ptr.top<ppr.top,'아주 좁은 학부모 화면 세로 배치');
  ok(d().documentElement.scrollWidth<=w().innerWidth+3,'학부모 화면 가로 넘침 없음');
  ok(!!parentQuick.querySelector('.parent-examples:not([open])'),'학부모 예시는 기본 접힘');
  ok(!parentQuick.querySelector('textarea[name="observation"]').value,'학부모 예시는 실제 관찰에 자동 입력되지 않음');
  input(d().querySelector('textarea[name="observation"]'),'가상 관찰: 책을 한 번 다시 읽었다.');
  d().getElementById('saveEntry').click();
  await until(()=>w().PREVIEW_RECORDS.length===1&&w().PREVIEW_RECORDS[0].kind==='parent'&&d().querySelector('[data-workspace-view="calendar"]')?.hidden===false);
  ok(!w().PREVIEW_RECORDS[0].shared,'보호자 관찰 기본 비공개');
  d().querySelector('[data-workspace-target="write"]').click();
  await until(()=>d().querySelector('textarea[name="observation"]'));
  const parentForm=d().getElementById('entryForm');
  ok(!!parentForm.querySelector('select[name="origin"]'),'정보 출처가 기본 화면에서 선택 가능');
  ok(!parentForm.querySelector('select[name="origin"]').required,'정보 출처도 필수 입력 아님');
  ok(!!parentForm.querySelector('textarea[name="childWords"]'),'직접 들은 학생 표현은 선택형 상세 항목');
  input(parentForm.querySelector('textarea[name="observation"]'),'가상 관찰: 교재를 다시 펼쳤다.');
  input(parentForm.querySelector('select[name="origin"]'),'직접 관찰');
  input(parentForm.querySelector('textarea[name="childWords"]'),'가상 학생의 말: 지금은 쉬고 싶어요');
  parentForm.querySelector('input[name="share"]').click();
  ok(!!parentForm.querySelector('input[name="shareField"][value="childWords"]'),'아동 실제 발언만 별도로 공유 선택 가능');
  parentForm.querySelector('input[name="shareField"][value="childWords"]').click();
  parentForm.querySelector('input[name="shareField"][value="origin"]').click();
  ok(parentForm.checkValidity(),'보호자 상세 공유 양식 입력 유효');
  ok(parentForm.elements.share.checked,'보호자 선택 공유 활성화');
  ok(parentForm.querySelector('input[name="shareField"][value="observation"]').checked,'관찰 원문 공유 선택');
  await until(()=>!parentForm.querySelector('#saveEntry').disabled);
  parentForm.querySelector('#saveEntry').click();
  await until(()=>d().getElementById('shareReviewDialog')?.open);
  const parentSharePreview=d().querySelector('.share-review-body').textContent;
  ok(parentSharePreview.includes('가상 학생의 말')&&parentSharePreview.includes('직접 관찰'),'공유전 보호자 기록 출처·직접 발언 전체 확인');
  d().querySelector('[data-approve]').click();
  await until(()=>w().PREVIEW_RECORDS.length===2&&w().PREVIEW_RECORDS.some(r=>r.shared));
  const parentShared=w().PREVIEW_RECORDS.find(r=>r.shared);
  ok(parentShared.sharedEntry.childWords.includes('쉬고 싶어요')&&parentShared.sharedEntry.origin==='직접 관찰','치료사와 선택한 출처와 직접 발언만 공유');
  ok(!parentShared.sharedEntry.context&&!parentShared.sharedEntry.after,'선택하지 않은 보호자 상세 항목 제외');
  d().getElementById('signOut').click();
  await until(()=>d().getElementById('oneLogin'));
  enter('therapist');
  await until(()=>d().getElementById('inboxResults'));
  ok(w().PREVIEW_RECORDS.filter(r=>r.shared).length===1,'치료사 조회에 선택한 보호자 공유 기록만 전달');
  ok(!w().PREVIEW_RECORDS.find(r=>!r.shared).sharedEntry?.observation||!w().PREVIEW_RECORDS.find(r=>!r.shared).shared,'비공개 기록은 가상 치료사 조회에서 배제');
  ok(d().getElementById('inboxResults').textContent.includes('아이가 실제로 한 말'),'치료사 화면의 부모 공유 발언 구분 표시');
  // Synthetic therapist-only clinical note interaction and cross-role test.
  d().querySelector('[data-workspace-target="session"]').click();
  await until(()=>d().getElementById('sessionForm')&&d().getElementById('sessionSaved'));
  const clinical=d().getElementById('sessionForm');
  ok(d().querySelectorAll('details.clinician-extra').length===3,'치료사 선택형 사례개념화 ERP CBIT 영역');
  ok([...d().querySelectorAll('details.clinician-extra')].every(el=>!el.open),'임상 상세 항목 기본 접힘');
  input(clinical.querySelector('[name="studentReport"]'),'가상 학생이 직접 전달한 내용');
  input(clinical.querySelector('[name="parentReport"]'),'가상 보호자가 전한 관찰');
  input(clinical.querySelector('[name="observation"]'),'치료사가 직접 본 합성 사실');
  input(clinical.querySelector('[name="workingHypothesis"]'),'아직 확인되지 않은 가설');
  input(clinical.querySelector('[name="alternatives"]'),'다른 설명도 검토 필요');
  input(clinical.querySelector('[name="functionalImpact"]'),'수면·학업 영향은 추가 확인 예정');
  input(clinical.querySelector('[name="burdenReview"]'),'부담 또는 반복 확인이 보고됨');
  input(clinical.querySelector('[name="erpReview"]'),'적합성 평가가 필요함');
  input(clinical.querySelector('[name="cbitReview"]'),'이번 회기에 해당 없음');
  clinical.querySelector('button[type="submit"]').click();
  await until(()=>w().PREVIEW_SESSION_NOTES?.length===1);
  const saved=w().PREVIEW_SESSION_NOTES[0].entry;
  ok(saved.studentReport.includes('직접 전달'),'학생 진술 치료사 저장');
  ok(saved.parentReport.includes('관찰'),'보호자 진술 구별 저장');
  ok(saved.observation.includes('합성 사실'),'직접 관찰 구별 저장');
  ok(saved.workingHypothesis.includes('가설')&&saved.alternatives.includes('설명'),'가설과 대안 구분');
  ok(saved.burdenReview.includes('반복 확인'),'기록 부담 검토 저장');
  ok(saved.erpReview==='적합성 평가가 필요함'&&saved.cbitReview==='이번 회기에 해당 없음','ERP CBIT 검토 상태 기록');
  ok(!saved.erpTarget&&!saved.cbitTarget,'자동 노출·경쟁반응 과제 생성 없음');
  await until(()=>d().getElementById('sessionSaved')?.textContent.includes('다른 설명 가능성'));
  ok(true,'치료사 메모 항목명 표시');
  w().PREVIEW_ROLE='student';
  const illicitSession=await w().fetch('/api/session-notes',{method:'GET'});
  ok(illicitSession.status===403,'학생 역할 치료사 메모 조회 차단');
  const illicitPost=await w().fetch('/api/session-notes',{method:'POST',body:JSON.stringify({entry:{observation:'변조'}})});
  ok(illicitPost.status===403,'학생 역할 치료사 메모 작성 차단');
  const parentRecord=w().PREVIEW_RECORDS[0];
  const illegal=await w().fetch('/api/share',{method:'POST',body:JSON.stringify({recordId:parentRecord.id,sharedFields:['observation']})});
  ok(illegal.status===403,'작성자 아닌 역할의 공유 조작 차단');
  say('BROWSER QA COMPLETED');
  document.documentElement.setAttribute('data-qa-result','PASS');
 }catch(e){say('FAIL '+e.stack);document.documentElement.setAttribute('data-qa-result','FAIL');}
}
run();
</script></body></html>
