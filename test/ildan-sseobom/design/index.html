</style></head><body><div class="previewbar" id="previewInfo"><strong>🧪 화면 디자인 미리보기</strong> · 가상 데이터만 사용해요. 로그인·Google 저장은 아직 연결되지 않았습니다. 실제 이름과 상담 내용은 입력하지 마세요.

<main id="app"><section class="loading">안전하게 화면을 불러오고 있어요.</section></main><div id="toast" class="toast" role="status" aria-live="polite"></div><script>
window.PREVIEW_ROLE='guest';window.PREVIEW_RECORDS=[];

 const urlString=String(url);if(!urlString.startsWith('/api/'))return previewResponse({error:'미리보기 전용'},403);

 if(path==='me')return role==='guest'?previewResponse({error:'미리보기'},401):previewResponse({user:{id:'preview-'+role,nickname:'가상 '+({student:'학생',parent:'학부모',therapist:'치료사'}[role]||'계정'),role}});
 if(path==='records'&&(!opts.method||opts.method==='GET')){
  const list=window.PREVIEW_RECORDS.filter(r=>role==='therapist'?r.shared:r.kind===role);
  return previewResponse({records:list});
 }
 if(path==='records'&&opts.method==='POST'){
  const body=JSON.parse(opts.body||'{}');const id='sample-'+(window.PREVIEW_RECORDS.length+1);
  const record={id,kind:role,author:'가상 '+role,student:'가상 학생',createdAt:new Date().toISOString(),shared:body.share===true,driveSynced:false,entry:body.entry};window.PREVIEW_RECORDS.unshift(record);
  return previewResponse({record},201);
 }
 if(path==='share'){const body=JSON.parse(opts.body||'{}');const entry=window.PREVIEW_RECORDS.find(r=>r.id===body.recordId);if(entry)entry.shared=true;return previewResponse({ok:true});}
 if(path==='students')return previewResponse({students:[{id:'sample-student',nickname:'가상 학생',display_name:'가상 학생'}]});

 if(path==='drive/status')return previewResponse({connected:false,configured:false,folderUrl:null});

 if(path==='logout')return previewResponse({ok:true});
 return previewResponse({error:'이 기능은 화면 미리보기에서 사용할 수 없습니다. 실제 서비스 연결 전이에요.'},503);

const $=(id)=>document.getElementById(id);const app=$('app'),account=$('account');

// The same passkey flow serves students, parents, therapists and administrators.

const fromB64=s=>Uint8Array.from(atob(String(s).replace(/-/g,'+').replace(/_/g,'/').padEnd(Math.ceil(String(s).length/4)*4,'=')),c=>c.charCodeAt(0));

function dataForm(role){if(role==='parent')return `<form class="form" id="entryForm"><label>관찰한 상황<textarea name="observation" maxlength="1200" placeholder="일상에서 실제로 관찰한 모습이나 변화" required></textarea></label><label>치료사에게 전할 내용<textarea name="message" maxlength="1200" placeholder="궁금한 점, 상담 시 전달사항"></textarea></label><label class="checkbox"><input type="checkbox" name="share"><span>담당 치료사에게 이 기록을 전달할게요. (선택하지 않으면 나만 볼 수 있어요.)</span></label><button class="button">관찰 기록 저장</button></form>`;
return `<form class="form" id="entryForm"><label>있었던 일<textarea name="event" maxlength="1200" placeholder="기억에 남는 일이 있으면 한 줄만 적어도 돼요." required></textarea></label><details class="optional-fields"><summary>생각이나 다음 행동도 적기 <small>선택</small></summary><div class="optional-wrap"><label>그때 떠오른 생각<textarea name="thought" maxlength="1200" placeholder="없으면 비워 둬도 괜찮아요."></textarea></label><label>다음에 해보고 싶은 것<textarea name="next" maxlength="1200" placeholder="답을 찾거나 꼭 실천할 필요는 없어요."></textarea></label></div></details><label class="checkbox"><input type="checkbox" name="share"><span>이 기록을 담당 치료사와 공유하기<br><small>체크하지 않으면 나만 볼 수 있어요.</small></span></label><button class="button" id="saveEntry">🔒 나만 보기로 저장</button></form>`;}
function recordCards(){if(!records.length)return '<p>아직 작성된 기록이 없습니다.</p>';return records.map(r=>`<article class="record"><div class="meta">${sanitize(new Date(r.createdAt).toLocaleString('ko-KR'))} · ${r.kind==='student'?'학생':'학부모'} · ${r.shared?'담당 치료사에게 공유됨':'비공개'}${r.driveSynced?' · 드라이브 백업됨':''}</div>${r.entry?Object.entries(r.entry).map(([k,v])=>`<p><b>${({event:'있었던 일',thought:'떠오른 생각',next:'해보고 싶은 것',observation:'관찰 상황',message:'전달 사항',note:'메모',date:'날짜'})[k]||sanitize(k)}:</b> ${sanitize(v)}</p>`).join(''):'<p>기록 내용을 표시할 수 없습니다.</p>'}${(me.role==='student'||me.role==='parent')&&!r.shared?`<div class="buttons"><button class="button-ghost" data-share="${sanitize(r.id)}">담당 치료사에게 공유하기</button></div>`:''}${me.role==='therapist'?`<div class="muted">학생: ${sanitize(r.student)} · 작성자: ${sanitize(r.author)}</div>`:''}</article>`).join('');}
function attachShares(){document.querySelectorAll('[data-share]').forEach(b=>b.onclick=()=>{if(!confirm('이 기록을 담당 치료사에게 공유할까요? 이미 드라이브에 백업된 내용은 철회해도 자동 삭제되지 않습니다.'))return;loading(b,async()=>{await api('share',{method:'POST',body:{recordId:b.dataset.share}});toast('담당 치료사에게 공유되었어요.');await dashboard()})})}
function situationMarkup(){return `<div class="panel full" id="situation"><div class="tag">선택 활동 / 짧은 상황 연습</div><h3>메시지를 보냈는데 답장이 없어요.</h3><p>실제로 확인된 사실과, 아직 확인되지 않은 해석을 구분해 볼까요? 정답 맞히기보다는 여러 가능성을 생각하는 연습입니다.</p><div class="seg"><button type="button" data-scenario="fact">확인된 사실</button><button type="button" data-scenario="guess">가능한 해석</button><button type="button" data-scenario="next">다음에 할 일</button></div><div id="situationOutput" class="callout">원하는 버튼을 눌러 보세요.</div></div>`;}

function codingMarkup(){return `<div class="panel full soft-lab" id="coding"><div class="tag">선택해서 즐기는 활동 · CODING LAB</div><h3>작은 코딩 실험실</h3><p>프로그래밍에 관심이 있다면, 조건에 따라 결과가 바뀌는 실험을 해봐요. 상담 기록과는 별개인 재미 요소예요.</p><label>조건을 골라 보기<select id="codingSelect"><option value="sun">날씨가 맑음</option><option value="rain">비가 옴</option><option value="cloud">구름이 많음</option></select></label><pre id="codingCode" class="code">if (weather === 'sun') {\n  action = '산책';\n} else {\n  action = '실내 활동';\n}</pre><div class="buttons"><button id="runCode" class="button-warm">▶ 실행하기</button></div><div id="codeResult" class="muted" aria-live="polite"></div></div>`;}
function attachCoding(){$('runCode').onclick=()=>{const x=$('codingSelect').value;const act=x==='sun'?'산책':'실내 활동';$('codeResult').textContent=`실행 결과: ${act}. 선택한 조건에 따라 결과가 달라졌어요.`};$('codingSelect').onchange=()=>{$('codeResult').textContent='조건을 바꿨네요. 실행하면 어떻게 될까요?';}}
function studentHome(){const isParent=me.role==='parent';app.innerHTML=hero(isParent?'집에서 관찰한 일 남기기':'나의 기록 공간','필요할 때만 작성하세요. 내가 공유하지 않은 기록은 담당 치료사에게 보이지 않아요.')+`<div class="grid"><section class="panel highlight full first-record"><span class="tag">✏️ 기록하기</span><h2>${isParent?'생활 관찰·전달사항':'내가 남기는 한 장 기록'}</h2><p>${isParent?'관찰한 일이나 치료사에게 전할 말을 적어 주세요.':'매일 쓸 필요는 없어요. 기록할 일이 생겼을 때만 편하게 남겨요.'}</p>${dataForm(me.role)}</section><section class="panel full"><span class="tag">📚 내 기록</span><h2>내가 작성한 기록</h2><p>여기에 저장한 기록은 내 계정에서만 볼 수 있어요.</p><div id="recordsHere">${recordCards()}</div></section></div>${!isParent?`<details class="section-toggle" id="activities"><summary>선택 활동 · 상황 연습과 코딩 실험실</summary>${situationMarkup()}${codingMarkup()}</details>`:''}<p class="field-note" style="margin-top:20px">이 공간은 상담·교육을 돕는 도구예요. 매일 쓰거나 불안 상태를 반복해서 확인할 필요는 없어요.</p>`;
$('entryForm').onsubmit=e=>{e.preventDefault();const f=e.currentTarget;const entry=isParent?{observation:formValue(f,'observation'),message:formValue(f,'message')}:{event:formValue(f,'event'),thought:formValue(f,'thought'),next:formValue(f,'next')};const share=f.elements.share.checked;if(share&&!confirm('담당 치료사에게 이 기록을 공유할까요? 치료사가 드라이브에 복사한 기록은 공유 취소로 자동 삭제되지 않습니다.'))return;loading(f.querySelector('button'),async()=>{await api('records',{method:'POST',body:{entry,share}});toast('기록을 저장했어요.');await dashboard()})};attachShares();if(!isParent){attachSituation();attachCoding();const save=$('saveEntry'),share=$('entryForm').elements.share;share.addEventListener('change',()=>{save.textContent=share.checked?'📤 저장하고 치료사에게 공유':'🔒 나만 보기로 저장';})}}
function exportCSV(){const labels={event:'있었던 일',thought:'떠오른 생각',next:'해보고 싶은 것',observation:'관찰한 상황',message:'전달사항'};function cell(s){let x=String(s??'');if(/^[\s]*[=+\-@\t\r]/.test(x))x="'"+x;return '"'+x.replaceAll('"','""')+'"'}const rows=[['작성일','학생','작성자','유형','기록 내용'],...records.map(r=>[r.createdAt,r.student,r.author,r.kind,Object.entries(r.entry??{}).map(([k,v])=>(labels[k]||k)+': '+v).join('\n')])];const csv='\uFEFF'+rows.map(row=>row.map(cell).join(',')).join('\r\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='일단써봄_담당치료사_공유기록.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
async function therapistHome(){const r=await Promise.all([api('students'),api('drive/status'),api('accounts')]);students=r[0].students;drive=r[1];const accounts=r[2].accounts;app.innerHTML=hero('담당 학생의 공유 기록','학생이 공유한 기록과 학부모가 전달한 기록만 확인합니다. 다른 치료사의 학생 기록은 보이지 않습니다.')+`<div class="grid"><section class="panel highlight full"><span class="tag">📥 공유된 기록</span><h2>담당 기록 <small>(${records.length}건)</small></h2><div class="buttons"><button id="refresh" class="button-ghost">↻ 새 기록 확인</button><button id="csv" class="button-ghost">CSV 다운로드</button></div>${recordCards()}</section><section class="panel"><span class="tag">👥 계정 연결</span><h2>학생·학부모 초대하기</h2><p>초대코드를 전달해 담당 학생·학부모를 연결해요.</p><form id="inviteForm" class="form"><label>초대할 사람<select name="role" id="inviteRole"><option value="student">학생</option><option value="parent">학부모</option></select></label><label id="studentPicker" class="hidden">연결할 학생<select name="studentId">${students.map(s=>`<option value="${sanitize(s.id)}">${sanitize(s.nickname)}</option>`).join('')}</select></label><button class="button">7일짜리 초대코드 만들기</button></form><div id="inviteOutput"></div></section><section class="panel"><span class="tag">계정 도움</span><h2>패스키 재등록 코드</h2><p>기기를 잃어버린 경우 신원 확인 후 30분짜리 재등록 코드를 발급합니다.</p><label>대상 계정<select id="resetUser">${accounts.map(a=>`<option value="${sanitize(a.id)}">${sanitize(a.nickname)} · ${a.role==='student'?'학생':'학부모'}</option>`).join('')}</select></label><div class="buttons"><button id="resetIssue" class="button-ghost" ${accounts.length?'':'disabled'}>재설정 코드 발급</button></div><div id="resetOutput"></div></section><section class="panel full"><span class="tag">☁️ 내 구글 드라이브</span><h2>Google Drive</h2><p>${drive.connected?'내 구글 계정이 연결돼 있습니다.':'구글 계정 연결 전입니다. 학생 기록은 아직 자동 업로드되지 않습니다.'}</p><div class="buttons"><button id="googleConnect" class="button-ghost" ${drive.configured?'':'disabled'}>${drive.connected?'구글 계정 다시 연결':'내 구글 계정 연결'}</button><button id="driveSync" class="button" ${drive.connected?'':'disabled'}>공유 기록 백업</button>${drive.folderUrl?`<a class="button-ghost" href="${sanitize(drive.folderUrl)}" target="_blank" rel="noopener noreferrer">내 드라이브 폴더 열기 ↗</a>`:''}</div>${!drive.configured?hint('구글 OAuth 관리자 설정이 아직 끝나지 않았습니다. 인증을 완료하면 담당 치료사의 구글 계정에만 기록을 복사할 수 있습니다.'):''}</section></div>`;
