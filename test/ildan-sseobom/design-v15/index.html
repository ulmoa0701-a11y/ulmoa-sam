* {box-sizing:border-box}
html {scroll-behavior:smooth}
body {margin:0;min-height:100vh;font-size:16px;line-height:1.65}
button,input,textarea,select {font:inherit}

main {max-width:1080px;margin:0 auto;padding:38px 23px 96px}

.hero h1 {font-size:clamp(27px,4.5vw,37px);margin:5px 0 8px;letter-spacing:-1.25px;line-height:1.35;word-break:keep-all}

.grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.panel {background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:27px;box-shadow:0 6px 26px #294e3610;min-width:0}
.panel.highlight {background:#fff;border:2px solid #94c9b2;box-shadow:0 10px 30px #206e4620}
.panel h2,.panel h3 {margin:7px 0 9px;letter-spacing:-.7px;font-size:clamp(20px,2.7vw,24px);line-height:1.38}

.panel .tag {color:#176a58;font-size:13px;font-weight:850}
.panel .tag.yellow {color:#815c12}
.panel.full {grid-column:1/-1}
.panel.slate,.panel.soft-lab {background:#f9fbf7;color:var(--ink);border-color:var(--line)}
.panel.slate p,.panel.soft-lab p {color:var(--ink-soft)}
.form {display:grid;gap:18px}
label {display:grid;gap:8px;color:var(--ink);font-size:15px;font-weight:750;min-width:0}
input:not([type=checkbox]),textarea,select {display:block;width:100%;min-width:0;border:1.5px solid #a8beb3;border-radius:12px;background:#fff;padding:13px 14px;color:#203436;font-size:16px;outline-offset:2px}
input::placeholder,textarea::placeholder {color:#637b78;opacity:1}
textarea {resize:vertical;min-height:102px;line-height:1.7}
input:focus,textarea:focus,select:focus {outline:2px solid #168268;border-color:#168268}
.checkbox {display:flex;align-items:flex-start;gap:12px;font-size:15px;line-height:1.55;background:#f5f9f6;border:1px solid #e0eae3;padding:15px;border-radius:13px;color:var(--ink)}
.checkbox input {width:23px;height:23px;margin:1px 0 0;flex:none;accent-color:var(--primary)}
.button,.button-ghost,.button-warm {display:inline-flex;align-items:center;justify-content:center;gap:9px;border-radius:12px;border:1px solid transparent;background:var(--primary);color:white;font-weight:800;letter-spacing:-.1px;text-decoration:none;min-height:50px;padding:12px 21px;white-space:normal;line-height:1.4;text-align:center}
.button:hover {background:var(--primary-hover)}

.button-warm {background:#fae5ac;color:#593f0b;border-color:#e4cb86}
.buttons {display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.seg {display:flex;gap:8px;margin:12px 0 16px}
.seg button {flex:0 1 auto;min-height:48px;border-radius:11px;border:1px solid #bbd3c7;background:#fff;padding:11px 16px;font-size:15px;color:var(--ink);font-weight:750;line-height:1.45}
.seg button.on {background:#dceee4;border-color:#39836c;color:#164a3d}
.callout {padding:15px 18px;background:var(--sun);border-left:4px solid #d7b35c;color:#604c23;font-size:14px;line-height:1.7;border-radius:10px;margin:18px 0}
.muted {font-size:14px;color:var(--muted);line-height:1.7}
.record {border:1px solid #d2e1d7;border-radius:15px;padding:17px;margin:12px 0;background:#fff}
.record .meta {color:var(--muted);font-size:13px;margin-bottom:9px}
.record p {white-space:pre-wrap;margin:7px 0;overflow-wrap:anywhere}
.record b {color:var(--ink)}
.line {height:1px;background:var(--line);margin:19px 0}
.code {font-family:ui-monospace,'Cascadia Code',Consolas,monospace;background:#fff;color:#234851;border:1px solid #bcd5c7;border-radius:13px;padding:17px;line-height:1.85;white-space:pre-wrap;overflow:auto;font-size:14px}
.code strong {color:#135c4b}
.small {font-size:13px}
.hidden {display:none!important}
.toast {position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:20;background:#195749;color:#fff;border-radius:12px;padding:13px 22px;max-width:calc(100vw - 30px);box-shadow:0 8px 18px #0002;display:none;font-size:15px}
.toast.visible {display:block}
.welcome {max-width:700px;margin:8px auto 0}
.welcome .panel {padding:30px}

.welcome .buttons {margin:20px 0 9px}
.welcome .hero h1 {font-size:clamp(29px,5vw,39px)}
.role-chip {background:#e5f3ed;color:#145344;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:850}
.loading {text-align:center;padding:65px 10px;color:var(--muted)}
.enroll-details,.optional-fields {border:1px solid var(--line);border-radius:13px;margin-top:18px;background:#fafcf9;overflow:hidden}
.enroll-details>summary,.optional-fields>summary {cursor:pointer;padding:16px 18px;font-weight:800;color:var(--ink);list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px}
.enroll-details>summary::-webkit-details-marker,.optional-fields>summary::-webkit-details-marker {display:none}
.enroll-details>summary::after,.optional-fields>summary::after {content:'＋';color:var(--primary);font-size:23px;line-height:1}
.enroll-details[open]>summary::after,.optional-fields[open]>summary::after {content:'−'}
.enroll-details>form,.enroll-details>.form,.enroll-details>.seg,.enroll-details>p,.optional-fields>.optional-wrap {margin:0 17px 18px}
.enroll-details>.seg {margin-top:6px}
.enroll-details>p {font-size:14px}
.optional-fields {margin-top:0}
.optional-wrap {display:grid;gap:16px;padding-top:1px}
.optional-fields summary {font-size:15px}
.optional-fields small {font-weight:500;color:var(--muted)}
.record-summary {display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px;color:var(--muted);font-size:14px}
.record-summary strong {color:var(--ink)}
.record-visibility {font-size:13px;font-weight:750;padding:3px 10px;border-radius:99px;background:#eaf2e9;color:#315d45}
.section-toggle {border:1px solid var(--line);border-radius:18px;background:#fff;margin:14px 0;padding:0 22px;box-shadow:0 3px 17px #294e3609}
.section-toggle>summary {cursor:pointer;list-style:none;padding:19px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:850;font-size:18px}
.section-toggle>summary::-webkit-details-marker {display:none}
.section-toggle>summary::after {content:'＋';font-size:23px;color:var(--primary);line-height:1}
.section-toggle[open]>summary::after {content:'−'}
.section-toggle .panel {box-shadow:none;border-radius:13px;margin:0 0 20px;padding:20px}
.section-toggle .panel.soft-lab {background:#f8faf5}

@media(min-width:691px){.panel.first-record {max-width:none}.welcome .panel {padding:33px}}

/* Choice lab: low-pressure, light programming playground (no mental-health logging) */
.choice-lab{border:1px solid #dce4ee;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 11px 32px #3146640b;margin-top:12px}
.choice-top{height:38px;padding:0 18px;background:#f7f9fd;border-bottom:1px solid #e6ebf2;display:flex;align-items:center;justify-content:space-between;gap:8px;font:800 10px ui-monospace,'Cascadia Code',monospace;color:#617398;letter-spacing:.06em}
.choice-top-label{display:flex;align-items:center;gap:8px}.choice-top-label span{color:#3cae8c}
.choice-count{font:800 10px ui-monospace,monospace;color:#9aa8bb}
.choice-tabs{display:flex;gap:7px;padding:12px 16px 2px;background:#fff}
.choice-tabs button{border:1px solid #e2e8f2;background:#fafbfe;border-radius:10px;padding:9px 14px;font:750 13px inherit;color:#62708d;min-height:42px;flex:1;white-space:nowrap}
.choice-tabs button.selected{background:#ecf2ff;border-color:#9caeea;color:#344fac;box-shadow:inset 0 -2px 0 #5675db}
.choice-tabs button:hover{border-color:#9fb4df}
.choice-scene{margin:13px 16px 0;border-radius:15px;min-height:133px;display:flex;align-items:center;gap:19px;padding:19px 24px;position:relative;overflow:hidden}
.choice-mint{background:linear-gradient(120deg,#e9f8f1,#f2faf8);color:#235e50}
.choice-lavender{background:linear-gradient(120deg,#eeeefa,#f6f6ff);color:#464a91}
.choice-peach{background:linear-gradient(120deg,#fff0e7,#fff7ed);color:#915238}
.choice-scene-art{position:relative;flex:0 0 100px;height:77px;display:flex;align-items:center;justify-content:center}
.choice-art-chip{background:#fff;border:2px solid currentColor;box-shadow:0 4px 0 #0000000c;color:inherit;border-radius:12px;font:900 19px ui-monospace,monospace;padding:12px 15px;transform:rotate(-7deg);z-index:2}
.choice-art-route{position:absolute;width:65px;height:2px;background:currentColor;opacity:.28;transform:rotate(32deg);left:53px;top:46px}
.choice-art-node{position:absolute;right:-5px;bottom:0;background:#ffffffbe;border:1px solid #ffffffdc;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font:800 15px ui-monospace,monospace}

.choice-columns{display:grid;grid-template-columns:minmax(0,1.06fr) minmax(0,.94fr);gap:13px;padding:14px 16px 11px}
.choice-actions{min-width:0}.choice-section-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 2px 11px}
.choice-section-head strong{font-size:16px}.choice-section-head span{font-size:11px;color:#78879b}
.choice-options{display:grid;gap:8px}
.choice-option{width:100%;border-radius:11px;border:1.5px solid #e1e7ed;background:#fff;min-height:51px;display:flex;align-items:center;gap:12px;text-align:left;color:#273b50;padding:7px 14px;transition:background .13s,border-color .13s}

.choice-option.picked{background:#f1f5ff;border-color:#5c77dc}

 }

 ${['title','date','time','place','note','sketch','mood','energy','thought','body','action','experience','experienceImpact'].map(k=>`<label class="student-share-field"><input type="checkbox" name="shareField" value="${k}"><span>${NOTE_LABELS[k]}</span></label>`).join('')}<p id="studentShareCount" aria-live="polite">보낼 항목을 선택해 줘. 작성하지 않은 항목은 선택되지 않아.</p><p>선택하지 않은 내용은 치료사에게 보내지 않아. 전송 전에 확인할 수 있어.</p></div></div>
 <button class="button entry-save" id="saveEntry">🔒 내 기록 저장</button><p class="student-save-note">매일 쓰지 않아도 괜찮아. 기록을 정확하게 쓰려 애쓸 필요도 없어. 실시간 상담·응급 연락창이 아니야. 체험판의 작성 중 내용은 이 브라우저 세션에만 임시 저장돼.</p>
 </form>`;
}function gatherEntry(f,role){
 const fields=role==='parent'?['date','time','place','observation','origin','context','childWords','response','after','impact','message']:['date','time','place','title','note','energy','thought','body','action','experience','experienceImpact'];
 const entry={};fields.forEach(k=>{const value=formValue(f,k);if(value)entry[k]=value});
 if(role==='parent'){
  const kinds=[...f.querySelectorAll('input[name="signalChoice"]:checked')].map(x=>x.value);
  if(kinds.length)entry.signals=kinds.join(' / ');
 }else{
  const emotions=[...f.querySelectorAll('input[name="emotionChoice"]:checked')].map(x=>x.value);
  const custom=formValue(f,'emotionOther');if(custom)emotions.push(custom);
  if(emotions.length)entry.mood=emotions.join(' · ');
  if(sketchStrokes.length)entry.sketch=JSON.stringify(sketchStrokes);
 }
 return entry;
}

let sketchStrokes=[],sketchActive=false;
function bindSketch(){
 const canvas=$('noteCanvas');if(!canvas)return;const ctx=canvas.getContext('2d');
 const draw=()=>{ctx.clearRect(0,0,760,380);ctx.fillStyle='#fff';ctx.fillRect(0,0,760,380);ctx.strokeStyle='#5362cc';ctx.lineWidth=3.4;ctx.lineJoin='round';ctx.lineCap='round';sketchStrokes.forEach(stroke=>{if(!stroke.length)return;ctx.beginPath();ctx.moveTo(stroke[0][0],stroke[0][1]);if(stroke.length===1)ctx.lineTo(stroke[0][0]+.01,stroke[0][1]);else stroke.slice(1).forEach(p=>ctx.lineTo(p[0],p[1]));ctx.stroke()})};
 const xy=e=>{const r=canvas.getBoundingClientRect();return [Math.min(760,Math.max(0,Math.round((e.clientX-r.left)*760/r.width))),Math.min(380,Math.max(0,Math.round((e.clientY-r.top)*380/r.height)))]};
 const total=()=>sketchStrokes.reduce((a,b)=>a+b.length,0);
 canvas.addEventListener('pointerdown',e=>{if(total()>=240)return;canvas.setPointerCapture(e.pointerId);sketchActive=true;sketchStrokes.push([xy(e)]);draw()});
 canvas.addEventListener('pointermove',e=>{if(!sketchActive||total()>=240)return;const path=sketchStrokes[sketchStrokes.length-1],p=xy(e),q=path[path.length-1];if(Math.abs(p[0]-q[0])+Math.abs(p[1]-q[1])>4){path.push(p);draw()}});
 for(const ev of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(ev,()=>{sketchActive=false});
 $('undoStroke').onclick=()=>{sketchStrokes.pop();draw()};$('clearSketch').onclick=()=>{sketchStrokes=[];draw()};draw();
}

function sharePreview(fields,entry){return fields.map(k=>{const v=String(entry[k]||'');return '• '+(NOTE_LABELS[k]||k)+': '+(k==='sketch'?'[아래 그림 전체 미리보기]':v)}).join('\n\n')}
function confirmSharedEntry(fields,entry){
 return new Promise(resolve=>{
  let d=document.getElementById('shareReviewDialog');
  if(!d){d=document.createElement('dialog');d.id='shareReviewDialog';d.className='share-review-dialog';d.innerHTML='<h2>담당 치료사에게 공유할 내용</h2><p class="share-review-help">아래 항목만 공유돼. 선택하지 않은 내용은 보내지 않아. 실제 체험판에서는 서버로 전송되지 않아.</p><pre class="share-review-body"></pre><div class="share-review-sketch"></div><p class="share-review-help">보낸 뒤에는 공유를 취소할 수 있지만 이미 별도로 복사된 자료까지 되돌릴 수는 없어.</p><div class="share-review-actions"><button type="button" data-cancel class="button-ghost">돌아가기</button><button type="button" data-approve class="button">이 내용 공유하기</button></div>';document.body.append(d);}
  d.querySelector('.share-review-body').textContent=sharePreview(fields,entry);
  const drawing=d.querySelector('.share-review-sketch');
  drawing.innerHTML=fields.includes('sketch')&&entry.sketch?'<div class="sketch-record" data-sketch="'+sanitize(entry.sketch)+'"><div class="sketch-mini-label">공유할 그림 전체</div><canvas width="760" height="380"></canvas></div>':'';
  let completed=false;const finish=ok=>{if(completed)return;completed=true;d.close();resolve(ok)};
  d.querySelector('[data-cancel]').onclick=()=>finish(false);
  d.querySelector('[data-approve]').onclick=()=>finish(true);
  d.oncancel=e=>{e.preventDefault();finish(false)};
  if(typeof d.showModal==='function'){d.showModal();paintSketches();}
  else resolve(confirm('담당 치료사에게 아래 내용만 공유할까?\n\n'+sharePreview(fields,entry)));
 });
}
const PREVIEW_DRAFT_PREFIX='ildan-v15-preview-draft-';
function savePreviewDraft(form,role){
 if(!window.ILDAN_PREVIEW)return;
 try{
  const values=[...form.querySelectorAll('[name]')].map(el=>({name:el.name,value:el.value,type:el.type,checked:el.checked}));
  sessionStorage.setItem(PREVIEW_DRAFT_PREFIX+role,JSON.stringify({savedAt:Date.now(),mode:form.dataset.journalMode||'quick',values,sketch:role==='student'?sketchStrokes:[]}));
 }catch(_){}
}
function restorePreviewDraft(form,role){
 if(!window.ILDAN_PREVIEW)return false;
 try{
  const raw=sessionStorage.getItem(PREVIEW_DRAFT_PREFIX+role);if(!raw)return false;
  const draft=JSON.parse(raw);if(!draft||!Array.isArray(draft.values)||Date.now()-draft.savedAt>12*3600000){sessionStorage.removeItem(PREVIEW_DRAFT_PREFIX+role);return false;}
  const els=[...form.querySelectorAll('[name]')];
  draft.values.forEach((item,i)=>{const el=els[i];if(!el||el.name!==item.name)return;if(el.type==='checkbox'||el.type==='radio')el.checked=!!item.checked;else el.value=String(item.value||'')});
  if(role==='student'){
   sketchStrokes=Array.isArray(draft.sketch)?draft.sketch.slice(0,240):[];
   const mode=draft.mode==='detail'?'detail':'quick';form.dataset.journalMode=mode;
   form.querySelectorAll('[data-journal-mode]').forEach(b=>{const on=b.dataset.journalMode===mode;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on))});
   const hint=document.getElementById('journalModeHint');if(hint)hint.textContent=mode==='quick'?'한 줄만 남겨도 돼. 나머지는 선택이야.':'감정·장소·그림·내 경험도 원하는 만큼 추가해 봐.';
  }
  return true;
 }catch(_){return false}
}
function clearPreviewDraft(role){try{sessionStorage.removeItem(PREVIEW_DRAFT_PREFIX+role)}catch(_){}}

function wireEntryForm(isParent){
 const f=$('entryForm'),button=$('saveEntry'),share=f.elements.share,area=$('sharePicker');
 const restored=restorePreviewDraft(f,me.role);
 const persist=()=>savePreviewDraft(f,me.role);
 f.addEventListener('input',persist);f.addEventListener('change',persist);
 if(restored)toast('이 브라우저에서 작성 중이던 체험 내용을 복구했어.');
 const selectedKeys=()=>[...f.querySelectorAll('input[name="shareField"]:checked')].map(x=>x.value);
 const updateStudentShare=()=>{
  if(isParent)return;
  const entry=gatherEntry(f,'student');
  f.querySelectorAll('input[name="shareField"]').forEach(x=>{
   const mode=f.dataset.journalMode||'quick';const available=!!entry[x.value]&&(mode==='detail'||['note','date','time','place','mood'].includes(x.value));x.disabled=!available;if(!available)x.checked=false;
   x.closest('label')?.classList.toggle('is-unavailable',!available);
  });
  const count=selectedKeys().length;const caption=$('studentShareCount');
  if(caption)caption.textContent=count?`${count}개 항목 선택됨 · 전송 전에 내용을 확인할 수 있어.`:'작성한 항목 중 보내고 싶은 것을 골라줘.';
 };
 share.onchange=()=>{area.hidden=!share.checked;button.textContent=isParent?(share.checked?'짧은 메모 전달하고 저장':'내 메모 저장하기'):(share.checked?'↗ 선택한 항목 공유하고 저장':'🔒 내 기록 저장');if(!isParent)updateStudentShare()};
 // A restored checkbox needs the matching UI; otherwise a hidden share choice could be submitted.
 if(restored)share.onchange();
 if(!isParent){
  const nowBtn=$('studentSetNow');if(nowBtn)nowBtn.onclick=()=>{const date=f.elements.date,time=f.elements.time;if(date)date.value=todayLocal();if(time)time.value=nowLocalTime();updateStudentShare();toast('날짜와 시간을 현재 시각으로 설정했어.');};
  const journalModeHint=$('journalModeHint');
  const modeButtons=[...f.querySelectorAll('button[data-journal-mode]')];
  modeButtons.forEach(modeButton=>modeButton.addEventListener('click',()=>{
    const mode=modeButton.dataset.journalMode;
    f.dataset.journalMode=mode;
    modeButtons.forEach(b=>{const active=b===modeButton;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));});
    if(mode==='quick'&&$('drawPanel')&&!$('drawPanel').hidden){f.querySelector('[data-format="text"]')?.click();}
    if(journalModeHint)journalModeHint.textContent=mode==='quick'?'한 줄만 남겨도 돼. 나머지는 선택이야.':'감정·장소·그림·내 경험도 원하는 만큼 추가해 봐.';
    const extra=mode==='quick'&&['title','energy','thought','body','action','experience','experienceImpact'].some(k=>!!formValue(f,k));
    const summary=$('journalHiddenNotice');if(summary)summary.hidden=!extra;
    updateStudentShare();
  }));
  if(!restored)sketchStrokes=[];bindSketch();
  document.querySelectorAll('[data-format]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-format]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b))});$('textPanel').hidden=b.dataset.format!=='text';$('drawPanel').hidden=b.dataset.format!=='draw';updateStudentShare()});
  f.addEventListener('input',updateStudentShare);f.addEventListener('change',updateStudentShare);
  $('studentSelectAll').onclick=()=>{updateStudentShare();f.querySelectorAll('input[name="shareField"]:not(:disabled)').forEach(x=>x.checked=true);updateStudentShare()};
  $('studentClearAll').onclick=()=>{f.querySelectorAll('input[name="shareField"]').forEach(x=>x.checked=false);updateStudentShare()};
  updateStudentShare();
 }
 f.onsubmit=async e=>{e.preventDefault();const entry=gatherEntry(f,me.role);
  const meaningful=isParent?!!entry.observation:['note','sketch','mood','energy','thought','body','action','experience','experienceImpact'].some(k=>!!entry[k]);
  if(!meaningful){toast(isParent?'직접 보거나 들은 일을 한 문장만 적어 주세요.':'일기, 그림, 감정 등 한 가지 이상 남겨줘.');return;}
  if(isParent&&!entry.date){toast('일이 있었던 날짜를 선택해 주세요.');return;}
  const sharedFields=share.checked?selectedKeys().filter(k=>entry[k]):[];
  if(isParent&&share.checked&&sharedFields.includes('observation')){for(const k of ['date','time','place','signals'])if(entry[k]&&!sharedFields.includes(k))sharedFields.push(k);}
  if(share.checked&&!sharedFields.some(k=>!['date','time','place','title'].includes(k))){toast('공유할 내용을 한 가지 이상 골라줘.');return;}
  if(share.checked&&!(await confirmSharedEntry(sharedFields,entry)))return;
  loading(button,async()=>{await api('records',{method:'POST',body:{entry,share:share.checked,sharedFields}});if(isParent){parentCalendarDate=entry.date;parentCalendarMode='day';activeView='calendar'}else activeView='history';clearPreviewDraft(me.role);toast('내 기록에 저장했어.');await dashboard()});
 };
}

function prettyRecordEntry(entry){return Object.entries(entry??{}).map(([k,v])=> k==='sketch'?`<div class="sketch-record" data-sketch="${sanitize(v)}"><div class="sketch-mini-label">그림 메모</div><canvas width="760" height="380"></canvas></div>`:`<p><b>${sanitize(NOTE_LABELS[k]||k)}</b><br>${sanitize(v)}</p>`).join('');}
function paintSketches(){document.querySelectorAll('[data-sketch]').forEach(el=>{try{const arr=JSON.parse(el.dataset.sketch);if(!Array.isArray(arr)||arr.length>250)return;const ctx=el.querySelector('canvas').getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,760,380);ctx.strokeStyle='#5362cc';ctx.lineWidth=3.5;ctx.lineCap='round';ctx.lineJoin='round';arr.forEach(stroke=>{if(!Array.isArray(stroke)||!stroke.length)return;ctx.beginPath();stroke.slice(0,240).forEach((p,i)=>{if(!Array.isArray(p)||p.length!==2||!Number.isFinite(p[0])||!Number.isFinite(p[1]))return;const x=Math.max(0,Math.min(760,p[0])),y=Math.max(0,Math.min(380,p[1]));i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()});}catch(_){}})}
function parentObservationFacts(entry={}){
 const fields=[['date','관찰 날짜'],['time','시간'],['place','장소'],['origin','정보 출처'],['signals','관찰한 모습(선택)'],['observation','보거나 들은 내용'],['context','그전·당시 상황'],['childWords','아이가 실제로 한 말'],['response','주변 사람의 말·행동'],['after','이후에 이어진 일'],['impact','일상에서 확인된 변화'],['message','보호자 전달사항']];
 return `<div class="observed-facts"><p class="clinical-neutral">보호자가 전달한 기록입니다. 직접 관찰했는지 또는 전해 들었는지 확인하고, 해석과 판단은 치료사가 별도로 검토합니다.</p>${fields.filter(([k])=>entry[k]).map(([k,name])=>`<div class="observed-fact-row"><strong>${name}</strong><span>${sanitize(entry[k])}</span></div>`).join('')}</div>`;
}
function recordCards(list=records){
 if(!list.length)return '<div class="empty-state">아직 남겨둔 기록이 없습니다. 필요할 때만 작성해도 괜찮아요.</div>';
 return list.map(r=>{
  const time=sanitize(new Date(r.createdAt).toLocaleString('ko-KR'));
  const observed=r.entry?.date?`${r.kind==='parent'?'관찰':'기록'} ${sanitize(r.entry.date)}${r.entry.time?' '+sanitize(r.entry.time):''}${r.entry.place?' · '+sanitize(r.entry.place):''} · 작성 ${time}`:time;
  if(me.role==='therapist'&&r.kind==='student'){
   const text=String(r.entry?.note||r.entry?.experience||r.entry?.thought||r.entry?.action||r.entry?.mood||'');
   const short=text.length>120?text.slice(0,120)+'…':text;
   return `<article class="record archive-record"><div class="meta">학생 공유 기록 · ${observed} · ${sanitize(r.student)}</div><div class="parent-inbox-skim">${sanitize(short)||'선택된 공유 내용이 있어.'}</div><details class="parent-inbox-details"><summary>공유한 내용 전체 보기</summary><div class="parent-inbox-full">${prettyRecordEntry(r.entry)}</div></details><p class="muted">학생이 선택해 공유한 내용만 표시돼.</p></article>`;
  }
  if(me.role==='therapist'&&r.kind==='parent'){
   const field=String(r.entry?.observation||r.entry?.message||r.entry?.impact||r.entry?.response||'');
   const preview=field.length>110?field.slice(0,110)+'…':field;
   const place=r.entry?.place?' · '+sanitize(r.entry.place):'';
   const kinds=r.entry?.signals?' · '+sanitize(r.entry.signals):'';
   return `<article class="record parent-inbox-record"><div class="meta">보호자 기록 · ${observed}${place}${kinds} · ${sanitize(r.student)}</div><div class="parent-inbox-skim">${sanitize(preview)||'공유된 메모가 있어요.'}</div><details class="parent-inbox-details"><summary>전달 내용 더 보기</summary><div class="parent-inbox-full">${parentObservationFacts(r.entry)}<div class="muted">학생: ${sanitize(r.student)} · 작성자: ${sanitize(r.author)}</div></div></details></article>`;
  }

function exportCSV(){const labels={event:'있었던 일',thought:'떠오른 생각',next:'해보고 싶은 것',observation:'관찰한 상황',message:'전달사항'};function cell(s){let x=String(s??'');if(/^[\s]*[=+\-@\t\r]/.test(x))x="'"+x;return '"'+x.replaceAll('"','""')+'"'}const rows=[['작성일','학생','작성자','유형','기록 내용'],...records.map(r=>[r.createdAt,r.student,r.author,r.kind,Object.entries(r.entry??{}).map(([k,v])=>(labels[k]||k)+': '+v).join('\n')])];const csv='\uFEFF'+rows.map(row=>row.map(cell).join(',')).join('\r\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='일단써봄_담당치료사_공유기록.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}

</form><div id="sessionSaved"></div></section><section class="panel" data-workspace-view="accounts"><span class="tag">02 / ACCOUNTS</span><h2>학생·학부모 초대하기</h2><p>초대코드를 전달해 담당 학생·학부모를 연결해요.</p><form id="inviteForm" class="form"><label>초대할 사람<select name="role" id="inviteRole"><option value="student">학생</option><option value="parent">학부모</option></select></label><label id="studentPicker" class="hidden">연결할 학생<select name="studentId">${students.map(s=>`<option value="${sanitize(s.id)}">${sanitize(s.nickname)}</option>`).join('')}</select></label><button class="button">7일짜리 초대코드 만들기</button></form><div id="inviteOutput"></div></section><section class="panel" data-workspace-view="accounts"><span class="tag">02 / ACCOUNT HELP</span><h2>패스키 재등록 코드</h2><p>기기를 잃어버린 경우 신원 확인 후 30분짜리 재등록 코드를 발급합니다.</p><label>대상 계정<select id="resetUser">${accounts.map(a=>`<option value="${sanitize(a.id)}">${sanitize(a.nickname)} · ${a.role==='student'?'학생':'학부모'}</option>`).join('')}</select></label><div class="buttons"><button id="resetIssue" class="button-ghost" ${accounts.length?'':'disabled'}>재설정 코드 발급</button></div><div id="resetOutput"></div></section><section class="panel full" data-workspace-view="drive"><span class="tag">03 / GOOGLE DRIVE</span><h2>Google Drive</h2><p>${drive.connected?'내 구글 계정이 연결돼 있습니다.':'구글 계정 연결 전입니다. 학생 기록은 아직 자동 업로드되지 않습니다.'}</p><div class="buttons"><button id="googleConnect" class="button-ghost" ${drive.configured?'':'disabled'}>${drive.connected?'구글 계정 다시 연결':'내 구글 계정 연결'}</button><button id="driveSync" class="button" ${drive.connected?'':'disabled'}>공유 기록 백업</button>${drive.folderUrl?`<a class="button-ghost" href="${sanitize(drive.folderUrl)}" target="_blank" rel="noopener noreferrer">내 드라이브 폴더 열기 ↗</a>`:''}</div>${!drive.configured?hint('구글 OAuth 관리자 설정이 아직 끝나지 않았습니다. 인증을 완료하면 담당 치료사의 구글 계정에만 기록을 복사할 수 있습니다.'):''}</section></div></div></div>`;
attachShares();bindWorkspace();paintSketches();initSessionNotes();const rerenderInbox=()=>{const name=$('filterStudent').value,kind=$('filterKind').value;const list=records.filter(r=>(name==='all'||r.student===name)&&(kind==='all'||r.kind===kind));$('inboxResults').innerHTML=recordCards(list);paintSketches();};$('filterStudent').onchange=rerenderInbox;$('filterKind').onchange=rerenderInbox;$('refresh').onclick=()=>dashboard();$('csv').onclick=exportCSV;$('inviteRole').onchange=()=>{$('studentPicker').classList.toggle('hidden',$('inviteRole').value!=='parent')};$('inviteForm').onsubmit=e=>{e.preventDefault();const f=e.currentTarget;loading(f.querySelector('button'),async()=>{const out=await api('invites',{method:'POST',body:{role:formValue(f,'role'),studentId:formValue(f,'studentId')}});const div=$('inviteOutput');div.innerHTML='<p class="muted">초대코드는 한 번만 사용할 수 있으며 7일 뒤 만료됩니다. 개인적인 방법으로 전달하세요.</p><textarea id="inviteCode" readonly></textarea><button class="button-ghost" type="button" id="copyCode">초대코드 복사</button>';$('inviteCode').value=out.invite;$('copyCode').onclick=()=>{navigator.clipboard.writeText(out.invite).then(()=>toast('초대코드를 복사했어요.'))}})};
$('resetIssue').onclick=e=>loading(e.target,async()=>{if(!confirm('대상자의 신원을 별도로 확인했나요?'))return;const result=await api('reset/create',{method:'POST',body:{userId:$('resetUser').value}});$('resetOutput').innerHTML='<p>30분 뒤 만료되는 재설정 코드입니다.</p><textarea readonly id="resetCode"></textarea>';$('resetCode').value=result.resetCode;});$('googleConnect').onclick=()=>{location.assign('/api/drive/start')};$('driveSync').onclick=e=>loading(e.target,async()=>{const x=await api('drive/sync',{method:'POST'});toast(`${x.synced}건을 담당 치료사의 드라이브에 백업했습니다.`);await dashboard()});}
function adminHome(){app.innerHTML=hero('계정 운영','최초 관리자 계정은 기록을 읽을 수 없습니다. 치료사 초대만 발급할 수 있어요.')+`<div class="panel"><h2>치료사 초대코드 발급</h2><p>치료사도 학생·학부모와 같은 패스키 방식으로 등록합니다.</p><button id="inviteTherapist" class="button">치료사 초대코드 만들기</button><div id="adminInvite"></div></div>`;$('inviteTherapist').onclick=e=>loading(e.target,async()=>{const r=await api('invites',{method:'POST',body:{role:'therapist'}});const d=$('adminInvite');d.innerHTML='<p>코드를 복사해 치료사에게 개별 전달하세요. 7일간 유효합니다.</p><textarea readonly id="adminCode"></textarea>';$('adminCode').value=r.invite;})}
async function dashboard(){header();records=me.role==='admin'?[]:(await api('records')).records??[];if(me.role==='therapist')await therapistHome();else if(me.role==='admin')adminHome();else studentHome();}
function render(){header();if(!me)loginScreen();else dashboard().catch(e=>{app.innerHTML=hint('화면을 불러오지 못했어요. '+sanitize(e.message))})}
(async()=>{try{me=(await api('me')).user}catch{me=null}render()})();
