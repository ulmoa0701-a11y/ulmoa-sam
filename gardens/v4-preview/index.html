const DATA={"cognitive": {"name": "인지정원", "subtitle": "살펴보고 · 기억하고 · 반응하기", "x": 24, "y": 28, "hint": "나무 위 작은 탐험 집", "games": [{"title": "모아의 마법 꽃밭 🌰", "href": "thinking-garden/games/hand-mirror/"}, {"title": "모아 구조대!", "href": "thinking-garden/games/rescue/"}, {"title": "기억꽃길 이어가기", "href": "thinking-garden/?game=memory"}, {"title": "쌍둥이 모양 찾기", "href": "thinking-garden/?game=sameShape"}, {"title": "꽃만 쏙쏙 찾기", "href": "thinking-garden/?game=flower"}, {"title": "잎사귀 숨은친구", "href": "thinking-garden/?game=hide"}, {"title": "반짝이 길 따라가기", "href": "thinking-garden/?game=path"}, {"title": "초록불에 톡!", "href": "thinking-garden/?game=calm"}, {"title": "정원 안에 별 심기", "href": "thinking-garden/?game=inside"}, {"title": "하나씩 깨우기", "href": "thinking-garden/?game=targets"}, {"title": "숲속 장면 탐정", "href": "thinking-garden/?game=sceneDetect"}, {"title": "꽃과 단서 찾기", "href": "thinking-garden/?game=slowScan"}, {"title": "정원 지도 따라 놓기", "href": "thinking-garden/?game=slowPlace"}, {"title": "블록 건축가", "href": "thinking-garden/?game=slowBlock"}, {"title": "친구 이름 탐정", "href": "thinking-garden/?game=slowName"}, {"title": "꽃자리 기억하기", "href": "thinking-garden/?game=slowMemory"}, {"title": "정원길 쓱싹 칠하기", "href": "thinking-garden/?game=paint"}, {"title": "시든 꽃 깨우기", "href": "thinking-garden/?game=water"}, {"title": "꼬인 신호 구조대", "href": "thinking-garden/?game=resetRescue"}, {"title": "우리 교실 이사작전", "href": "thinking-garden/?game=classroomMove"}, {"title": "바뀐 준비물 찾기", "href": "thinking-garden/games/moa-missions/?game=change"}], "focusX": 29, "focusY": 28}, "thinking": {"name": "생각정원", "subtitle": "규칙을 찾고 · 계획하기", "x": 62, "y": 29, "hint": "물길이 만나는 연못", "games": [{"title": "바뀌는 바람우체국", "href": "thinking-garden/?game=rulePost"}, {"title": "거울연못의 비밀", "href": "thinking-garden/?game=mirrorPond"}, {"title": "축제 준비 대작전", "href": "thinking-garden/?game=festivalPlan"}], "focusX": 62, "focusY": 26}, "learning": {"name": "학습정원", "subtitle": "읽고 · 쓰고 · 생활에 써보기", "x": 22, "y": 61, "hint": "이야기가 가득한 책방", "games": [{"title": "띄어쓰기 다리 놓기", "href": "thinking-garden/?game=spacing"}, {"title": "고장 난 간판 고치기", "href": "thinking-garden/?game=spelling"}, {"title": "가방 준비 탐험", "href": "thinking-garden/?game=slowEveryday"}, {"title": "모아의 화폐 가게", "href": "thinking-garden/games/moa-missions/?game=money"}], "focusX": 20, "focusY": 57}, "music": {"name": "음악정원", "subtitle": "듣고 · 움직이고 · 연주하기", "x": 83, "y": 43, "hint": "숲속 작은 공연장", "games": [{"title": "박자꽃 톡톡!", "href": "thinking-garden/games/rhythm-touch/"}, {"title": "리코더 마법정원", "href": "thinking-garden/recorder/"}, {"title": "박자 바람", "href": "breath-garden/?mode=beat"}], "focusX": 80, "focusY": 39}, "heart": {"name": "마음정원", "subtitle": "마음 알아보고 · 쉬어가기", "x": 78, "y": 75, "hint": "장미꽃 아래 쉼터", "games": [{"title": "바람의 힘", "href": "breath-garden/?mode=strength"}, {"title": "오래 후~", "href": "breath-garden/?mode=long"}, {"title": "마음 이야기 탐험", "href": "thinking-garden/games/moa-missions/?game=feel"}], "focusX": 77, "focusY": 76}};
const BASE='https://ulmoa0701-a11y.github.io/ulmoa-sam/';
const ids=Object.keys(DATA),names=ids.map(k=>DATA[k].name),$=id=>document.getElementById(id);
const all=ids.flatMap(k=>DATA[k].games.map((g,i)=>({...g,garden:k,number:i+1})));
let active=null,page=0,selectedFilter='all',lastFocus=null,journeyScroll=0;
function safeRoute(state,title,url){if(location.origin==='null'||location.protocol==='about:')return;try{history.pushState(state,title,url)}catch(e){console.warn('History navigation unavailable in local preview',e.name)}}
function el(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x}
function hrefFor(g){return new URL(g.href,BASE).href}
function approvedThumb(g){const img=el('img');img.loading='lazy';img.decoding='async';img.alt='';const ref={cognitive:'friend-hong.png',thinking:'friend-ru.png',learning:'friend-saem.png',music:'friend-ti.png',heart:'moa-discovery.png'}[g.garden];img.src=BASE+'thinking-garden/assets/'+ref;img.onerror=()=>{img.style.display='none';};return img}
function constructPortal(k){const d=DATA[k],b=el('button','destination');b.type='button';b.dataset.garden=k;b.style.setProperty('--x',d.x+'%');b.style.setProperty('--y',d.y+'%');b.setAttribute('aria-label',d.name+' 탐험하기, 게임 '+d.games.length+'개');const s=el('span','wood-sign');s.append(el('strong','',d.name),el('small','',d.games.length+'개 게임'));b.append(s);b.addEventListener('click',()=>enter(k));$('destinations').append(b);const quick=el('button','',d.name);quick.dataset.section=k;quick.addEventListener('click',()=>enter(k));$('bottom').append(quick)}
ids.forEach(constructPortal);
ids.forEach(k=>{const d=DATA[k],b=el('button','journey-destination');b.type='button';b.dataset.garden=k;b.setAttribute('aria-label',d.name+'에 들어가기');const x=Math.max(0,Math.min(100,((d.x*2.5-50)/1.5))),y=Math.max(0,Math.min(100,((d.y*2.5-50)/1.5)));b.style.setProperty('--crop',x.toFixed(1)+'% '+y.toFixed(1)+'%');const label=el('span','journey-sign');label.append(el('strong','',d.name),el('small','',d.subtitle),el('em','',d.games.length+'개 게임 탐험하기 ↗'));b.append(label);b.addEventListener('click',()=>enter(k));$('mobileJourney').append(b)});
$('bottom').querySelector('[data-section=all]').addEventListener('click',()=>showLibrary());
function syncNavigation(){document.querySelectorAll('#bottom [data-section]').forEach(b=>b.setAttribute('aria-current',String(b.dataset.section===active)));}
function enter(k,updateHistory=true){if(!DATA[k])return;if(active===null)journeyScroll=$('worldViewport').scrollTop;active=k;page=0;selectedFilter='all';$('roomTitle').textContent=DATA[k].name;$('roomDesc').textContent=DATA[k].subtitle;$('roomCount').textContent=DATA[k].games.length+' GAMES';$('roomHero').style.setProperty('--focus',DATA[k].focusX+'% '+DATA[k].focusY+'%');$('room').classList.add('is-active');$('library').classList.remove('is-active');renderTrail();syncNavigation();$('room').scrollTop=0;$('worldViewport').scrollTop=0;if(updateHistory)safeRoute({garden:k},'',location.pathname+location.search+'#'+k)}
function showMap(updateHistory=true){active=null;$('room').classList.remove('is-active');$('library').classList.remove('is-active');syncNavigation();if(window.innerWidth<=600)$('worldViewport').scrollTop=journeyScroll;if(updateHistory)safeRoute({garden:null},'',location.pathname+location.search);}
function renderTrail(){const d=DATA[active];if(!d)return;const start=page*3,total=Math.ceil(d.games.length/3),visible=d.games.slice(start,start+3),t=$('trail');t.replaceChildren();
 visible.forEach((g,i)=>{const card=el('article','stop'),media=el('div','stop-top'),body=el('div','stop-body'),h=el('h3','',g.title),actions=el('div','stop-actions'),preview=el('button','','미리보기'),link=el('a','','게임 시작 ↗');media.style.setProperty('--thumb-x',String(12+((start+i)*29)%76)+'%');media.style.setProperty('--thumb-y',String(18+((start+i)*17)%61)+'%');media.append(approvedThumb({...g,garden:active}),el('span','stop-number',String(start+i+1).padStart(2,'0')));preview.type='button';preview.addEventListener('click',()=>showPreview(g));link.href=hrefFor(g);link.target='_blank';link.rel='noopener noreferrer';actions.append(preview,link);body.append(h,actions);card.append(media,body);t.append(card)});
 $('pagePosition').textContent='게임 '+(start+1)+'–'+Math.min(start+3,d.games.length)+' / '+d.games.length;$('walkProgress').textContent=(page+1)+' / '+total;$('walkPrev').disabled=page===0;$('walkNext').disabled=page>=total-1;
}
$('walkPrev').addEventListener('click',()=>{if(page>0){page--;renderTrail();$('room').scrollTo({top:$('roomHero').clientHeight,behavior:'smooth'})}});
$('walkNext').addEventListener('click',()=>{const len=DATA[active]?.games.length||0;if((page+1)*3<len){page++;renderTrail();$('room').scrollTo({top:$('roomHero').clientHeight,behavior:'smooth'})}});
$('roomBack').addEventListener('click',()=>showMap());$('homeTop').addEventListener('click',()=>showMap());$('libraryBack').addEventListener('click',()=>showMap());$('allTop').addEventListener('click',()=>showLibrary());
function showLibrary(updateHistory=true){if(active===null)journeyScroll=$('worldViewport').scrollTop;active='all';$('worldViewport').scrollTop=0;$('room').classList.remove('is-active');$('library').classList.add('is-active');$('library').scrollTop=0;syncNavigation();renderLibraryFilters();renderLibrary();if(updateHistory)safeRoute({garden:'all'},'',location.pathname+location.search+'#all')}
function renderLibraryFilters(){const r=$('libraryFilters');r.replaceChildren();[['all','전체'],...ids.map(k=>[k,DATA[k].name])].forEach(([k,name])=>{const b=el('button','',name);b.type='button';b.setAttribute('aria-pressed',String(selectedFilter===k));b.addEventListener('click',()=>{selectedFilter=k;renderLibraryFilters();renderLibrary()});r.append(b)})}
function renderLibrary(){const q=$('librarySearch').value.trim().toLocaleLowerCase('ko'),items=all.filter(g=>(selectedFilter==='all'||g.garden===selectedFilter)&&(!q||g.title.toLocaleLowerCase('ko').includes(q))),r=$('libraryResults');r.replaceChildren();for(const g of items){const a=el('a');a.href=hrefFor(g);a.target='_blank';a.rel='noopener noreferrer';const content=el('div');content.append(el('small','',DATA[g.garden].name),el('span','',g.title+' ↗'));a.append(content);r.append(a)}if(!items.length)r.append(el('p','','찾는 게임이 없어요. 다른 단어를 써봐!'))}
$('librarySearch').addEventListener('input',renderLibrary);
function showPreview(g){lastFocus=document.activeElement;$('previewTitle').textContent=g.title;$('previewLink').href=hrefFor(g);$('previewFrame').src=hrefFor(g);$('preview').showModal()}
function closePreview(){$('previewFrame').removeAttribute('src');$('preview').close();lastFocus?.focus()}
$('previewClose').addEventListener('click',closePreview);$('preview').addEventListener('close',()=>{$('previewFrame').removeAttribute('src');lastFocus?.focus()});$('preview').addEventListener('click',e=>{if(e.target===$('preview'))closePreview()});
window.addEventListener('popstate',()=>{const id=decodeURIComponent(location.hash.slice(1));if(id==='all')showLibrary(false);else if(DATA[id])enter(id,false);else showMap(false)});
const initial=decodeURIComponent(location.hash.slice(1));if(initial==='all')showLibrary(false);else if(DATA[initial])enter(initial,false);
// Center mobile panorama without affecting real buttons.
if(window.innerWidth>600 && window.innerWidth<=900){requestAnimationFrame(()=>{$('worldViewport').scrollLeft=Math.max(0,($('world').clientWidth-$('worldViewport').clientWidth)*.32)})}
console.info('Five gardens V4 ready: '+all.length+' real game URLs; 5 garden destinations.');
</script></body></html>
