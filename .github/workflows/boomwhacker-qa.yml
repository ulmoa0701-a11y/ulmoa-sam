name: Boomwhacker QA
on:
  push:
    branches: [feat/boomwhacker-studio]
permissions:
  contents: write
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/boomwhacker-studio
      - name: Apply Heart Score link in workspace
        run: python3 boomwhacker/apply-heart-link.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Korean fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
      - name: Install Playwright core
        run: npm install --no-save playwright-core@1.56.1
      - name: Locate Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
      - name: Start static server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/boom-server.log 2>&1 &
          echo $! > /tmp/boom-server.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:8765/boomwhacker/ >/dev/null && exit 0; sleep .25; done
          cat /tmp/boom-server.log
          exit 1
      - name: Run browser QA
        run: node boomwhacker/qa.mjs
      - name: Commit verified Heart Score link
        run: |
          if git diff --quiet -- heart-score/index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add heart-score/index.html
          git commit -m 'Connect Heart Score to Boomwhacker [verified]'
          git push origin HEAD:feat/boomwhacker-studio
      - name: Upload QA screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boomwhacker-qa
          path: boomwhacker/qa-artifacts
          if-no-files-found: warn
