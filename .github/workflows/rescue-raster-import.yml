name: Rescue isolated raster import
on:
  pull_request:
    paths:
      - '.github/workflows/rescue-raster-import.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --quiet Pillow
      - name: Build isolated animal sprites with four colors
        env:
          ASSET_URLS: "{\"rabbit\":\"https://media.canva.com/v2/image-resize/format:PNG/height:194/quality:100/uri:ifs%3A%2F%2FM%2F022ce80b-e009-435f-8d33-ecdc92ac2e84/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAKqjYsSG3STrdJKzG7EUXSDHeAOvmRNByftBhNw9XsWQ&exp=1791551577&osig=AAAAAAAAAAAAAAAAAAAAAJXy23TXthFMzcfUhaL8tbo8Q2VKSJx_4soM7ovVQlNb&signer=media-rpc&token=AAIAAU0AJDAyMmNlODBiLWUwMDktNDM1Zi04ZDMzLWVjZGM5MmFjMmU4NAAAAAABoSDLm6ilvu34Z_bn6bkUef97C2ZZkA8YsjSKkIou92oBquVDOw&x-canva-quality=thumbnail\",\"pig\":\"https://media.canva.com/v2/image-resize/format:PNG/height:188/quality:100/uri:ifs%3A%2F%2FM%2F9be2da31-5ea7-4118-ac66-e9a40d3c230e/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAAYbctxodMihZf_PoQZigPWlXaxX7HB0n8eZDfECzGoS&exp=1791554241&osig=AAAAAAAAAAAAAAAAAAAAANmsZAQYMHglN1iYtZtsoCygE2hx2jXlATtZ1L_CiH1A&signer=media-rpc&token=AAIAAU0AJDliZTJkYTMxLTVlYTctNDExOC1hYzY2LWU5YTQwZDNjMjMwZQAAAAABoSD0Qeg9EBE9zk8bqNAjvQb8J8mk-ej_unvMsO_i57W1cKpV-w&x-canva-quality=thumbnail\",\"cow\":\"https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F8ad8e90c-dc50-4799-9ab9-d57c4b412812/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAANG6AoSbovDpx4toYzV0y5lgpT6GktmQ_G5WjOFpksoO&exp=1791551320&osig=AAAAAAAAAAAAAAAAAAAAAPZ-3xGss-tM0eT7TvCTaDNRqx1kq_JVU1vy0-K2uh5l&signer=media-rpc&token=AAIAAU0AJDhhZDhlOTBjLWRjNTAtNDc5OS05YWI5LWQ1N2M0YjQxMjgxMgAAAAABoSDHr8DlOpPKV62YxcjimDEr33TKwfXJ6agZ-Zk6fOr2B-L-PA&x-canva-quality=thumbnail\",\"duck\":\"https://media.canva.com/v2/image-resize/format:PNG/height:196/quality:100/uri:ifs%3A%2F%2FM%2F199a769d-f05b-41ed-b49c-e03d40f676f2/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAPVTqS4oi5BD45mfZEbM_ablycHRLIDDUoy6-ljo7Gti&exp=1791553192&osig=AAAAAAAAAAAAAAAAAAAAABqyMaWeohws-sVYr5vIz8y9tlN1yYSp_2WFciq86wh4&signer=media-rpc&token=AAIAAU0AJDE5OWE3NjlkLWYwNWItNDFlZC1iNDljLWUwM2Q0MGY2NzZmMgAAAAABoSDkQEAeU9hy_WSAiLWYOVLv9dlHvGJ59f67UjW0yOnu2l_uJw&x-canva-quality=thumbnail\"}"
        run: |
          python - <<'PY'
          import os,json,urllib.request,io,colorsys
          from pathlib import Path
          from PIL import Image
          target=Path('thinking-garden/games/rescue/art/animals')
          target.mkdir(parents=True,exist_ok=True)
          urls=json.loads(os.environ['ASSET_URLS'])
          hues={'yellow':48/360,'blue':210/360,'green':142/360,'red':357/360}
          for species,url in urls.items():
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=35) as response:
              data=response.read(5_000_000)
            im=Image.open(io.BytesIO(data)).convert('RGBA')
            print('SOURCE',species, im.size, 'bytes',len(data))
            assert max(im.size)>=190,'Thumbnail too small'
            alpha=im.getchannel('A'); bbox=alpha.point(lambda v:255 if v>=16 else 0).getbbox()
            assert bbox,'Transparent or empty source'
            im=im.crop(bbox)
            im.thumbnail((226,226),Image.Resampling.LANCZOS)
            square=Image.new('RGBA',(256,256))
            square.alpha_composite(im,((256-im.width)//2,(256-im.height)//2))
            square.save(target/(species+'-master.webp'),quality=88,method=6)
            for color,hue in hues.items():
              img=square.copy()
              if color!='yellow':
                pix=img.load()
                for y in range(img.height):
                  for x in range(img.width):
                    red,green,blue,alpha=pix[x,y]
                    if alpha<4: continue
                    h,s,v=colorsys.rgb_to_hsv(red/255,green/255,blue/255)
                    # Recolor golden fur, not pink noses/ears, eyes, or orange beaks.
                    if .100<h<.196 and s>.31 and v>.22:
                      strength=min(1,max(0,(h-.100)/.025))
                      hh=(hue+(h-.138)*.21)%1
                      ss=min(.74,max(.48,s*.86))
                      rr,gg,bb=colorsys.hsv_to_rgb(hh,ss,v)
                      pix[x,y]=(round(red*(1-strength)+rr*255*strength),round(green*(1-strength)+gg*255*strength),round(blue*(1-strength)+bb*255*strength),alpha)
              name=species+'-'+color+'.webp'
              img.save(target/name,quality=88,method=6)
              print('SPRITE',name, (target/name).stat().st_size)
          assert len(list(target.glob('*-*.webp')))==20
          PY
      - name: Commit isolated raster assets to design branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thinking-garden/games/rescue/art/animals/
          if ! git diff --cached --quiet; then
            git commit -m "Import four polished independent characters in sixteen playable color variants"
            git push origin HEAD:${{ github.head_ref }}
          fi
