name: Habom Unified Staging Security and UI QA
on:
  push:
    branches: [feature/habom-unified-secure-20261012]
    paths:
      - 'request-next/**'
      - '.github/workflows/habom-unified-staging-qa.yml'
  pull_request:
    paths:
      - 'request-next/**'
      - '.github/workflows/habom-unified-staging-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse code and validate secure API
        run: |
          node --check request-next/src/worker.js
          node --check request-next/site/app.js
          node --test request-next/tests/security.test.mjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright core
        run: npm install --no-save playwright-core@1.56.1
      - name: Run viewport and interaction QA using test-only mock API
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export CHROME_BIN
          python3 -m http.server 8765 --bind 127.0.0.1 --directory request-next/site >/tmp/habom-stage.log 2>&1 &
          sleep 2
          node request-next/tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: habom-unified-staging-screenshots
          path: habom-staging-*.png
          if-no-files-found: ignore
