name: Rescue Visual Audit Screenshots
on:
  pull_request:
    paths: ['.github/workflows/rescue-ux-audit.yml']
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download existing published-game QA screenshots for visual audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/ulmoa0701-a11y/ulmoa-sam/actions/artifacts/11617978419/zip" -o /tmp/qa-art.zip
          unzip -l /tmp/qa-art.zip | head -40
          unzip -oq /tmp/qa-art.zip -d /tmp/qa-images
          python3 -m pip -q install --break-system-packages Pillow
          python3 - <<'PY'
          import pathlib,base64,io
          from PIL import Image
          p=pathlib.Path('/tmp/qa-images')
          files=list(p.rglob('*.png'))
          print("SCREENSHOT_NAMES",[f.name for f in files],flush=True)
          for key in ['mobile-390x844-briefing','mobile-390x844-round3-complete','mobile-390x844-round4-complete','mobile-390x844-round5-complete','desktop-1440x900-round3-complete']:
            matches=[f for f in files if key in f.name]
            if not matches: continue
            im=Image.open(matches[0]).convert('RGB')
            im.thumbnail((800,960))
            o=io.BytesIO()
            im.save(o,'JPEG',quality=55,optimize=True)
            print('AUDIT_IMAGE_BEGIN',key,base64.b64encode(o.getvalue()).decode(),'AUDIT_IMAGE_END',flush=True)
          PY