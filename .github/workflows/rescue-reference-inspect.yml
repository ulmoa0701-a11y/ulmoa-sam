name: Reference implementation inspection
on:
  pull_request:
    paths:
      - '.github/workflows/rescue-reference-inspect.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect public game routes and media assets
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,re,html,collections
          origin='https://rootedu.kr'
          def get(path,limit=500000):
            u=urllib.parse.urljoin(origin,path)
            req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=14) as f:
              return f.status,f.url,f.headers.get('content-type',''),f.read(limit).decode('utf-8','replace')
          status,url,ct,src=get('/games')
          print('ROOT',status,url,ct,len(src))
          links=sorted(set(html.unescape(v) for v in re.findall(r'(?:href|src|imageSrc)=[\"\']([^\"\']+)',src)))
          print('GAME_LINKS', [v for v in links if '/games/' in v][:80])
          print('MEDIA_REFERENCES', [v for v in links if re.search(r'\.(png|jpe?g|webp|avif|svg|gif)(?:\?|$)',v,re.I)][:60])
          print('STATIC_COUNTER',collections.Counter(re.findall(r'\.(png|jpe?g|webp|avif|svg|gif)(?:\?|&|[\"\'])',src,re.I)))
          candidates=[x for x in links if x.startswith('/games/') and not x.endswith(('.jpg','.png','.svg','.webp')) and len(x.split('/'))>2]
          routes=list(dict.fromkeys(['/games/race','/games/brain','/games/memory']+candidates))[:5]
          for path in routes:
            try:
              status,url,ct,content=get(path)
              assets=sorted(set(html.unescape(v) for v in re.findall(r'(?:src|href|imageSrc)=[\"\']([^\"\']+)',content)))
              media=[v for v in assets if re.search(r'\.(png|jpe?g|webp|avif|svg|gif)(?:\?|$)',v,re.I)]
              script=[v for v in assets if v.endswith('.js') or '.js?' in v]
              print('ROUTE',path,status,'size',len(content),'title',re.findall(r'<title[^>]*>([^<]*)',content,re.I)[:1])
              print(' ROUTE_MEDIA',media[:24])
              print(' ROUTE_SCRIPT_COUNT',len(script),'CANVAS',content.count('<canvas'),'SVG',content.count('<svg'),'IMG',content.count('<img'),'PICTURE',content.count('<picture'))
              print(' ROUTE_FLAGS',[(x,content.lower().count(x)) for x in ('phaser','pixi','unity','react','next','three','webgl')])
            except Exception as e: print('ROUTE_ERROR',path,str(e)[:300])
          PY
