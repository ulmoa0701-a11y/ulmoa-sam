name: Reference implementation inspection
on:
  pull_request:
    paths:
      - '.github/workflows/rescue-reference-inspect.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Collect public reference technology details
        run: |
          python3 - <<'PY'
          import urllib.request,re
          for url in ['https://rootedu.kr/games','https://rootedu.kr/games/']:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; educational browser)'})
              with urllib.request.urlopen(req,timeout=10) as f:
                html=f.read(500000).decode('utf8','replace')
                print('REFERENCE URL',url,'STATUS',f.status,'FINAL',f.url,'HTML_LEN',len(html))
                print('PAGE_TITLE', re.findall(r'<title[^>]*>([^<]*)',html,re.I)[:3])
                print('META_GENERATOR', re.findall(r'<meta[^>]*name=["\']generator["\'][^>]*>',html,re.I)[:3])
                print('SCRIPT_SRCS',re.findall(r'<script[^>]*src=["\']([^"\']+)',html,re.I)[:24])
                print('CSS_HREFS',re.findall(r'<link[^>]*href=["\']([^"\']+)',html,re.I)[:24])
                print('GRAPHICS_MARKERS',[(s,html.lower().count(s)) for s in ['canvas','svg','phaser','pixi','three','unity','react','next','webgl','iframe','sprite','lottie']])
                print('HTML_SAMPLE',re.sub(r'\s+',' ',html[:2600]))
                break
            except Exception as e:
              print('ERROR',url,str(e)[:280])
          PY
