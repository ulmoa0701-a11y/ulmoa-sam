name: Number Forest Child-Play QA
on:
  push:
    branches: [main]
    paths:
      - 'math-garden/**'
      - 'gardens/index.html'
      - 'index.html'
      - 'qa/math-number-forest-qa.mjs'
      - '.github/workflows/math-number-forest-qa.yml'
  pull_request:
    paths:
      - 'math-garden/**'
      - 'gardens/index.html'
      - 'index.html'
      - 'qa/math-number-forest-qa.mjs'
      - '.github/workflows/math-number-forest-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  child-play-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test browser driver
        run: npm install --no-save playwright-core@1.56.1
      - name: Find Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Verify JavaScript syntax
        run: node --check math-garden/game.js
      - name: Start local site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/math-forest-server.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:8765/math-garden/ >/dev/null && exit 0; sleep 0.25; done
          cat /tmp/math-forest-server.log
          exit 1
      - name: Play every stage on mobile and desktop
        run: node qa/math-number-forest-qa.mjs
      - name: Verify public game after deployment
        if: github.event_name == 'push'
        run: |
          for i in $(seq 1 75); do
            if curl -fsSL --max-time 10 "https://ulmoa0701-a11y.github.io/ulmoa-sam/math-garden/?v=$GITHUB_SHA" | grep -Fq "game.js?v=20261021a"; then
              if curl -fsSL --max-time 10 "https://ulmoa0701-a11y.github.io/ulmoa-sam/?v=$GITHUB_SHA" | grep -Fq 'href="math-garden/"'; then
                echo "Public game and homepage link verified";exit 0
              fi
            fi
            sleep 4
          done
          echo "Game or homepage has not propagated to GitHub Pages";exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: number-forest-qa-images
          path: qa/math-forest-artifacts
          if-no-files-found: warn
