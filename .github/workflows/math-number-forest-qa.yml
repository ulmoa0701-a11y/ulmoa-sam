name: Number Forest Child-Play QA
on:
  push:
    branches: [main]
    paths:
      - 'math-garden/**'
      - 'gardens/index.html'
      - 'index.html'
      - 'qa/math-number-forest-qa.mjs'
      - 'qa/math-learning-engine-qa.mjs'
      - 'qa/math-guided-mission-qa.mjs'
      - 'qa/math-direct-delivery-qa.mjs'
      - 'qa/math-instant-play-qa.mjs'
      - '.github/workflows/math-number-forest-qa.yml'
  pull_request:
    paths:
      - 'math-garden/**'
      - 'gardens/index.html'
      - 'index.html'
      - 'qa/math-number-forest-qa.mjs'
      - 'qa/math-learning-engine-qa.mjs'
      - 'qa/math-guided-mission-qa.mjs'
      - 'qa/math-direct-delivery-qa.mjs'
      - 'qa/math-instant-play-qa.mjs'
      - '.github/workflows/math-number-forest-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  child-play-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chrome driver
        run: npm install --no-save playwright-core@1.56.1
      - name: Resolve Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Check game and learning-engine logic
        run: |
          node --check math-garden/game.js
          node --check math-garden/mission.js
          node --check math-garden/learning-engine.js
          node qa/math-learning-engine-qa.mjs
      - name: Start test site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/math-forest-server.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:8765/math-garden/ >/dev/null && exit 0; sleep 0.25; done
          cat /tmp/math-forest-server.log
          exit 1
      - name: Play 15 adventures with mouse and mobile viewport
        run: node qa/math-number-forest-qa.mjs
      - name: Test guided mathematical learning cycle and independent transfer
        run: node qa/math-guided-mission-qa.mjs
      - name: Test one-by-one feeding and accessible delivery alternative
        run: node qa/math-direct-delivery-qa.mjs
      - name: Test instant play without instructions or next buttons
        run: node qa/math-instant-play-qa.mjs
      - name: Confirm current public release
        if: github.event_name == 'push'
        run: |
          for i in $(seq 1 70); do
            if curl -fsSL --max-time 10 "https://ulmoa0701-a11y.github.io/ulmoa-sam/math-garden/?v=$GITHUB_SHA" | grep -Fq 'learning.css?v=20261021-phase1'; then
              if curl -fsSL --max-time 10 "https://ulmoa0701-a11y.github.io/ulmoa-sam/math-garden/assets/forest-world.svg?v=$GITHUB_SHA" | grep -Fq 'svg'; then
                echo "Public updated game and art verified";exit 0
              fi
            fi
            sleep 4
          done
          echo "New forest art/game not visible on public Pages";exit 1
      - name: Verify guided mission public route
        if: github.event_name == 'push'
        run: |
          for i in $(seq 1 75); do
            if curl -fsSL --max-time 10 "https://ulmoa0701-a11y.github.io/ulmoa-sam/math-garden/mission.html?v=$GITHUB_SHA" | grep -Fq 'mission.js?v=20261022-play2'; then
              if curl -fsSL --max-time 10 "https://ulmoa0701-a11y.github.io/ulmoa-sam/math-garden/?v=$GITHUB_SHA" | grep -Fq 'mission-front-link'; then
                echo "Public guided mission and entry verified";exit 0
              fi
            fi
            sleep 4
          done
          echo "Guided mission not yet published";exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: number-forest-story-game-screenshots
          path: |
            qa/math-forest-artifacts
            qa/math-mission-artifacts
          if-no-files-found: warn
