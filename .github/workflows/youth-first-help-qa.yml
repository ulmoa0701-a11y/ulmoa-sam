name: Youth First Help Browser QA
on:
  pull_request:
    paths:
      - 'support-first/**'
      - 'qa/youth-first-help-qa.mjs'
      - '.github/workflows/youth-first-help-qa.yml'
  push:
    branches: [main]
    paths:
      - 'support-first/**'
      - 'qa/youth-first-help-qa.mjs'
      - '.github/workflows/youth-first-help-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: |
          npm install --no-save --no-package-lock playwright-core@1.56.1
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Start local test server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/youth-first-help.log 2>&1 &
          for n in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/support-first/try/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/youth-first-help.log
          exit 1
      - name: Run browser scenarios at mobile and desktop widths
        env:
          YOUTH_BASE: http://127.0.0.1:8765/
        run: node qa/youth-first-help-qa.mjs
      - name: Keep screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youth-first-help-screenshots
          path: qa/youth-first-help-artifacts/
          if-no-files-found: warn
