name: Habom Private Form DOM Inspection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/habom-private-dom-inspection.yml'
      - 'request/index.html'
      - 'assets/community-board.css'
permissions:
  contents: read
jobs:
  form-dom:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save playwright-core@1.56.1
      - name: Inspect live public/private forms without submitting
        shell: bash
        run: |
          cat > /tmp/hb-private-dom.cjs <<'JS'
          const {chromium}=require(process.cwd()+'/node_modules/playwright-core');
          const fs=require('node:fs');
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_BIN||'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              for(const vp of [{width:1360,height:900},{width:390,height:844}]){
                const page=await browser.newPage({viewport:vp,locale:'ko-KR'});
                const messages=[];
                page.on('console',m=>{if(m.type()==='error')messages.push(m.text().slice(0,180))});
                page.on('pageerror',e=>messages.push(e.message.slice(0,180)));
                await page.goto('https://ulmoa0701-a11y.github.io/ulmoa-sam/request/#private',{waitUntil:'domcontentloaded',timeout:40000});
                await page.waitForTimeout(3500);
                const nested=page.frames().find(f=>f.url().includes('/262832846022052'));
                if(!nested)throw Error('Private frame missing');
                const frame=page.locator('#habomPrivateForm');
                const outer=await frame.evaluate(e=>({height:e.offsetHeight,clientWidth:e.clientWidth,styleHeight:e.style.height,scrolling:e.getAttribute('scrolling'),src:e.src,handlerActive:!!window.jotformEmbedHandler}));
                const inner=await nested.evaluate(()=>{
                  let scroller=document.scrollingElement||document.documentElement;
                  let selected=[...document.querySelectorAll('select')].map(e=>({name:e.name,value:e.value,selectedText:e.selectedOptions[0]?.textContent?.trim(),options:[...e.options].slice(0,7).map(o=>o.textContent.trim().slice(0,25))}));
                  let radios=[...document.querySelectorAll('input[type=radio]')].slice(0,15).map(e=>({name:e.name,parent:e.closest('li')?.innerText.slice(0,50)}));
                  let labels=[...document.querySelectorAll('.form-line')].map(e=>({id:e.id,classes:e.className,label:e.querySelector('.form-label')?.innerText?.trim().slice(0,100),rect:Math.round(e.getBoundingClientRect().height)})).slice(0,27);
                  let texts=[...document.querySelectorAll('h1,h2,.form-header-group')].map(e=>e.innerText.slice(0,90)).slice(0,10);
                  let stepText=[...document.querySelectorAll('.form-line')].map(e=>e.textContent||'').filter(e=>/①\s*어떤 이야기인가요|②\s*내용을 적어주세요|③\s*마지막으로 작성자 정보/.test(e)).map(e=>e.trim().slice(0,85));
                  let styles={bodyFont:getComputedStyle(document.body).fontFamily,bodyFontSize:getComputedStyle(document.body).fontSize,background:getComputedStyle(document.body).backgroundColor};
                  let lastVisibleBottom=Math.ceil(document.querySelector('#id_13')?.getBoundingClientRect().bottom||0);
                  return {scrollHeight:scroller.scrollHeight,clientHeight:scroller.clientHeight,overflowY:getComputedStyle(document.documentElement).overflowY,bodyHeight:document.body.scrollHeight,bodyWidth:document.body.scrollWidth,viewportWidth:innerWidth,selected,radios,labels,texts,styles,stepText,lastVisibleBottom,plain:document.body.innerText.slice(0,500)};
                });
                console.log('AUDIT '+vp.width+' OUTER '+JSON.stringify(outer));
                console.log('AUDIT '+vp.width+' INNER '+JSON.stringify(inner));
                console.log('AUDIT '+vp.width+' ERRORS '+JSON.stringify(messages));
                const order=inner.labels.filter(e=>e.label).map(e=>e.label);
                const positions=['구분','제목 (선택)','내용','파일 첨부 (선택)','닉네임 (선택)','비밀글 공개 범위'].map(t=>order.findIndex(s=>s.includes(t)));
                const isOrdered=positions.every((p,i)=>p>=0&&(i===0||p>positions[i-1]));
                const nickname=inner.labels.find(e=>e.label&&e.label.includes('닉네임 (선택)'));
                console.log('AUDIT '+vp.width+' FIELD_FLOW '+JSON.stringify({order,positions,isOrdered,nicknameRequired:nickname?.classes.includes('jf-required'),internalScrollbar:inner.scrollHeight>outer.height+4}));
                if(!isOrdered)throw Error('Still wrong private field order: '+order.join(' > '));
                const expectedSteps=['① 어떤 이야기인가요?','② 내용을 적어주세요','③ 마지막으로 작성자 정보'];
                const stepPositions=expectedSteps.map(t=>inner.stepText.findIndex(s=>s.includes(t)));
                if(stepPositions.some(p=>p<0)||stepPositions.some((p,i)=>i>0&&p<=stepPositions[i-1]))throw Error('Private three section headings missing or wrong order '+JSON.stringify(inner.stepText));
                if(inner.texts.length<1||!inner.texts[0].includes('소통하기'))throw Error('Private form heading mismatch '+JSON.stringify(inner.texts));
                const firstSelect=inner.selected.find(s=>s.name==='q19_input');
                if(!firstSelect||firstSelect.value!=='자료 요청')throw Error('Private default not applied '+JSON.stringify(firstSelect));
                if(nickname?.classes.includes('jf-required'))throw Error('Private nickname unexpectedly required');
                if(outer.scrolling!=='no')throw Error('Inner Jotform scrolling is not disabled');
                if(!outer.styleHeight)throw Error('Auto-resize handler did not attach to direct #private navigation');
                if(inner.lastVisibleBottom>outer.height-4)throw Error('The submit button content is clipped by iframe height: '+inner.lastVisibleBottom+' vs '+outer.height);
                if(inner.scrollHeight>outer.height+4)console.log('AUDIT MINOR: Jotform reports an extra '+(inner.scrollHeight-outer.height)+'px scroll range, but the content is visible and iframe scrollbar suppressed');
                const removed=await nested.locator('#id_16, #id_17, #id_18').count();
                if(removed!==0)throw Error('Redundant public-only fields or block still visible in private form');
                const fieldLabels=inner.labels.filter(e=>e.label).map(e=>e.label);
                if(fieldLabels.filter(x=>x.startsWith('제목 (선택)')).length!==1)throw Error('Duplicate title input still exists');
                console.log('AUDIT '+vp.width+' SIMPLIFIED_PRIVATE '+JSON.stringify({removed,visibleInputLabels:fieldLabels}));
                
                await page.close();
              }
            }finally{await browser.close()}
          })().catch(e=>{console.error(e.stack||String(e));process.exit(1)});
          JS
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export CHROME_BIN
          node /tmp/hb-private-dom.cjs
