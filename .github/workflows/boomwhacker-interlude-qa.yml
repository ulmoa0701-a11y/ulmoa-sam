name: Boomwhacker Musical Interlude QA
on:
  pull_request:
    paths:
      - 'boomwhacker/index.html'
      - 'boomwhacker/interlude-qa.mjs'
      - '.github/workflows/boomwhacker-interlude-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-audio-cues:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locate Chromium
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Install free browser driver
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
      - name: ACTUALLY render intro accompaniment, check beat synchronization and cancellation in Chrome
        run: node boomwhacker/interlude-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boomwhacker-interlude-qa
          path: boomwhacker/interlude-qa-artifacts
          if-no-files-found: warn
