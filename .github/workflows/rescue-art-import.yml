name: Stage illustrated rescue sprites
on:
  pull_request:
    paths:
      - '.github/workflows/rescue-art-import.yml'
permissions:
  contents: write
jobs:
  import:
    if: github.head_ref == 'feat/rescue-raster-art-20261009'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rescue-raster-art-20261009
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet Pillow numpy
      - name: Transfer uploaded game assets and build illustrated WebP textures
        env:
          SOURCE_RABBIT: 'https://media.canva.com/v2/image-resize/format:PNG/height:194/quality:100/uri:ifs%3A%2F%2FM%2F022ce80b-e009-435f-8d33-ecdc92ac2e84/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAN85Tg6sce7ue_Kfzkaq3dUZ0sjzVeti5nFCsveedg6u&exp=1791565977&osig=AAAAAAAAAAAAAAAAAAAAACEQbm3gZmzlswUPrQg3d9r-YkmLX-M_SWUqS34rJP4y&signer=media-rpc&token=AAIAAU0AJDAyMmNlODBiLWUwMDktNDM1Zi04ZDMzLWVjZGM5MmFjMmU4NAAAAAABoSGnVahQmR_XOgutGvOKBJWpeGVLTsvygHZFjnf8_1N5eoVYoQ&x-canva-quality=thumbnail'
          SOURCE_PIG: 'https://media.canva.com/v2/image-resize/format:PNG/height:188/quality:100/uri:ifs%3A%2F%2FM%2F9be2da31-5ea7-4118-ac66-e9a40d3c230e/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAObaLwXej9nOCYf8a-B6kMKYh2Th-J4KfeX5qb4aCfV_&exp=1791565041&osig=AAAAAAAAAAAAAAAAAAAAAAj4XD4aPtn3nL_vDTfxtObVjVP5CX44j6OXa3mTm4lV&signer=media-rpc&token=AAIAAU0AJDliZTJkYTMxLTVlYTctNDExOC1hYzY2LWU5YTQwZDNjMjMwZQAAAAABoSGZDWh91imptfdOzyDsiFQLou5FiWQUSjlo9sAKghnM7GgMbg&x-canva-quality=thumbnail'
          SOURCE_COW: 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F8ad8e90c-dc50-4799-9ab9-d57c4b412812/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAACQFUxtKVLWmNCXg0rj7FM0YrrPqCBJCaYQzfxVSp5e-&exp=1791565720&osig=AAAAAAAAAAAAAAAAAAAAAMPrUgXlcRxorOpMNFoH_sAOAaZ8bmQEil7KeQmA6m-v&signer=media-rpc&token=AAIAAU0AJDhhZDhlOTBjLWRjNTAtNDc5OS05YWI5LWQ1N2M0YjQxMjgxMgAAAAABoSGjacDgDk_Wbxb6VdtaQbQGwFF0VgMCcIoWWenuAZPQRUG1eQ&x-canva-quality=thumbnail'
          SOURCE_DUCK: 'https://media.canva.com/v2/image-resize/format:PNG/height:196/quality:100/uri:ifs%3A%2F%2FM%2F199a769d-f05b-41ed-b49c-e03d40f676f2/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAOT4BKKJTWlqkWzD0FcFBz3I3aLt7kj95hFGuB05O9CI&exp=1791567592&osig=AAAAAAAAAAAAAAAAAAAAAMj7yxsYp6AXefNEhK5PvxN9AZAEXn6_zS8-AS8cswn6&signer=media-rpc&token=AAIAAU0AJDE5OWE3NjlkLWYwNWItNDFlZC1iNDljLWUwM2Q0MGY2NzZmMgAAAAABoSG_-kAzLtwLpuupOORLJ2eKKtWQ-ImrBsnB2yND2-eiB4pkjg&x-canva-quality=thumbnail'
        run: |
          python - <<'PY'
          import os,urllib.request,pathlib
          root=pathlib.Path('thinking-garden/games/rescue/import-sources')
          root.mkdir(parents=True,exist_ok=True)
          for species in ('rabbit','pig','cow','duck'):
              url=os.environ['SOURCE_'+species.upper()]
              request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(request,timeout=35) as response:
                  assert response.status==200
                  data=response.read()
              assert len(data)>15000,(species,len(data))
              (root/(species+'.png')).write_bytes(data)
              print('downloaded',species,len(data),flush=True)
          PY
          python thinking-garden/games/rescue/build_illustrated.py
      - name: Commit only raster output (never expire-bearing image URLs)
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add thinking-garden/games/rescue/art/illustrated
          git diff --cached --check
          git commit -m 'Stage 16 independent raster sprites from generated character originals'
          git push origin HEAD:feat/rescue-raster-art-20261009
