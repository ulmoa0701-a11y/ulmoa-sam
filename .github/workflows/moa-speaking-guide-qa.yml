name: Moa Speaking Guide Visual QA
on:
  pull_request:
    paths:
      - 'assets/moa-page-guide.css'
      - 'qa/moa-speaking-guide-qa.mjs'
      - 'index.html'
      - 'brain-map/index.html'
      - 'materials/index.html'
      - 'notes/index.html'
      - 'parents/index.html'
      - 'info/index.html'
      - 'request/index.html'
      - 'gardens/index.html'
      - 'music-garden/index.html'
      - 'thinking-garden/index.html'
      - '.github/workflows/moa-speaking-guide-qa.yml'
  push:
    branches: [main]
    paths:
      - 'assets/moa-page-guide.css'
      - 'qa/moa-speaking-guide-qa.mjs'
      - 'index.html'
      - 'brain-map/index.html'
      - 'materials/index.html'
      - 'notes/index.html'
      - 'parents/index.html'
      - 'info/index.html'
      - 'request/index.html'
      - 'gardens/index.html'
      - 'music-garden/index.html'
      - 'thinking-garden/index.html'
      - '.github/workflows/moa-speaking-guide-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guide-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chrome QA client (zero-cost)
        run: |
          npm install --no-save --no-package-lock playwright-core@1.56.1
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Serve site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/moa-guide.log 2>&1 &
          for n in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/brain-map/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/moa-guide.log
          exit 1
      - name: Verify real page UI on 4 responsive viewports
        env:
          MOA_BASE: http://127.0.0.1:8765/
        run: node qa/moa-speaking-guide-qa.mjs
      - name: Verify live Pages after deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          MOA_BASE: https://ulmoa0701-a11y.github.io/ulmoa-sam/
        run: |
          for n in $(seq 1 40); do
            curl --silent --show-error --location --max-time 15 -o /tmp/moa-guide-live.html "${MOA_BASE}brain-map/" || true
            curl --silent --show-error --location --max-time 15 -o /tmp/moa-nav-live.js "${MOA_BASE}assets/habom-navigation.js?v=20261022-menu1" || true
            if grep -Fq 'moa-page-guide.css?v=20261022-speak1' /tmp/moa-guide-live.html && grep -Fq "name:'뇌지도'" /tmp/moa-nav-live.js; then
              echo "Current guide found on public Pages, now running real browser QA."
              node qa/moa-speaking-guide-qa.mjs
              exit 0
            fi
            echo "GitHub Pages propagation pending ($n/40)"
            sleep 12
          done
          echo "No confirmed public deployment of Moa guide"
          exit 1
      - name: Keep screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moa-speaking-guide-screenshots
          path: qa/moa-speaking-artifacts/
          if-no-files-found: warn
