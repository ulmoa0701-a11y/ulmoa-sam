name: Brain Toy 3D Browser QA
on:
  pull_request:
    paths:
      - 'brain-map/3d/**'
      - '.github/workflows/brain-toy3d-qa.yml'
  push:
    branches: [main]
    paths:
      - 'brain-map/3d/**'
      - '.github/workflows/brain-toy3d-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runtime
        run: |
          npm install --no-save --no-package-lock playwright-core@1.56.1
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
      - name: Start static homepage
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/brain-qa-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/brain-map/3d/explore/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/brain-qa-http.log
          exit 1
      - name: Test live 3D rotation and mobile
        env:
          BRAIN_BASE: http://127.0.0.1:8765/
        run: node brain-map/3d/explore/brain-qa.mjs
      - name: Publish test captures
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brain-toy-3d-qa
          path: brain-map/3d/explore/qa-artifacts/
          if-no-files-found: warn
