name: Five Gardens Storybook Map QA
on:
  pull_request:
    paths:
      - 'gardens/index.html'
      - 'gardens/story-map.css'
      - 'gardens/map-*.svg'
      - 'qa/five-gardens-map-qa.mjs'
      - '.github/workflows/five-gardens-map-qa.yml'
  push:
    branches: [main]
    paths:
      - 'gardens/index.html'
      - 'gardens/story-map.css'
      - 'gardens/map-*.svg'
      - 'qa/five-gardens-map-qa.mjs'
      - '.github/workflows/five-gardens-map-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  map-layout-and-garden-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test driver
        run: npm install --no-save playwright-core@1.56.1
      - name: Find Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Start local site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/gardens-map-server.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:8765/gardens/ > /dev/null && exit 0; sleep 0.25; done
          cat /tmp/gardens-map-server.log
          exit 1
      - name: Visual map and navigation QA
        run: node qa/five-gardens-map-qa.mjs
      - name: Verify published garden navigation matches checked-out version
        if: github.event_name == 'push'
        env:
          TEST_BASE_URL: https://ulmoa0701-a11y.github.io/ulmoa-sam
        run: |
          if grep -Fq 'story-map.css' gardens/index.html; then
            EXPECTED_MARKER='story-map.css?v=20261029-v1'
          else
            EXPECTED_MARKER='<nav class="garden-jumps" aria-label="정원 선택">'
          fi
          for i in $(seq 1 60); do
            if curl -fsSL --max-time 12 "$TEST_BASE_URL/gardens/?rollback=$GITHUB_SHA" | grep -Fq "$EXPECTED_MARKER"; then
              node qa/five-gardens-map-qa.mjs
              exit $?
            fi
            sleep 4
          done
          echo "Current garden navigation has not reached Pages"
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: five-gardens-storybook-map-screenshots
          path: qa/five-gardens-map-artifacts
          if-no-files-found: warn
