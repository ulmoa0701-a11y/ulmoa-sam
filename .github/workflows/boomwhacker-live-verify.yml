name: Boomwhacker LIVE GitHub Pages save verification
on:
  pull_request:
    paths: ['.github/workflows/boomwhacker-live-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-deployed-page:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install free Chrome browser QA driver
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
      - name: Test LIVE GitHub Pages button, UI feedback and resulting download
        shell: bash
        run: |
          mkdir -p boomwhacker/live-qa-artifacts
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {chromium} from 'playwright-core';
          const url='https://ulmoa0701-a11y.github.io/ulmoa-sam/boomwhacker/?liveqa='+Date.now();
          const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--autoplay-policy=no-user-gesture-required']});
          const results=[];
          try{
           for(const mobile of [false,true]){
            const page=await browser.newPage({viewport:mobile?{width:390,height:844}:{width:1440,height:900},acceptDownloads:true});
            let ready=false,loadError='';
            for(let i=0;i<22;i++){
             try{
              const res=await page.goto(url,{waitUntil:'domcontentloaded',timeout:20000});
              ready=!!res?.ok()&&await page.locator('#videoDownloadLink').count()===1&&await page.locator('#videoProgress').count()===1&&(!mobile||await page.locator('#mobileVideoBtn').isVisible());
              if(ready)break;
             }catch(e){loadError=String(e)}
             await new Promise(r=>setTimeout(r,5000));
            }
            if(!ready)throw Error('LIVE PAGE NOT UPDATED mobile='+mobile+' quickButtonCount='+await page.locator('#mobileVideoBtn').count()+' error='+loadError);
            await page.evaluate(()=>localStorage.setItem('ulmoaBoomTransfer',JSON.stringify({title:'공개검증',bpm:180,timeN:1,timeD:4,measures:[[{note:'도',dur:1,lyric:'도'}]]})));
            await page.reload({waitUntil:'domcontentloaded'});
            if(mobile)await page.evaluate(()=>{document.querySelector('#creditOpt').checked=false});
            const error=[];page.on('pageerror',e=>error.push(e.message));
            const info=await page.locator('#videoBtn').evaluate(b=>{
              const r=b.getBoundingClientRect(),s=getComputedStyle(b);
              return {rect:{x:r.x,y:r.y,width:r.width,height:r.height},display:s.display,visible:s.visibility,disabled:b.disabled,status:document.querySelector('#videoStatus')?.innerText}
            });
            console.log('LIVE_PRECLICK='+JSON.stringify({mobile,info,ready}));
            const pending=page.waitForEvent('download',{timeout:45000}).then(download=>({download})).catch(error=>({error:String(error)}));
            let clickError='';
            try{
              if(mobile&&!await page.locator('#mobileVideoBtn').isVisible())throw Error('Mobile quick save button not visible');
              await page.locator(mobile?'#mobileVideoBtn':'#videoBtn').click({timeout:12000});
              console.log('LIVE_CLICKED='+mobile);
            }catch(error){
              clickError=String(error);
              console.log('LIVE_CLICK_ERROR='+JSON.stringify({mobile,clickError}));
              await page.screenshot({path:'boomwhacker/live-qa-artifacts/error-'+(mobile?'mobile':'desktop')+'.png',fullPage:true}).catch(()=>{});
            }
            if(clickError)throw Error('Live click failed mobile='+mobile+': '+clickError);
            const progressShown=await page.locator('#videoProgress').isVisible();
            const res=await pending;
            if(!res.download)throw Error('Live download never started mobile='+mobile+': '+res.error+' status='+await page.locator('#videoStatus').innerText());
            const download=res.download;
            const file='boomwhacker/live-qa-artifacts/live-'+(mobile?'mobile':'desktop')+'.webm';
            await download.saveAs(file);
            const b=fs.readFileSync(file),status=await page.locator('#videoStatus').innerText();
            const retry=await page.locator('#videoDownloadLink').isVisible();
            const obj={mobile,url,progressShown,retry,size:b.length,header:b.subarray(0,4).toString('hex'),status,errors:error};
            obj.pass=progressShown&&retry&&obj.header==='1a45dfa3'&&b.length>2000&&/영상 제작 완료/.test(status)&&!error.length;
            results.push(obj);console.log('LIVE_BOOM_SAVE='+JSON.stringify(obj));
            await page.close();
            if(!obj.pass)process.exitCode=1;
           }
          }finally{await browser.close();fs.writeFileSync('boomwhacker/live-qa-artifacts/report.json',JSON.stringify(results,null,2))}
          JS
      - name: Verify deployed musical interlude with real audio and synchronized handoff
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright-core';
          const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--autoplay-policy=no-user-gesture-required']});
          try{
            for(const mobile of [false,true]){
              const page=await browser.newPage({viewport:mobile?{width:390,height:844}:{width:1366,height:900}});
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              let deployed=false;
              for(let tries=0;tries<20;tries++){
                await page.goto('https://ulmoa0701-a11y.github.io/ulmoa-sam/boomwhacker/?interludeQa='+Date.now(),{waitUntil:'domcontentloaded'});
                deployed=await page.evaluate(()=>typeof instrumentalPreludePlan==='function'&&typeof scheduleInterludeCountdown==='function'&&instrumentalPreludePlan().beats>0);
                if(deployed)break;
                await new Promise(r=>setTimeout(r,5000));
              }
              if(!deployed)throw Error('LIVE INTERLUDE NOT DEPLOYED mobile='+mobile);
              await page.evaluate(()=>localStorage.setItem('ulmoaBoomTransfer',JSON.stringify({title:'작은별 4마디 공개검증',timeN:2,timeD:4,bpm:96,measures:[
               [{note:'도',dur:1},{note:'도',dur:1}],
               [{note:'솔',dur:1},{note:'솔',dur:1}],
               [{note:'라',dur:1},{note:'라',dur:1}],
               [{note:'솔',dur:2}]
              ]})));
              await page.reload({waitUntil:'domcontentloaded'});
              if(mobile)await page.locator('#mobileSettingsBtn').click();
              const initialMode=await page.locator('#introMode').inputValue();
              if(initialMode!=='interlude')throw Error('LIVE intro still defaults to click-counting: '+initialMode);
              await page.locator('#introMode').selectOption('interlude');
              const picker=await page.locator('#introMode').evaluate(el=>({width:el.getBoundingClientRect().width,label:el.selectedOptions[0]?.textContent||'',font:parseFloat(getComputedStyle(el).fontSize)}));
              console.log('LIVE_INTERLUDE_PICKER='+JSON.stringify({mobile,picker}));
              if(!picker.label.includes('간주 듣고 시작')||(mobile&&(picker.width<240||picker.font<12))||(!mobile&&picker.width<115))
                throw Error('LIVE deployed interlude picker not readable: '+JSON.stringify({mobile,picker}));
              if(mobile)await page.locator('#mobileSettingsClose').click();
              const plan=await page.evaluate(()=>instrumentalPreludePlan());
              console.log('LIVE_INSTRUMENTAL_PLAN='+JSON.stringify({mobile,plan}));
              if(plan.bars<2||plan.durationMs<3100||plan.firstBallOffsetMs<0||plan.firstBallOffsetMs>=plan.durationMs)
                throw Error('LIVE instrumental intro cannot fit first-ball runway '+JSON.stringify(plan));
              const audio=await page.evaluate(async()=>{
                const plan=instrumentalPreludePlan(),beat=beatMs(),len=(3*beat+plan.durationMs)/1000+1;
                const ac=new OfflineAudioContext(1,Math.ceil(44100*len),44100);
                scheduleInterludeCountdown(ac,ac.destination,.05,beat);
                scheduleInterludeMusic(ac,ac.destination,.05+3*beat/1000,beat,plan.meter);
                const signal=(await ac.startRendering()).getChannelData(0);
                const power=(a,b)=>{let e=0;for(let i=Math.floor(a*44100);i<Math.min(signal.length,Math.floor(b*44100));i++)e+=Math.abs(signal[i]);return Math.round(e)};
                const t=.05+3*beat/1000;
                return{count:power(.06,.25),prelude:power(t+.06,t+.25),lastChord:power(t+(plan.durationMs-beat)/1000+.04,t+(plan.durationMs-beat)/1000+.24)};
              });
              await page.locator(mobile?'#playBtn':'#startBtn').click();
              const before=await page.evaluate(()=>({introActive,beats:introBeats,count:introCountBeats,preview:introPreviewBeats,meter:introMeter,pulse:document.querySelector('#introPulse').innerText,scheduled:!!mrSource}));
              const beforeBall=await page.evaluate(()=>{
                const p=instrumentalPreludePlan();introStartPerf=performance.now()-(3*beatMs()+Math.max(0,p.firstBallOffsetMs-80));
                introFrame(performance.now());return{introActive,playing,balls:document.querySelectorAll('.fall').length,elapsed};
              });
              const during=await page.evaluate(()=>{
                const p=instrumentalPreludePlan();introStartPerf=performance.now()-(3*beatMs()+p.firstBallOffsetMs+700);
                introFrame(performance.now());
                const overlay=document.querySelector('#introOverlay');
                return{introActive,playing,balls:document.querySelectorAll('.fall').length,pulse:document.querySelector('#introPulse').innerText,
                  compact:overlay.classList.contains('preludePlaying'),blur:getComputedStyle(overlay).backdropFilter};
              });
              await page.evaluate(()=>{introStartPerf=performance.now()-(introDurationMs+10);introFrame(performance.now())});
              const after=await page.evaluate(()=>({introActive,playing,lead:!!leadInGain,mrScheduled:!!mrSource,mix:mixMode,elapsed,first:firstNoteMs()}));
              const ok=audio.count>10&&audio.prelude>10&&audio.lastChord>10
                &&before.introActive&&before.count===3&&before.preview===plan.beats&&before.beats===plan.beats+3&&before.pulse==='3'&&before.scheduled
                &&beforeBall.introActive&&!beforeBall.playing&&beforeBall.balls===0
                &&during.introActive&&!during.playing&&during.balls>=1&&during.pulse==='🎶'&&during.compact&&during.blur==='none'
                &&!after.introActive&&after.playing&&!after.lead&&after.mrScheduled&&after.mix==='both'&&Math.abs(after.elapsed-after.first)<70&&!errors.length;
              console.log('LIVE_TRUE_PRELUDE='+JSON.stringify({mobile,plan,audio,before,beforeBall,during,after,errors,ok}));
              await page.close();
              if(!ok)throw Error('LIVE musical interlude audio/handoff did not work mobile='+mobile);
            }
          }finally{await browser.close()}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boomwhacker-live-save-evidence
          path: boomwhacker/live-qa-artifacts
          if-no-files-found: warn
