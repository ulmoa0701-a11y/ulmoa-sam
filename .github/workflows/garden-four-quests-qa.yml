name: Thinking Garden Four Quests – Gameplay and Clinical Records QA
on:
  pull_request:
    paths:
      - 'thinking-garden/**'
      - 'qa/garden-four-quests-qa.cjs'
      - '.github/workflows/garden-four-quests-qa.yml'
  push:
    branches: [main]
    paths:
      - 'thinking-garden/**'
      - 'qa/garden-four-quests-qa.cjs'
      - '.github/workflows/garden-four-quests-qa.yml'
permissions:
  contents: read
jobs:
  four-quests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Prepare Chromium
        run: |
          npm install --no-save --no-package-lock playwright-core@1.56.1
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Check syntax
        run: |
          node --check thinking-garden/app.js
          node --check qa/garden-four-quests-qa.cjs
      - name: Serve local preview
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/four-quests-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/thinking-garden/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/four-quests-http.log
          exit 1
      - name: Full 5/10/15/20 round gameplay and observations
        run: node qa/garden-four-quests-qa.cjs
      - name: Upload browser samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-quests-browser-samples
          path: qa/four-quest-screenshots/
          if-no-files-found: ignore
