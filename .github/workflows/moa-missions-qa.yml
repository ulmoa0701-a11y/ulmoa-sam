name: MoA Missions Play QA
on:
  push:
    branches: [main]
    paths:
      - 'thinking-garden/games/moa-missions/**'
      - 'qa/moa-missions-qa.mjs'
      - 'gardens/index.html'
      - '.github/workflows/moa-missions-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mission-games:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check game code syntax
        run: |
          node --check thinking-garden/games/moa-missions/app.js
          node --check qa/moa-missions-qa.mjs
      - name: Install browser automation
        run: npm install --no-save playwright-core@1.56.1
      - name: Find Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Start local preview
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/moa-missions-server.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:8765/thinking-garden/games/moa-missions/ >/dev/null && exit 0; sleep 0.25; done
          cat /tmp/moa-missions-server.log
          exit 1
      - name: Play every mission
        run: node qa/moa-missions-qa.mjs
      - name: Play published mission pages
        env:
          TEST_BASE_URL: https://ulmoa0701-a11y.github.io/ulmoa-sam
        run: node qa/moa-missions-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moa-mission-game-screenshots
          path: qa/moa-missions-artifacts
          if-no-files-found: warn
