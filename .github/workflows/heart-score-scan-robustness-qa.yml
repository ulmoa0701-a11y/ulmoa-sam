name: Heart Score Scan Robustness (investigation only)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/heart-score-scan-robustness-qa.yml'
      - 'heart-score/qa/render-typeset-score-e2e.cjs'
      - 'heart-score/omr-ai-v702.js'
  workflow_dispatch:
jobs:
  scan-robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install free OMR and notation fixtures locally
        run: |
          npm ci --prefix heart-score/qa --ignore-scripts --no-audit --no-fund
          npm install --prefix heart-score/qa --no-save --ignore-scripts --no-audit --no-fund vexflow@5.0.0 @vexflow-fonts/bravura@1.0.2 @vexflow-fonts/academico@1.0.1
          npx --prefix heart-score/qa playwright install chromium
      - name: Prepare pinned ONNX model and runtime
        run: node heart-score/qa/prepare-runtime.cjs
      - name: Generate reference and disturbed score images
        run: node heart-score/qa/render-typeset-score-e2e.cjs heart-score/qa/.scan-debug
      - name: Diagnose exact symbol errors under scan-like image degradation
        shell: bash
        run: |
          set +e
          node heart-score/qa/omr-image-e2e.cjs --mobile --fixture heart-score/qa/.scan-debug/typeset-lowres-19.jpg --variant scan-lowres-mobile --runtime heart-score/qa/.runtime --output heart-score/qa/.scan-debug/lowres-mobile-result
          STATUS1=$?
          node heart-score/qa/omr-image-e2e.cjs --mobile --fixture heart-score/qa/.scan-debug/typeset-tilted-19.jpg --variant scan-tilted-mobile --runtime heart-score/qa/.runtime --output heart-score/qa/.scan-debug/tilted-mobile-result
          STATUS2=$?
          echo "SCAN_LOWRES=$STATUS1 SCAN_TILTED=$STATUS2"
          if [[ $STATUS1 -ne 0 || $STATUS2 -ne 0 ]]; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: score-scan-robustness-diagnostics
          path: |
            heart-score/qa/.scan-debug/**/*.json
            heart-score/qa/.scan-debug/**/*.png
            heart-score/qa/.scan-debug/typeset-*.jpg
          if-no-files-found: warn
