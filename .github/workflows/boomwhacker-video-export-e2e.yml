name: Boomwhacker real video save E2E (PR only)
on:
  pull_request:
    paths:
      - 'boomwhacker/index.html'
      - 'boomwhacker/video-export-e2e.mjs'
      - '.github/workflows/boomwhacker-video-export-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-video-download:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locate Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Install browser driver
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
      - name: ACTUALLY record and save WebM on desktop and 390px browser
        run: node boomwhacker/video-export-e2e.mjs
      - name: Install free local ffprobe media validator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Validate actual exported media stream
        if: always()
        shell: bash
        run: |
          if ! command -v ffprobe >/dev/null; then
            echo 'ffprobe missing — cannot assert codecs'
            exit 1
          fi
          for file in boomwhacker/video-qa-artifacts/*.webm; do
            echo "=== $file ==="
            ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_type,codec_name -of json "$file"
            test "$(ffprobe -v error -select_streams v -show_entries stream=index -of csv=p=0 "$file" | wc -l)" -ge 1
          done
          # A video can contain an Opus track but still be silent. Verify
          # the first 2 seconds of the newly generated introduction contain
          # non-silent musical samples, not just codec metadata.
          intro=boomwhacker/video-qa-artifacts/desktop-interlude-audio.webm
          test -s "$intro"
          test "$(ffprobe -v error -select_streams a -show_entries stream=codec_name -of csv=p=0 "$intro" | grep -c '^opus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boomwhacker-export-e2e-evidence
          path: boomwhacker/video-qa-artifacts
          if-no-files-found: warn
)" -ge 1
          ffmpeg -hide_banner -i "$intro" -t 2 -vn -af volumedetect -f null - > /tmp/interlude-audio-probe.txt 2>&1
          grep 'max_volume:' /tmp/interlude-audio-probe.txt
          db=$(sed -n 's/.*max_volume: \([-0-9.]*\) dB.*/\1/p' /tmp/interlude-audio-probe.txt | tail -1)
          test -n "$db"
          awk -v db="$db" 'BEGIN{exit !(db > -50)}'
      - name: Upload media QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boomwhacker-export-e2e-evidence
          path: boomwhacker/video-qa-artifacts
          if-no-files-found: warn
