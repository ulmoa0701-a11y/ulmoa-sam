name: Garden Breath Simulated Microphone Full-Play QA
on:
  pull_request:
    paths:
      - 'qa/breath-virtual-signal-full-play-qa.cjs'
      - '.github/workflows/garden-breath-virtual-full-play-qa.yml'
      - 'breath-garden/**'
  push:
    branches: [main]
    paths:
      - 'qa/breath-virtual-signal-full-play-qa.cjs'
      - '.github/workflows/garden-breath-virtual-full-play-qa.yml'
      - 'breath-garden/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  virtual-signal-full-play:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Find Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Syntax
        run: node --check qa/breath-virtual-signal-full-play-qa.cjs
      - name: Preview website
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/breath-virtual-signal.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/breath-garden/ >/dev/null && exit 0; sleep 0.4; done
          cat /tmp/breath-virtual-signal.log; exit 1
      - name: Play three breathing mini-games to actual result screens using synthetic audio
        run: node qa/breath-virtual-signal-full-play-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: breath-virtual-signal-play-evidence
          path: qa/breath-virtual-signal-artifacts/
          if-no-files-found: warn
