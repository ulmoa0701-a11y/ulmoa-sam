name: Elementary Math Units QA
on:
  pull_request:
    paths:
      - 'math-garden/grade-play/**'
      - 'qa/grade-math-units-qa.cjs'
      - '.github/workflows/grade-math-units-qa.yml'
      - 'gardens/index.html'
  push:
    branches: [main]
    paths:
      - 'math-garden/grade-play/**'
      - 'gardens/index.html'
      - 'qa/grade-math-units-qa.cjs'
      - '.github/workflows/grade-math-units-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  curriculum-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browser driver
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Detect Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Start test website
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/unit-math-server.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8765/gardens/ >/dev/null && exit 0; sleep 0.25; done
          exit 1
      - name: Check 213 subunits and responsive gameplay
        run: node qa/grade-math-units-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grade-math-units-screenshots
          path: qa/grade-math-unit-artifacts/
          if-no-files-found: ignore
