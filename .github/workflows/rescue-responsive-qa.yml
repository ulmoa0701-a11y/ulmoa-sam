name: Rescue Game Responsive QA
on:
  pull_request:
    paths:
      - 'thinking-garden/games/rescue/**'
      - '.github/workflows/rescue-responsive-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tests
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Start site and test
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/rescue-http.log 2>&1 &
          node thinking-garden/games/rescue/rescue-smoke.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rescue-responsive-screenshots
          path: rescue-qa-screenshots/
          if-no-files-found: ignore
