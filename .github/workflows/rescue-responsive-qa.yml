name: Rescue published Pages quick check
on:
  pull_request:
    paths:
      - '.github/workflows/rescue-responsive-qa.yml'
permissions:
  contents: read
jobs:
  live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify published assets and responsive build signature
        run: |
          URL='https://ulmoa0701-a11y.github.io/ulmoa-sam/thinking-garden/games/rescue/'
          for i in $(seq 1 20); do
            if curl -fsSL --max-time 12 "${URL}landscape.js?v=2" | grep -q 'class LandscapeMissionScene'; then break; fi
            echo "Waiting for GitHub Pages $i"
            sleep 7
          done
          curl -fsSL --max-time 20 "${URL}landscape.js?v=2" | grep -q 'class LandscapeMissionScene'
          curl -fsSL --max-time 20 "${URL}game.js?v=2" | grep -q 'LANDSCAPE_MODE'
          curl -fsSL --max-time 20 "$URL" | grep -q 'landscape.js?v=2'
          echo 'PASS published Pages assets are live'
