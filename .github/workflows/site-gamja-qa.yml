name: Site Gamja Flower Typography QA
on:
  pull_request:
    paths:
      - "assets/habom-gamja-font.css"
      - "index.html"
      - "about/index.html"
      - "notes/index.html"
      - "materials/index.html"
      - "info/index.html"
      - "parents/index.html"
      - "request/index.html"
      - "thinking-garden/index.html"
      - "music-garden/index.html"
      - "brain-map/index.html"
      - "qa/site-gamja-qa.mjs"
      - ".github/workflows/site-gamja-qa.yml"
  push:
    branches: ["main"]
    paths:
      - "assets/habom-gamja-font.css"
      - "index.html"
      - "about/index.html"
      - "notes/index.html"
      - "materials/index.html"
      - "info/index.html"
      - "parents/index.html"
      - "request/index.html"
      - "thinking-garden/index.html"
      - "music-garden/index.html"
      - "brain-map/index.html"
      - "qa/site-gamja-qa.mjs"
      - ".github/workflows/site-gamja-qa.yml"
jobs:
  typography-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser automation
        run: npm install --no-save playwright-core@1.56.1
      - name: Detect Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
      - name: Serve repository
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/site-font-server.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0; sleep 0.25; done
          cat /tmp/site-font-server.log
          exit 1
      - name: Check website fonts and device layouts
        run: node qa/site-gamja-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-gamja-screenshots
          path: qa/site-gamja-qa-artifacts
          if-no-files-found: warn
