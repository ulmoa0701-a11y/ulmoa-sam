name: Garden Strategy 20-Scenario Browser QA
on:
  pull_request:
    paths:
      - 'thinking-garden/strategy-classroom.js'
      - 'thinking-garden/strategy-rescue.js'
      - 'qa/strategy-scenario-diversity-qa.cjs'
      - '.github/workflows/strategy-scenario-diversity-qa.yml'
  push:
    branches: [main]
    paths:
      - 'thinking-garden/strategy-classroom.js'
      - 'thinking-garden/strategy-rescue.js'
      - 'qa/strategy-scenario-diversity-qa.cjs'
      - '.github/workflows/strategy-scenario-diversity-qa.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Browser prerequisites
        run: |
          npm install --no-save --no-package-lock playwright-core@1.56.1
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Syntax checks
        run: |
          node --check thinking-garden/strategy-classroom.js
          node --check thinking-garden/strategy-rescue.js
          node --check qa/strategy-scenario-diversity-qa.cjs
      - name: Start localhost
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/strategy-game.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/thinking-garden/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/strategy-game.log; exit 1
      - name: Check three levels and 20 unique tasks on desktop and mobile
        run: node qa/strategy-scenario-diversity-qa.cjs
