name: One-action Math Garden QA
on:
  pull_request:
    paths:
      - 'math-garden/grade-play/concept-multiply/**'
      - 'qa/one-action-math-qa.cjs'
      - '.github/workflows/one-action-math-qa.yml'
  push:
    branches: [main]
    paths:
      - 'math-garden/grade-play/concept-multiply/**'
      - 'qa/one-action-math-qa.cjs'
      - '.github/workflows/one-action-math-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-game:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Find Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Start web server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/one-action-math.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8765/math-garden/grade-play/concept-multiply/ >/dev/null && exit 0; sleep .25; done
          exit 1
      - name: Play all seven levels
        run: node qa/one-action-math-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: one-action-math-screenshots
          path: qa/one-action-math-screens/
          if-no-files-found: ignore
