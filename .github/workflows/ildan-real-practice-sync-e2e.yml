name: Ildan real practice cloud sync role isolation QA
on:
  push:
    branches:
      - qa/ildan-practice-real-e2e-20261015
    paths:
      - '.github/workflows/ildan-real-practice-sync-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-synthetic-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Create synthetic student, upload JPEG, save/share/read/revoke/delete on live staging
        shell: bash
        run: |
          node <<'JS'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const key=fs.readFileSync('test/ildan-sseobom/supabase-staging/config.js','utf8').match(/publishableKey:"([^"]+)"/)?.[1];
          if(!key)throw Error('Missing publishable key');
          const base='https://miohovwmhmtcvkurjamm.supabase.co',api=base+'/functions/v1/ildan-api/';
          const originalHeaders={apikey:key,'Content-Type':'application/json',Origin:'https://ulmoa0701-a11y.github.io'};
          const username='qa'+crypto.randomBytes(6).toString('hex'),password='Q3'+crypto.randomBytes(20).toString('hex');
          const email='trial-'+crypto.createHash('sha256').update(username).digest('hex').slice(0,48)+'@members.ildan.example';
          const ids={};let recordId=null,mediaPath=null;
          const check=(ok,msg)=>{if(!ok)throw Error(msg)};
          async function request(path,body,token,method='POST'){
           const headers={...originalHeaders};if(token)headers.Authorization='Bearer '+token;
           const res=await fetch(api+path,{method,headers,...(method==='GET'?{}:{body:JSON.stringify(body||{})}),signal:AbortSignal.timeout(25000)});
           return {status:res.status,data:await res.json().catch(()=>({}))};
          }
          async function auth(path,body){
           const res=await fetch(base+'/auth/v1/'+path,{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify(body),signal:AbortSignal.timeout(25000)});
           return {status:res.status,data:await res.json().catch(()=>({}))};
          }
          (async()=>{
           const health=await request('health',null,null,'GET');
           check(health.status===200&&health.data.mode==='not-approved-for-clinical-use','Real clinical writes should stay locked');
           const creation=await request('test-therapist-signup',{username,password});
           check(creation.status===201,'Therapist synthetic create error '+JSON.stringify({status:creation.status,detail:creation.data.error}));
           const login=await auth('token?grant_type=password',{email,password});
           check(login.status===200&&login.data.access_token,'Therapist authentication failed');
           ids.therapist=login.data.user.id;const therapistToken=login.data.access_token;
           const student=await request('students',{alias:'가상_기록QA'},therapistToken);
           check(student.status===201&&student.data.student?.id,'student create '+JSON.stringify(student));
           ids.student=student.data.student.id;
           const invite=await request('invites',{role:'student',targetUserId:ids.student},therapistToken);
           check(invite.status===200&&invite.data.invite,'student invite failed');
           const authLink=await request('invite-register',{code:invite.data.invite});
           check(authLink.status===200&&authLink.data.tokenHash,'student invitation exchange failed');
           const verify=await auth('verify',{type:'magiclink',token_hash:authLink.data.tokenHash});
           check(verify.status===200&&verify.data.access_token,'student login failed');
           const studentToken=verify.data.access_token;
           const empty=await request('practice-records',null,therapistToken,'GET');
           check(empty.status===200&&!empty.data.records?.length,'Therapist initial practice inbox not empty');
           const media=await request('practice-media-sign',{},studentToken);
           check(media.status===200&&media.data.bucket==='ildan-practice-media'&&media.data.token,'image signing failed '+JSON.stringify({status:media.status,detail:media.data.error}));
           mediaPath=media.data.path;
           const jpg=Buffer.from('','base64');
           const uploaded=await fetch(base+'/storage/v1/object/upload/sign/'+media.data.bucket+'/'+mediaPath+'?token='+encodeURIComponent(media.data.token),{
            method:'PUT',headers:{'Content-Type':'image/jpeg'},body:jpg,signal:AbortSignal.timeout(25000)});
           check(uploaded.ok,'SIGNED_UPLOAD_FAILED '+uploaded.status+' '+(await uploaded.text()).slice(0,300));
           const entry={date:'2026-10-15',note:'가상 연습기록 QA - 실사용자 자료 아님',photos:[mediaPath],
            sketch:'[[[20,20],[60,70],[100,100]]]'};
           const saved=await request('practice-records',{entry,share:true},studentToken);
           check(saved.status===201&&saved.data.record?.id,'record save failed '+JSON.stringify(saved));
           recordId=saved.data.record.id;
           const teacher=await request('practice-records',null,therapistToken,'GET');
           check(teacher.status===200&&teacher.data.records?.length===1,'Teacher must receive exactly one shared record '+JSON.stringify(teacher));
           const visible=teacher.data.records[0];
           check(visible.entry.note===entry.note&&visible.entry.photos?.length===1&&visible.entry.photos[0].includes('storage/v1/object/sign/'),'Shared text/photo not found');
           const owner=await request('practice-records',null,studentToken,'GET');
           check(owner.status===200&&owner.data.records?.length===1,'student cross-device API record missing');
           const revoke=await request('practice-unshare',{recordId},studentToken);
           check(revoke.status===200,'Unshare failed '+JSON.stringify(revoke));
           const hidden=await request('practice-records',null,therapistToken,'GET');
           check(hidden.status===200&&!hidden.data.records?.length,'Teacher still sees unshared record');
           const again=await request('practice-share',{recordId},studentToken);
           check(again.status===200,'reshare failed');
           const reshared=await request('practice-records',null,therapistToken,'GET');
           check(reshared.status===200&&reshared.data.records?.length===1,'reshare unavailable');
           const erased=await request('practice-delete',{recordId},studentToken);
           check(erased.status===200&&erased.data.deleted===true,'delete failed');
           recordId=null;
           const emptyAgain=await request('practice-records',null,therapistToken,'GET');
           check(emptyAgain.status===200&&emptyAgain.data.records?.length===0,'Deleted record is still visible');
           // Guardian is a separate account assigned to the same student, not another student record.
           const guardianInvite=await request('invites',{role:'parent',studentId:ids.student},therapistToken);
           check(guardianInvite.status===200&&guardianInvite.data.invite,'guardian invitation failed');
           const guardianAuth=await request('invite-register',{code:guardianInvite.data.invite});
           check(guardianAuth.status===200&&guardianAuth.data.tokenHash,'guardian enrollment failed');
           const guardianVerify=await auth('verify',{type:'magiclink',token_hash:guardianAuth.data.tokenHash});
           check(guardianVerify.status===200&&guardianVerify.data.access_token,'guardian verification failed');
           ids.parent=guardianVerify.data.user.id;
           const guardianToken=guardianVerify.data.access_token;
           const guardianEntry={date:'2026-10-15',observation:'가상 보호자 관찰 메모 - 실제 아동 내용 아님'};
           const parentSaved=await request('practice-records',{entry:guardianEntry,share:true},guardianToken);
           check(parentSaved.status===201&&parentSaved.data.record?.id,'guardian note save failed '+JSON.stringify(parentSaved));
           const parentRead=await request('practice-records',null,therapistToken,'GET');
           check(parentRead.status===200&&parentRead.data.records?.length===1&&parentRead.data.records[0].kind==='parent',
            'Therapist cannot see linked guardian shared note');
           const parentRemove=await request('practice-delete',{recordId:parentSaved.data.record.id},guardianToken);
           check(parentRemove.status===200&&parentRemove.data.deleted,'guardian note delete failed');
           const noGuardian=await request('practice-records',null,therapistToken,'GET');
           check(noGuardian.status===200&&!noGuardian.data.records?.length,'deleted guardian note visible');
           const wrong=await request('practice-records',{entry,share:true},null);
           check(wrong.status===401,'Anonymous practice write accepted');
           console.log('PASS REAL SANDBOX: student+guardian sign-in -> private JPEG upload -> encrypted practice records -> therapist share -> unshare -> reshare -> delete -> anonymous denied');
           console.log('SYNTHETIC_CLEANUP_IDS='+JSON.stringify(ids));
          })().catch(e=>{
           console.error('FAIL '+e.message);
           console.error('SYNTHETIC_CLEANUP_IDS='+JSON.stringify(ids));
           if(recordId)console.error('WARNING temp practice record remains; delete only synthetic user via guarded admin cleanup');
           process.exitCode=1;
          });
          JS
