name: Six Cognitive Gameplay Worlds QA
on:
  pull_request:
    paths:
      - 'thinking-garden/gameplay-worlds.*'
      - 'thinking-garden/index.html'
      - 'qa/gameplay-worlds-qa.mjs'
  push:
    branches: [main]
    paths:
      - 'thinking-garden/gameplay-worlds.*'
      - 'thinking-garden/index.html'
      - 'qa/gameplay-worlds-qa.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  game-play-worlds:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: npm install --no-save playwright-core@1.56.1
      - name: Find Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Start local site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/gameplay-world-server.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:8765/thinking-garden/ >/dev/null && exit 0; sleep .25; done
          cat /tmp/gameplay-world-server.log; exit 1
      - name: Verify all six live game mechanics and renderings
        run: node qa/gameplay-worlds-qa.mjs
      - name: Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: six-gameplay-world-screenshots
          path: qa/gameplay-world-screens
          if-no-files-found: warn
