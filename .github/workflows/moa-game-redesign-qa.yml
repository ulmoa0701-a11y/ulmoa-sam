name: MoA 34 Games UX QA
on:
  push:
    branches: [main]
    paths:
      - 'thinking-garden/game-clarity*'
      - 'gardens/catalog.js'
      - 'thinking-garden/app.js'
      - 'thinking-garden/index.html'
      - 'assets/moa-quick-guide*'
      - 'thinking-garden/games/rescue/index.html'
      - 'thinking-garden/games/hand-mirror/index.html'
      - 'thinking-garden/games/moa-missions/index.html'
      - 'thinking-garden/games/rhythm-touch/index.html'
      - 'thinking-garden/recorder/index.html'
      - 'breath-garden/index.html'
      - 'qa/moa-game-redesign-qa.mjs'
      - '.github/workflows/moa-game-redesign-qa.yml'
  pull_request:
    paths:
      - 'thinking-garden/**'
      - 'gardens/catalog.js'
      - 'qa/moa-game-redesign-qa.mjs'
      - '.github/workflows/moa-game-redesign-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-play:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate game helper JavaScript
        run: |
          node --check thinking-garden/game-clarity.js
          node --check assets/moa-quick-guide.js
          node --check thinking-garden/app.js
          node --check qa/moa-game-redesign-qa.mjs
      - name: Install Chrome automation
        run: npm install --no-save playwright-core@1.56.1
      - name: Locate Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Serve game site locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/moa-game-ux-server.log 2>&1 &
          for i in {1..50}; do curl -fsS http://127.0.0.1:8765/thinking-garden/ >/dev/null && exit 0; sleep 0.25; done
          cat /tmp/moa-game-ux-server.log
          exit 1
      - name: Run complete garden game UX inspection
        run: node qa/moa-game-redesign-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moa-34-game-redesign-screenshots
          path: qa/moa-game-redesign-artifacts
          if-no-files-found: warn
