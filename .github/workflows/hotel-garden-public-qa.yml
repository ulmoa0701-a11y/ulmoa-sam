name: Hotel Garden public PC and mobile QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotel-garden-public-qa.yml'
      - 'qa/hotel-garden-public-qa.mjs'
      - 'lab/babylon-hotel-garden/**'
concurrency:
  group: hotel-garden-public-qa
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing QA browser runner
        run: npm install --no-save --no-audit --no-fund puppeteer-core@latest
      - name: Find Chrome
        run: |
          CHROME_PATH=$(which google-chrome || which google-chrome-stable || which chromium || which chromium-browser)
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Browser-check the published Babylon game (PC + mobile)
        run: node qa/hotel-garden-public-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hotel-garden-public-qa
          path: |
            hotel-garden-public-qa.json
            hotel-garden-*.png
          if-no-files-found: warn
      - name: Save machine-readable QA report to isolated results branch
        if: always()
        run: |
          if [ ! -f hotel-garden-public-qa.json ]; then
            printf '%s\n' '{"pass":false,"error":"browser QA did not produce a report"}' > hotel-garden-public-qa.json
          fi
          cp hotel-garden-public-qa.json /tmp/hotel-garden-public-qa.json
          git fetch origin qa/hotel-garden-results
          git switch -C qa/hotel-garden-results origin/qa/hotel-garden-results
          mkdir -p qa/results
          cp /tmp/hotel-garden-public-qa.json qa/results/hotel-garden-public-qa.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/results/hotel-garden-public-qa.json
          if ! git diff --staged --quiet; then
            git commit -m "test(hotel garden): record latest public browser QA"
            git push origin HEAD:refs/heads/qa/hotel-garden-results
          fi
