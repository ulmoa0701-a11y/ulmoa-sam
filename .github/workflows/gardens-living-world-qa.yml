name: Five Gardens Living World UI Preview QA
on:
  pull_request:
    paths:
      - 'gardens/living-world.css'
      - 'gardens/world-depth-v2.css'
      - 'gardens/living-world.js'
      - 'gardens/world-map-wide.svg'
      - 'gardens/world-map-mobile.svg'
      - 'gardens/index.html'
      - 'qa/gardens-living-world-qa.cjs'
      - '.github/workflows/gardens-living-world-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check script syntax
        run: node --check gardens/living-world.js && node --check qa/gardens-living-world-qa.cjs
      - name: Install browser adapter
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Korean fonts and installed Chromium
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          timeout 240 sudo apt-get update -qq
          timeout 240 sudo apt-get install -y -qq fonts-noto-cjk
          fc-list :lang=ko | grep -q .
      - name: Start local copy of actual game site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/garden-world-server.log 2>&1 &
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:8765/gardens/ > /dev/null && exit 0; sleep .4; done
          cat /tmp/garden-world-server.log
          exit 1
      - name: UI navigation/preview/accessibility at 360,390,768,1280
        run: node qa/gardens-living-world-qa.cjs
      - name: Save 24 scene screenshots, runtime and layout evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: five-gardens-living-world-scenes
          path: qa/living-world-artifacts/
          retention-days: 14
          if-no-files-found: warn
