name: Ildan Supabase Migration Security CI
on:
  push:
    branches:
      - feature/ildan-supabase-secure-auth-20261014
      - feature/ildan-supabase-live-staging-20261014
      - feature/ildan-invite-link-passkey-20261015
      - feature/ildan-clinician-phone-auth-20261015
      - feature/ildan-therapist-phone-passkey-no-sms-20261015
    paths:
      - 'secure-portal/supabase/**'
      - 'secure-portal/lib/record-contract.mjs'
      - '.github/workflows/ildan-supabase-migration-ci.yml'
  pull_request:
    paths:
      - 'secure-portal/supabase/**'
      - 'secure-portal/lib/record-contract.mjs'
      - '.github/workflows/ildan-supabase-migration-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rls-and-edge-check:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate existing record contract with synthetic Node tests
        run: node --test secure-portal/tests/security.test.mjs secure-portal/tests/v15-contract.test.mjs
      - name: Verify staged frontend JavaScript syntax and shared validation parity
        shell: bash
        run: |
          node --check secure-portal/supabase/web/app.js
          cmp secure-portal/lib/record-contract.mjs secure-portal/supabase/functions/_shared/record-contract.mjs
          node <<'JS'
          const fs=require('fs'),assert=require('node:assert/strict');
          const js=fs.readFileSync('secure-portal/supabase/web/app.js','utf8');
          const html=fs.readFileSync('secure-portal/supabase/web/index.html','utf8');
          const cfg=fs.readFileSync('secure-portal/supabase/web/config.js','utf8');
          assert(js.includes("supabase.auth.verifyOtp"));
          assert(js.includes('supabase.auth.signInWithPasskey()'));
          assert(!/signInWithOtp\s*\(|type:\s*['"]sms['"]|phoneRequestForm|phoneVerifyForm|emailRequestForm|emailVerifyForm/.test(js),'No SMS or email OTP allowed for clinician or guardian');
          assert(js.includes("api('claim-invite'"));
          assert(!js.includes("api('passkeys/login/verify'"));
          assert(js.includes("credentials:'omit'"));
          assert(html.includes('실제 학생·보호자 상담정보 입력 금지'));
          assert(!cfg.includes('RECORD_ENCRYPTION_KEY:'));
          assert(!cfg.includes('SUPABASE_SERVICE_ROLE_KEY:'));
          console.log('PASS staged user role login and no-secret frontend configuration');
          JS
      - name: Run PostgreSQL RLS, guardian/staff isolation, forged insert and invite replay tests
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          psql --version
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f secure-portal/supabase/tests/00_stub_supabase_auth.sql \
            -f secure-portal/supabase/migrations/20261014000100_ildan_secure_roles.sql \
            -f secure-portal/supabase/migrations/20261014000200_private_record_author_only.sql \
            -f secure-portal/supabase/tests/01_role_isolation.sql \
            -f secure-portal/supabase/migrations/20261015000100_email_free_one_time_invite.sql \
            -f secure-portal/supabase/tests/02_invite_link_role_sql.sql
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge handler in Deno using actual npm imports
        run: |
          deno --version
          deno check secure-portal/supabase/functions/ildan-api/index.ts
      - name: Reject accidental sensitive data and service secrets in static files
        shell: bash
        run: |
          node <<'JS'
          const fs=require('fs'),assert=require('node:assert/strict');
          const src=fs.readFileSync('secure-portal/supabase/functions/ildan-api/index.ts','utf8');
          const sql=fs.readFileSync('secure-portal/supabase/migrations/20261014000100_ildan_secure_roles.sql','utf8');
          assert(src.includes('auth.getUser(token)'));
          assert(src.includes('crypto.subtle.encrypt'));
          assert(src.includes("apiName==='unshare'"));
          assert(src.includes("apiName==='claim-invite'"));
          assert(src.includes("apiName==='session-notes'"));
          assert(sql.includes('ENABLE ROW LEVEL SECURITY'));
          assert(sql.includes('REVOKE ALL'));
          assert(sql.includes('email_confirmed_at IS NOT NULL'));
          console.log('PASS authenticated Edge auth, AES encryption, RLS and single-use invitations');
          JS
