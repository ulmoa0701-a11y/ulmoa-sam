name: Hotel Garden V7 focused QA
on:
  pull_request:
    paths:
      - 'lab/babylon-hotel-garden/**'
      - 'qa/hotel-garden-v7-qa.mjs'
      - '.github/workflows/hotel-garden-v7-focused-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v7-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      HOTEL_GARDEN_URL: http://127.0.0.1:8765/lab/babylon-hotel-garden/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser QA runner
        run: |
          npm install --no-save --no-audit --no-fund puppeteer-core@latest
          echo "CHROME_PATH=$(which google-chrome || which google-chrome-stable || which chromium)" >> "$GITHUB_ENV"
          nohup python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/hg7-web.log 2>&1 &
          sleep 2
      - name: Run focused torch and mobile checks
        run: node qa/hotel-garden-v7-qa.mjs
      - name: Preserve focused QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotel-garden-v7-focus
          path: qa/results/hotel-garden-v7-*
          if-no-files-found: warn
          retention-days: 7
