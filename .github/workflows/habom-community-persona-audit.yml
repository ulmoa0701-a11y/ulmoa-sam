name: Habom Community Persona UX Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/habom-community-persona-audit.yml'
      - 'request/index.html'
      - 'assets/habom-role-picker.js'
      - 'assets/community-board.css'
      - 'assets/habom-locked-posts.js'
permissions:
  contents: read
jobs:
  simulated-personas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install browser driver
        run: npm install --no-save playwright-core@1.56.1
      - name: Run read-only real-site persona simulation
        shell: bash
        run: |
          set -eu
          cat > /tmp/habom-personas.cjs <<'JS'
          const { chromium } = require(process.cwd()+'/node_modules/playwright-core');
          const fs = require('node:fs');
          const results=[];
          function record(persona,task,passed,detail) {
            results.push({persona,task,passed,detail});
            console.log((passed?'PASS':'FAIL')+' PERSONA ['+persona+'] '+task+' : '+detail);
          }
          async function attempt(persona,task,fn){
            try{const detail=await fn();record(persona,task,true,String(detail||'confirmed'));}catch(e){record(persona,task,false,String(e.message||e).slice(0,330));}
          }
          async function getFrame(page){
            const end=Date.now()+33000;
            while(Date.now()<end){
              for(const f of page.frames()){
                try{if(await f.locator('#habom-writing-flow').count())return f;}catch{}
              }
              await page.waitForTimeout(750);
            }
            throw Error('Apps Script writing frame absent');
          }
          async function makePage(browser,width,height,person){
            const page=await browser.newPage({viewport:{width,height},locale:'ko-KR',reducedMotion:'reduce'});
            await page.goto('https://ulmoa0701-a11y.github.io/ulmoa-sam/request/',{waitUntil:'domcontentloaded',timeout:40000});
            await page.locator('#publicPostTab').waitFor({timeout:10000});
            return page;
          }
          async function pickRole(frame,group,choice){
            const root=frame.locator('#habom-role-picker');
            await root.locator('.hrp-trigger').click();
            await root.getByRole('button',{name:group,exact:true}).click();
            if(choice)await root.getByRole('button',{name:choice,exact:true}).click();
            return frame.locator('select[name="audience"]').inputValue();
          }
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_BIN||'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            fs.mkdirSync('qa-shots',{recursive:true});
            try{
              const phone=await makePage(browser,390,844,'guardian');
              await attempt('보호자·모바일','질문을 글로 작성하고 보호자 선택',async()=>{
                const f=await getFrame(phone);
                const kind=f.locator('select[name="kind"]');const values=await kind.locator('option').allTextContents();
                const q=values.find(v=>v.includes('질문'));
                if(!q)throw Error('질문 option missing: '+values.join('|'));
                await kind.selectOption({label:q});
                await f.locator('textarea[name="body"]').fill('질문 내용을 적어보는 가상 테스트(실제로 제출하지 않음)');
                const role=await pickRole(f,'보호자');
                if(role!=='보호자')throw Error('role='+role);
                const data=await f.locator('select[name="kind"]').evaluate(n=>({role:n.form?.elements?.audience?.value,kind:n.value}));
                if(!data.kind.includes('질문'))throw Error('category not bound');
                const questionHint=await f.locator('textarea[name="body"]').getAttribute('placeholder');
                if(!questionHint||!questionHint.includes('궁금'))throw Error('question input hint not changed: '+questionHint);
                const purpose=await phone.locator('.community-mode-purpose').innerText();
                if(!purpose.includes('모든 질문에 답하거나')||!purpose.includes('요청을 제작'))throw Error('operating expectations absent');
                return 'category/textarea/role bound; no submission';
              });
              await attempt('보호자·모바일','분류 변경 시 작성 내용 보존',async()=>{
                const f=await getFrame(phone);
                const kind=f.locator('select[name="kind"]');
                const before=await f.locator('textarea[name="body"]').inputValue();
                const options=await kind.locator('option').allTextContents();
                const target=options.find(t=>t.includes('자료'));
                if(!target)throw Error('materials option missing');
                await kind.selectOption({label:target});
                const hint=await f.locator('textarea[name="body"]').getAttribute('placeholder');
                if(!hint||!hint.includes('자료'))throw Error('material request hint not shown: '+hint);
                if(await f.locator('textarea[name="body"]').inputValue()!==before)throw Error('typed text wiped on kind change');
                return 'context hint updated, content preserved';
              });
              await attempt('보호자·모바일','입력 흐름·빈 공간·가로넘침 점검',async()=>{
                const f=await getFrame(phone);let a=await f.evaluate(()=>{
                  let w=document.querySelector('#habom-writing-flow'),s=[...w.querySelectorAll('.hfw-step')];
                  return {steps:s.map(x=>x.querySelector('h2')?.textContent),overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,formHeight:Math.round(w.getBoundingClientRect().height)};
                });
                if(a.overflow||a.steps.length!==3)throw Error(JSON.stringify(a));
                return JSON.stringify(a);
              });
              await phone.screenshot({path:'qa-shots/01-guardian-mobile.png',fullPage:true});
              await phone.close();

              const expert=await makePage(browser,1360,900,'therapist');
              await attempt('인지치료사·PC','개선 의견과 관련 링크 첨부',async()=>{
                const f=await getFrame(expert);
                const chosen=await pickRole(f,'치료·상담 전문가','인지치료사');
                if(chosen!=='인지치료사')throw Error('incorrect role: '+chosen);
                let d=f.locator('details.hfw-extras'); await d.locator('summary').click();
                if(!(await d.evaluate(n=>n.open)))throw Error('link closed');
                await f.locator('input[name="link"]').fill('https://example.com/sample');
                if(await f.locator('input[name="link"]').inputValue()!=='https://example.com/sample')throw Error('link not saved in input');
                return 'specialist role and optional link available';
              });
              await expert.screenshot({path:'qa-shots/02-therapist-desktop.png',fullPage:true});
              await expert.close();

              const teacher=await makePage(browser,390,844,'teacher');
              await attempt('특수교사·모바일','교육·보육 세부 역할을 선택',async()=>{
                const f=await getFrame(teacher);const value=await pickRole(f,'교육·보육 종사자','특수교사');
                if(value!=='특수교사')throw Error('incorrect value '+value);
                return 'education category/role selected';
              });
              await teacher.close();

              const teen=await makePage(browser,320,640,'teen');
              await attempt('학생·소형 모바일','아동·청소년 역할과 익명 옵션',async()=>{
                const f=await getFrame(teen);const value=await pickRole(f,'아동·청소년');
                if(value!=='아동·청소년')throw Error('incorrect value '+value);
                const a=f.locator('input[name="anonymous"],input#anonymous');
                if(!(await a.count()))throw Error('anonymous option not found');
                await a.check({force:true});
                if(!(await a.isChecked()))throw Error('anonymous not checked');
                const overflow=await f.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2);
                if(overflow)throw Error('horizontal overflow');
                return 'role and anonymous option reachable at 320px';
              });
              await teen.screenshot({path:'qa-shots/03-teen-320.png',fullPage:true});
              await teen.close();

              const privateUser=await makePage(browser,390,844,'privacy');
              await attempt('민감정보 보호자·모바일','공개·비밀 구분, 파일·연락처 안내',async()=>{
                await privateUser.locator('#privatePostTab').click();
                const mode=await privateUser.locator('#privatePostTab').getAttribute('aria-selected');
                if(mode!=='true')throw Error('private tab not selected');
                const url=await privateUser.locator('#habomPrivateForm').getAttribute('src');
                if(!url||!url.includes('form.jotform.com'))throw Error('private form iframe not loaded');
                let frame;
                for(let tries=0;tries<22;tries++){
                  frame=privateUser.frames().find(f=>f.url().includes('/262832846022052'));
                  if(frame)break;await privateUser.waitForTimeout(450);
                }
                if(!frame)throw Error('Jotform inner frame missing');
                let body='';
                for(let load=0;load<32;load++){
                  try{body=await frame.locator('body').innerText({timeout:2000});}catch(ignore){}
                  if(body.includes('이메일')&&body.includes('전화번호')&&body.includes('파일 첨부')&&body.includes('비밀글 공개 범위'))break;
                  await privateUser.waitForTimeout(550);
                }
                const labels=['이메일','전화번호','파일 첨부','비밀글 공개 범위'];
                const missing=labels.filter(x=>!body.includes(x));
                if(missing.length)throw Error('missing fields '+missing.join(',')+' / rendered: '+body.slice(0,190));
                const files=await frame.locator('input[type="file"]').count();
                const upload=files ? await frame.locator('input[type="file"]').first().evaluate(n=>({accept:n.accept,multiple:n.multiple})) : null;
                return JSON.stringify({fields:labels,fileInput:files,upload});
              });
              await privateUser.screenshot({path:'qa-shots/04-private-mobile.png',fullPage:true});
              await attempt('민감정보 보호자·모바일','공개로 돌아올 때 게시판 유지',async()=>{
                await privateUser.locator('#publicPostTab').click();
                if(await privateUser.locator('#publicPostPanel').evaluate(n=>n.hidden))throw Error('public form hidden');
                const iframe=await privateUser.locator('.community-iframe').count();
                if(!iframe)throw Error('public iframe missing');
                return 'return to public tab retained iframe';
              });
              await privateUser.close();

              const keyboard=await makePage(browser,390,844,'keyboard');
              await attempt('키보드 사용자','좌우 화살표로 비밀글·공개글 선택',async()=>{
                await keyboard.locator('#publicPostTab').focus();
                await keyboard.keyboard.press('ArrowRight');
                let selected=await keyboard.locator('#privatePostTab').getAttribute('aria-selected');
                if(selected!=='true')throw Error('private keyboard switch failed');
                await keyboard.keyboard.press('ArrowLeft');
                selected=await keyboard.locator('#publicPostTab').getAttribute('aria-selected');
                if(selected!=='true')throw Error('public keyboard return failed');
                return 'left/right keyboard works on public/private tabs';
              });
              await keyboard.close();

              const explorer=await makePage(browser,390,844,'visitor');
              await attempt('첫 방문자','잠금글 목록에서 공개 데이터와 실제 잠금 기능 이해',async()=>{
                await explorer.waitForFunction(()=>!!document.querySelector('#habomLockedPosts')?.dataset.loaded,{timeout:14000});
                const items=await explorer.locator('#habomLockedItems .hbl-item').count();
                const hidden=await explorer.locator('#habomLockedPosts').evaluate(n=>n.hidden);
                const emptyText=(await explorer.locator('#habomLockedState').textContent()).trim();
                if(items===0 && !hidden)throw Error('empty locked section should not clutter the page');
                const openable=await explorer.locator('#habomLockedItems a').count();
                return JSON.stringify({listCount:items,hidden,emptyText,openable,warning:'cannot self-open secret posts'});
              });
              await explorer.close();
              const report={timestamp:new Date().toISOString(),actualParticipants:0,testNature:'automated synthetic persona scenarios, no human user testing',cases:results,summary:{passed:results.filter(x=>x.passed).length,failed:results.filter(x=>!x.passed).length}};
              fs.writeFileSync('qa-shots/persona-report.json',JSON.stringify(report,null,2));
              console.log('PERSONA_SUMMARY '+JSON.stringify(report.summary));
              if(report.summary.failed)process.exitCode=1;
            }finally{await browser.close();}
          })().catch(e=>{console.error(e.stack||String(e));process.exit(2)});
          JS
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export CHROME_BIN
          node /tmp/habom-personas.cjs
      - name: Publish screenshots and persona evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: habom-persona-ux-evidence
          path: qa-shots/
          if-no-files-found: warn
