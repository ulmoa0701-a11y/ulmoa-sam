name: Garden Literacy Real Full-Play QA
on:
  pull_request:
    paths:
      - 'thinking-garden/app.js'
      - 'thinking-garden/literacy-banks.js'
      - 'thinking-garden/index.html'
      - 'qa/garden-literacy-full-play-qa.cjs'
      - '.github/workflows/garden-literacy-full-play-qa.yml'
  push:
    branches: [main]
    paths:
      - 'thinking-garden/app.js'
      - 'thinking-garden/literacy-banks.js'
      - 'thinking-garden/index.html'
      - 'qa/garden-literacy-full-play-qa.cjs'
      - '.github/workflows/garden-literacy-full-play-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  literacy-real-play:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Find Chromium
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Check syntax
        run: |
          node --check thinking-garden/app.js
          node --check thinking-garden/literacy-banks.js
          node --check qa/garden-literacy-full-play-qa.cjs
      - name: Start isolated preview
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/garden-literacy.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8765/thinking-garden/ >/dev/null && exit 0
            sleep 0.5
          done
          cat /tmp/garden-literacy.log
          exit 1
      - name: Play 160 literacy rounds by real buttons on mobile and desktop
        run: node qa/garden-literacy-full-play-qa.cjs
      - name: Save result evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: garden-literacy-full-play-evidence
          path: qa/literacy-full-play-artifacts/
          if-no-files-found: warn
