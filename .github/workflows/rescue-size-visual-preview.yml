name: Temporary rescue sizing screenshot review
on:
  pull_request:
    paths: ['.github/workflows/rescue-size-visual-preview.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Review real gameplay screenshots, especially same-species pairs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL --max-time 35 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/ulmoa0701-a11y/ulmoa-sam/actions/artifacts/11658541391/zip" -o /tmp/qa.zip
          unzip -oq /tmp/qa.zip -d /tmp/qa
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          import pathlib,base64,io
          from PIL import Image
          p=pathlib.Path('/tmp/qa')
          print('FILES',sorted(f.name for f in p.rglob('*.png')))
          for key in ['mobile-390x844-round3-gameplay','desktop-1440x900-round3-gameplay','desktop-1440x900-round5-gameplay']:
            found=list(p.rglob(key+'.png'))
            if not found:continue
            im=Image.open(found[0]).convert('RGB');im.thumbnail((780,990))
            out=io.BytesIO();im.save(out,'JPEG',quality=60,optimize=True)
            print('IMAGE_BEGIN',key,base64.b64encode(out.getvalue()).decode(),'IMAGE_END',flush=True)
          PY