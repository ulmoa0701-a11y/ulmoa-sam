name: Boomwhacker three start choices LIVE
on:
  pull_request:
    paths:
      - 'boomwhacker/three-guides-live-e2e.mjs'
      - '.github/workflows/boomwhacker-three-guides-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Free browser driver
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
      - name: Test THREE guide choices on published PC and mobile pages
        run: node boomwhacker/three-guides-live-e2e.mjs
