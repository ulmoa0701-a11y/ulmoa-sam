name: Garden Breath Synthetic Audio Full-Goal QA
on:
  pull_request:
    paths:
      - 'qa/breath-synthetic-full-goal-qa.cjs'
      - '.github/workflows/garden-breath-synthetic-full-goal-qa.yml'
      - 'breath-garden/app-v7.js'
      - 'breath-garden/index.html'
  push:
    branches: [main]
    paths:
      - 'qa/breath-synthetic-full-goal-qa.cjs'
      - '.github/workflows/garden-breath-synthetic-full-goal-qa.yml'
      - 'breath-garden/app-v7.js'
      - 'breath-garden/index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-audio-full-goals:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Find Chromium
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/breath-synthetic.log 2>&1 &
      - name: Exercise three breath goals on desktop and mobile with mocked analyser signal
        run: node qa/breath-synthetic-full-goal-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: garden-breath-synthetic-goals
          path: qa/breath-synthetic-e2e-artifacts/
          if-no-files-found: ignore
