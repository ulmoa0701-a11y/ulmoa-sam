name: Heart Score homr Browser WASM Segmentation Feasibility (PR only)
on:
  pull_request:
    paths:
      - 'heart-score/qa/homr-segnet-browser-probe.cjs'
      - '.github/workflows/heart-score-homr-browser-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe-original-homr-onnx:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependencies (free, synthetic)
        run: |
          npm ci --prefix heart-score/qa --ignore-scripts --no-audit --no-fund
          npx --prefix heart-score/qa playwright install chromium
      - name: Identify official homr fp32 segmentation checkpoint and transfer size
        id: model
        shell: bash
        run: |
          mkdir -p heart-score/qa/.homr-web-probe
          python - <<'PY'
          import json,urllib.request,os
          url='https://api.github.com/repos/liebharc/homr/releases/tags/onnx_checkpoints'
          req=urllib.request.Request(url,headers={'User-Agent':'Ulmoa-OMR-Free-Benchmark','Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as r: release=json.load(r)
          name='segnet_308-3296ccd40960f90ca6ab9c035cca945675d30a0f.zip'
          assets=[a for a in release.get('assets',[]) if a.get('name')==name]
          if len(assets)!=1:raise RuntimeError('Official segnet ONNX release ZIP not uniquely found: '+str([a['name'] for a in release.get('assets',[])]))
          a=assets[0];size=int(a['size']);limit=350*1024*1024
          full_names=[
            'segnet_308-3296ccd40960f90ca6ab9c035cca945675d30a0f.zip',
            'encoder_pytorch_model_465-597144cab54c8f6d0f6c9619df5c5312694eadd6.zip',
            'decoder_pytorch_model_465-597144cab54c8f6d0f6c9619df5c5312694eadd6.zip'
          ]
          all_assets={x['name']:x for x in release.get('assets',[])}
          all_sizes={n:round(int(all_assets[n]['size'])/1048576,1) for n in full_names}
          total_zip_mb=round(sum(int(all_assets[n]['size']) for n in full_names)/1048576,1)
          result={'name':name,'zipBytes':size,'zipMiB':round(size/1048576,1),
                  'practicalDownloadCapMiB':350,'withinCap':size<=limit,
                  'source':'official homr GitHub release','license':'AGPL-3.0',
                  'fullPipelineZipMiB':total_zip_mb,'threeModelCompressedMiB':all_sizes}
          open('heart-score/qa/.homr-web-probe/model-metadata.json','w').write(json.dumps(result,indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('within_cap='+str(size<=limit).lower()+'\n')
              f.write('url='+a['browser_download_url']+'\n')
          print('HOMR_BROWSER_MODEL_METADATA='+json.dumps(result))
          PY
      - name: Download REAL model only when <=350MiB (respect mobile data)
        if: steps.model.outputs.within_cap == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p heart-score/qa/.homr-web-probe/model
          curl -fLsS --retry 2 --max-time 300 '${{ steps.model.outputs.url }}' -o /tmp/homr-segnet.onnx.zip
          unzip -q /tmp/homr-segnet.onnx.zip -d heart-score/qa/.homr-web-probe/model
          test -s heart-score/qa/.homr-web-probe/model/segnet_308-3296ccd40960f90ca6ab9c035cca945675d30a0f.onnx
          ls -lh heart-score/qa/.homr-web-probe/model/*.onnx
      - name: Run real homr ONNX in Chromium desktop and Android-sized browser
        if: steps.model.outputs.within_cap == 'true'
        shell: bash
        run: |
          set +e
          file=heart-score/qa/.homr-web-probe/model/segnet_308-3296ccd40960f90ca6ab9c035cca945675d30a0f.onnx
          node heart-score/qa/homr-segnet-browser-probe.cjs --model "$file" --mode desktop --output heart-score/qa/.homr-web-probe/desktop.json
          A=$?
          node heart-score/qa/homr-segnet-browser-probe.cjs --model "$file" --mode android-simulated --output heart-score/qa/.homr-web-probe/android-sim.json
          B=$?
          echo "ACTUAL_SEGNET_WASM_DESKTOP=$A ANDROID_VIEWPORT=$B"
          if [[ $A -ne 0 || $B -ne 0 ]]; then exit 1; fi
      - name: Release block if real model is too big for test budget
        if: steps.model.outputs.within_cap != 'true'
        run: |
          echo 'HOMR_BROWSER_GATE=NOT_PRACTICAL_MODEL_TRANSFER_GT_350_MIB'
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heart-score-homr-browser-feasibility
          path: |
            heart-score/qa/.homr-web-probe/*.json
          include-hidden-files: true
          if-no-files-found: warn
