name: Moa Five Gardens World V4 Draft Preview QA
on:
  pull_request:
    paths:
      - 'gardens/v4-preview/**'
      - 'qa/moa-world-v4-preview.cjs'
      - '.github/workflows/moa-world-v4-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser adapter
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Setup browser and Korean fonts
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          timeout 240 sudo apt-get update -qq
          timeout 240 sudo apt-get install -y -qq fonts-noto-cjk
      - name: Start local preview server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/moa-v4-server.log 2>&1 &
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:8765/gardens/v4-preview/ >/dev/null && exit 0; sleep .4; done
          cat /tmp/moa-v4-server.log
          exit 1
      - name: Test five gardens and all 34 game routes on real Chromium
        run: node qa/moa-world-v4-preview.cjs
      - name: Save maps, garden screens and QA summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moa-five-gardens-world-v4-qa
          path: qa/artifacts/moa-world-v4/
          if-no-files-found: warn
          retention-days: 14
