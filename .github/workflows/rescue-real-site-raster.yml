name: Rescue real-site WebP art QA
on:
  pull_request:
    paths: ['.github/workflows/rescue-real-site-raster.yml']
permissions:
  contents: read
jobs:
  asset-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check current public PNG/WebP assets without browser installer
        run: |
          URL='https://ulmoa0701-a11y.github.io/ulmoa-sam/thinking-garden/games/rescue/'
          for i in $(seq 1 24); do
            if curl -fsSL --max-time 12 "$URL" | grep -q 'game.js?v=5' &&
               curl -fsSL --max-time 12 "$URL""game.js?v=5" | grep -q 'art/illustrated'; then break; fi
            sleep 5
          done
          for animal in rabbit pig cow duck; do
            for color in yellow blue green red; do
              curl -fsSL --max-time 18 -o "/tmp/$animal-$color.webp" "$URL""art/illustrated/$animal-$color.webp"
              head -c 4 "/tmp/$animal-$color.webp" | grep -q 'RIFF'
            done
          done
          echo 'LIVE WEBP ASSET PROBE PASS: 16 originals'
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Confirm public page and all original-raster sprites
        run: |
          URL='https://ulmoa0701-a11y.github.io/ulmoa-sam/thinking-garden/games/rescue/'
          good=0
          for attempt in $(seq 1 36); do
            if curl -fsSL --max-time 12 "$URL" | grep -q 'game.js?v=5' &&
               curl -fsSL --max-time 12 "$URL""game.js?v=5" | grep -q 'art/illustrated'; then
              good=1; break
            fi
            echo "Waiting for GitHub Pages v5 deployment $attempt"
            sleep 10
          done
          test "$good" = "1"
          for animal in rabbit pig cow duck; do
            for color in yellow blue green red; do
              curl -fsSL --max-time 20 -o "/tmp/$animal-$color.webp" "$URL""art/illustrated/$animal-$color.webp"
              head -c 4 "/tmp/$animal-$color.webp" | grep -q 'RIFF'
            done
          done
          echo 'PASS: all 16 raster animal assets served from public GitHub Pages'
      - name: Full desktop/mobile plus tablet browser play
        env:
          RESCUE_URL: https://ulmoa0701-a11y.github.io/ulmoa-sam/thinking-garden/games/rescue/
        run: node thinking-garden/games/rescue/rescue-smoke.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rescue-webp-real-site-screenshots
          path: rescue-qa-screenshots/
          if-no-files-found: ignore
