name: Multiplication Learning Path QA
on:
  pull_request:
    paths:
      - 'math-garden/grade-play/multiply-lesson/**'
      - 'qa/math-learning-path-qa.cjs'
      - '.github/workflows/math-learning-path-qa.yml'
      - 'gardens/index.html'
      - 'math-garden/grade-play/unit-app.js'
  push:
    branches: [main]
    paths:
      - 'math-garden/grade-play/multiply-lesson/**'
      - 'gardens/index.html'
      - 'math-garden/grade-play/unit-app.js'
      - 'qa/math-learning-path-qa.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-learning-sequence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runner
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Locate Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Start static preview
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/math-learning-preview.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8765/math-garden/grade-play/multiply-lesson/ >/dev/null && exit 0; sleep .25; done
          exit 1
      - name: Test conceptual learning, corrections and independence
        run: node qa/math-learning-path-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multiplication-learning-path-screens
          path: qa/math-learning-artifacts/
          if-no-files-found: ignore
