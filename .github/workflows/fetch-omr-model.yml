name: fetch-omr-model
on:
  pull_request:
    branches: [main]
  push:
    paths:
      - '.github/workflows/fetch-omr-model.yml'
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download public-domain OMR browser model
        run: |
          curl -L --fail --retry 3 -o omr-line.fp16.onnx "https://raw.githubusercontent.com/alexanderalber/satb-line-omr/c60823117a5c92b0c29f921dbca023e94026d279/model-public-domain/omr-line.fp16.onnx"
          sha256sum omr-line.fp16.onnx
          test "$(stat -c%s omr-line.fp16.onnx)" -gt 6000000
      - name: Fetch ONNX Runtime Web
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund onnxruntime-web@1.27.0
          test -f node_modules/onnxruntime-web/dist/ort.min.js
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: omr-public-domain-fp16
          path: omr-line.fp16.onnx
          retention-days: 1
      - name: Upload ORT Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: onnxruntime-web-1.27.0
          path: node_modules/onnxruntime-web/dist
          retention-days: 1
