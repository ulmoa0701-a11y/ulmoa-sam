name: Heart Score Audiveris OMR A/B (PR experiment only)
on:
  pull_request:
    paths:
      - '.github/workflows/heart-score-audiveris-benchmark.yml'
      - 'heart-score/qa/compare-musicxml-engines.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audiveris-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate independent identical printed music score
        run: |
          set -euo pipefail
          npm ci --prefix heart-score/qa --ignore-scripts --no-audit --no-fund
          npm install --prefix heart-score/qa --no-save --ignore-scripts --no-audit --no-fund vexflow@5.0.0 @vexflow-fonts/bravura@1.0.2 @vexflow-fonts/academico@1.0.1
          npx --prefix heart-score/qa playwright install chromium
          node heart-score/qa/render-typeset-score-e2e.cjs heart-score/qa/.audiveris-bench > /tmp/score-render.log
          python -m py_compile heart-score/qa/compare-musicxml-engines.py
      - name: Install official public Audiveris Linux release (AGPL, isolated)
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --max-time 40 https://api.github.com/repos/Audiveris/audiveris/releases/latest > /tmp/audiveris-release.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/audiveris-release.json'))
          debs=[a for a in r.get('assets',[]) if a['name'].endswith('.deb') and 'ubuntu24.04' in a['name'].lower() and 'x86_64' in a['name'].lower()]
          if len(debs)!=1:raise SystemExit('Expected exactly one official Linux x86-64 deb; found: '+str([a['name'] for a in r.get('assets',[])]))
          open('/tmp/audiveris-asset.txt','w').write(debs[0]['browser_download_url'])
          print('Audiveris release:',r.get('tag_name'),'asset:',debs[0]['name'])
          PY
          curl -fLsS --retry 2 --max-time 240 "$(cat /tmp/audiveris-asset.txt)" -o /tmp/audiveris.deb
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/audiveris.deb
          command -v audiveris
          audiveris -version
      - name: Compare Audiveris result with EXACT same score images
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p heart-score/qa/.audiveris-bench/results
          echo "INSTALL_OUTCOME=${{ steps.install.outcome }}" | tee heart-score/qa/.audiveris-bench/results/environment.txt
          if [[ "${{ steps.install.outcome }}" != "success" ]]; then
            echo '{"engine":"audiveris","status":"installation_failed","accuracy":"not_measured"}' > heart-score/qa/.audiveris-bench/results/install-failed.json
            exit 0
          fi
          for variant in normal lowres tilted; do
            case "$variant" in
              normal) input=heart-score/qa/.audiveris-bench/typeset-normal-19.png;;
              lowres) input=heart-score/qa/.audiveris-bench/typeset-lowres-19.jpg;;
              tilted) input=heart-score/qa/.audiveris-bench/typeset-tilted-19.jpg;;
            esac
            outdir="heart-score/qa/.audiveris-bench/results/$variant"
            mkdir -p "$outdir"
            timeout 330s audiveris -batch -export -output "$GITHUB_WORKSPACE/$outdir" -- "$GITHUB_WORKSPACE/$input" > "$outdir/engine.log" 2>&1
            status=$?
            xml=$(find "$outdir" -maxdepth 6 -type f \( -iname '*.mxl' -o -iname '*.musicxml' -o -iname '*.xml' \) -print -quit)
            if [[ -n "$xml" ]]; then
              python heart-score/qa/compare-musicxml-engines.py --truth heart-score/qa/doremi-ground-truth.json --xml "$xml" --engine audiveris --variant "$variant" --output "$outdir/compare.json" || true
            else
              printf '{"engine":"audiveris","variant":"%s","status":"no_musicxml","processExit":%s,"accuracy":"not_measured"}\n' "$variant" "$status" > "$outdir/compare.json"
              echo "NO_MUSICXML audiveris $variant exit=$status"
              tail -25 "$outdir/engine.log"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heart-score-audiveris-comparison
          path: |
            heart-score/qa/.audiveris-bench/results/**/*.json
            heart-score/qa/.audiveris-bench/results/**/*.log
            heart-score/qa/.audiveris-bench/results/*.json
            heart-score/qa/.audiveris-bench/results/*.txt
          include-hidden-files: true
          if-no-files-found: warn
