name: MoA Three Missions Interactive Play QA
on:
  pull_request:
    paths: ['thinking-garden/games/moa-missions/**', 'qa/moa-missions-play-qa.mjs', '.github/workflows/moa-missions-play-qa.yml']
  push:
    branches: [main]
    paths: ['thinking-garden/games/moa-missions/**', 'qa/moa-missions-play-qa.mjs', '.github/workflows/moa-missions-play-qa.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright-core@1.56.1
      - name: Locate browser
        run: echo "CHROME_BIN=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
      - name: Serve game
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/moa-three.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:8765/thinking-garden/ >/dev/null && exit 0; sleep .25; done
          cat /tmp/moa-three.log; exit 1
      - name: Exercise full actions in each mini game
        run: node qa/moa-missions-play-qa.mjs
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moa-missions-play-scenes
          path: qa/moa-missions-play-artifacts
          if-no-files-found: warn
