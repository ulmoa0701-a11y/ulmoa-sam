name: Heart Score OMR QA
on:
  push:
    paths:
      - 'heart-score/omr-ai-v*.js'
      - 'heart-score/omr-bar-consensus-v1.mjs'
      - 'heart-score/omr-scan-evidence-v1.mjs'
      - 'heart-score/ai/index.html'
      - 'heart-score/qa/**'
      - '.github/workflows/heart-score-omr-qa.yml'
  pull_request:
    paths:
      - 'heart-score/**'
      - '.github/workflows/heart-score-omr-qa.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check trial JavaScript
        run: |
          node --check heart-score/omr-ai-v702.js
          node --check heart-score/omr-scan-evidence-v1.mjs
      - name: Test independent pitch and rhythm validator
        run: node heart-score/qa/omr-exact-validator-regression.mjs
      - name: Run OMR measure regression (unit only, not image E2E)
        run: node heart-score/qa/omr-bar-consensus-regression.mjs
