name: Boomwhacker three selectable start modes LIVE QA
on:
  pull_request:
    paths:
      - '.github/workflows/boomwhacker-three-modes-live-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-three-modes:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install free browser driver
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
      - name: Exercise deployed selector and start flow in desktop and phone-sized Chrome
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright-core';
          const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--autoplay-policy=no-user-gesture-required']});
          let bad=0;
          try{
            for(const mobile of [false,true]){
              const page=await browser.newPage({viewport:mobile?{width:390,height:844}:{width:1366,height:900}});
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              await page.goto('https://ulmoa0701-a11y.github.io/ulmoa-sam/boomwhacker/?threeModesLiveQA='+Date.now(),{waitUntil:'domcontentloaded'});
              const options=await page.locator('#introMode option').evaluateAll(os=>os.filter(x=>!x.hidden).map(x=>({value:x.value,text:x.textContent})));
              for(const mode of ['interlude','music','voice']){
                if(mobile)await page.locator('#mobileSettingsBtn').click();
                await page.locator('#introMode').selectOption(mode);
                const picker=await page.locator('#introMode').evaluate(el=>({width:el.getBoundingClientRect().width,value:el.value}));
                if(mobile)await page.locator('#mobileSettingsClose').click();
                await page.locator(mobile?'#playBtn':'#startBtn').click();
                const started=await page.evaluate(()=>({
                  mode:introMode,active:introActive,beats:introBeats,count:introCountBeats,prelude:introPreviewBeats,
                  pulse:document.querySelector('#introPulse')?.innerText,heading:document.querySelector('#introHeading')?.innerText,
                  mr:!!mrSource,musicGain:!!introGain,shouldGuide:isGuidedStartMode(),plan:instrumentalPreludePlan().beats,
                  firstNoteMs:firstNoteMs(),songAt:audioRenderSongStartAt
                }));
                const pass=picker.value===mode&&(!mobile||picker.width>230)&&started.active&&started.mode===mode&&started.shouldGuide
                  &&started.count===0&&started.prelude===started.plan&&started.beats===started.plan&&started.mr&&started.musicGain
                  &&started.songAt>0&&!errors.length
                  &&(mode==='interlude'?started.pulse==='🎶':mode==='music'?started.pulse==='쿵':started.pulse==='하나');
                console.log('LIVE_THREE_START_MODES='+JSON.stringify({mobile,mode,options,picker,started,errors,pass}));
                if(!pass)bad++;
                await page.locator('#resetBtn').click();
              }
              await page.close();
            }
          }finally{await browser.close()}
          if(bad)process.exitCode=1;
          JS
