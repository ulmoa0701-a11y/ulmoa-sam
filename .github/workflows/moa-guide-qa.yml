name: Moa Page Guide Browser QA
on:
  pull_request:
    paths:
      - 'index.html'
      - 'brain-map/index.html'
      - 'gardens/index.html'
      - 'thinking-garden/index.html'
      - 'music-garden/index.html'
      - 'materials/index.html'
      - 'notes/index.html'
      - 'parents/index.html'
      - 'info/index.html'
      - 'request/index.html'
      - 'test/index.html'
      - 'heart-score/index.html'
      - 'boomwhacker/index.html'
      - 'assets/moa-site-guide.css'
      - 'assets/habom-navigation.js'
      - 'qa/moa-guide-qa.mjs'
      - '.github/workflows/moa-guide-qa.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'brain-map/index.html'
      - 'gardens/index.html'
      - 'thinking-garden/index.html'
      - 'music-garden/index.html'
      - 'materials/index.html'
      - 'notes/index.html'
      - 'parents/index.html'
      - 'info/index.html'
      - 'request/index.html'
      - 'test/index.html'
      - 'heart-score/index.html'
      - 'boomwhacker/index.html'
      - 'assets/moa-site-guide.css'
      - 'assets/habom-navigation.js'
      - 'qa/moa-guide-qa.mjs'
      - '.github/workflows/moa-guide-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site-guide:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Korean fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Install browser test client
        run: |
          npm install --no-save --no-package-lock playwright-core@1.56.1
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Serve local site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/moa-guide-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/brain-map/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/moa-guide-http.log
          exit 1
      - name: Verify guide across main pages and four screen sizes
        env:
          MOA_BASE: http://127.0.0.1:8765/
        run: node qa/moa-guide-qa.mjs
      - name: Verify deployed guide on GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          MOA_BASE: https://ulmoa0701-a11y.github.io/ulmoa-sam/
        run: |
          for attempt in $(seq 1 36); do
            curl --fail --silent --location --max-time 15 -o /tmp/moa-live-css.txt "${MOA_BASE}assets/moa-site-guide.css" || true
            curl --fail --silent --location --max-time 15 -o /tmp/moa-live-brain.html "${MOA_BASE}brain-map/" || true
            curl --fail --silent --location --max-time 15 -o /tmp/moa-live-home.html "${MOA_BASE}" || true
            if grep -Fq '2026-10-22' /tmp/moa-live-css.txt && grep -Fq '모아가 알려줄게' /tmp/moa-live-brain.html && grep -Fq 'moa-site-guide--home' /tmp/moa-live-home.html; then
              echo "Published guide detected on Pages. Running 52 real-browser checks."
              node qa/moa-guide-qa.mjs
              exit 0
            fi
            sleep 10
          done
          echo "Published guide did not propagate in time"
          exit 1
      - name: Save screenshots and QA summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moa-site-guide-screenshots
          path: qa/moa-guide-artifacts/
          if-no-files-found: warn
