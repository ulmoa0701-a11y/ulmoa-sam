name: Test image source resolution
on:
  pull_request:
    paths: ['.github/workflows/rescue-source-resolution.yml']
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Probe export sizes
        env:
          THUMB: 'https://media.canva.com/v2/image-resize/format:PNG/height:196/quality:100/uri:ifs%3A%2F%2FM%2F199a769d-f05b-41ed-b49c-e03d40f676f2/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAOT4BKKJTWlqkWzD0FcFBz3I3aLt7kj95hFGuB05O9CI&exp=1791567592&osig=AAAAAAAAAAAAAAAAAAAAAMj7yxsYp6AXefNEhK5PvxN9AZAEXn6_zS8-AS8cswn6&signer=media-rpc&token=AAIAAU0AJDE5OWE3NjlkLWYwNWItNDFlZC1iNDljLWUwM2Q0MGY2NzZmMgAAAAABoSG_-kAzLtwLpuupOORLJ2eKKtWQ-ImrBsnB2yND2-eiB4pkjg&x-canva-quality=thumbnail'
          LARGER: 'https://media.canva.com/v2/image-resize/format:PNG/height:1000/quality:100/uri:ifs%3A%2F%2FM%2F199a769d-f05b-41ed-b49c-e03d40f676f2/watermark:F/width:1000?csig=AAAAAAAAAAAAAAAAAAAAAOT4BKKJTWlqkWzD0FcFBz3I3aLt7kj95hFGuB05O9CI&exp=1791567592&osig=AAAAAAAAAAAAAAAAAAAAAMj7yxsYp6AXefNEhK5PvxN9AZAEXn6_zS8-AS8cswn6&signer=media-rpc&token=AAIAAU0AJDE5OWE3NjlkLWYwNWItNDFlZC1iNDljLWUwM2Q0MGY2NzZmMgAAAAABoSG_-kAzLtwLpuupOORLJ2eKKtWQ-ImrBsnB2yND2-eiB4pkjg&x-canva-quality=thumbnail'
        run: |
          python3 - <<'PY'
          import os,urllib.request,struct
          for k in ('THUMB','LARGER'):
            try:
              with urllib.request.urlopen(urllib.request.Request(os.environ[k],headers={'User-Agent':'Mozilla/5.0'}),timeout=20) as r:
                data=r.read()
                size=struct.unpack('>II',data[16:24]) if data[:8]==b'\x89PNG\r\n\x1a\n' else ('not png',)
                print(k,'HTTP',r.status,'bytes',len(data),'size',size)
            except Exception as e: print(k,'FAIL',str(e)[:190])
          PY
