name: Storybook HD Five Gardens Browser QA
on:
  pull_request:
    paths:
      - 'gardens/storybook-explore/**'
      - 'qa/storybook-hd-gardens-qa.cjs'
      - '.github/workflows/storybook-hd-gardens-qa.yml'
  workflow_dispatch:
permissions: { contents: read }
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chrome test adapter
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Find Chrome and install Korean fonts
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          timeout 240 sudo apt-get update -qq
          timeout 240 sudo apt-get install -y -qq fonts-noto-cjk
      - name: Serve web files
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/storybook-hd.log 2>&1 &
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:8765/gardens/storybook-explore/ >/dev/null && exit 0; sleep .4; done
          cat /tmp/storybook-hd.log
          exit 1
      - name: Verify real interactive map on five viewports
        run: node qa/storybook-hd-gardens-qa.cjs
      - name: Save screenshots and results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storybook-hd-five-gardens-browser-captures
          path: qa/artifacts/storybook-hd/
          retention-days: 14
          if-no-files-found: warn
