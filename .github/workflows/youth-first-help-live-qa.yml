name: Youth First Help Live Public QA
on:
  push:
    branches: [main]
    paths:
      - 'support-first/me/**'
      - 'qa/youth-first-help-qa.mjs'
      - '.github/workflows/youth-first-help-live-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Korean glyph fonts for visual QA (bounded)
        run: |
          if ! timeout 65s sudo apt-get update -qq; then
            echo "::warning::Font package metadata temporarily unavailable; functional QA will continue"
          fi
          if ! timeout 75s sudo apt-get install -y --no-install-recommends fonts-noto-cjk; then
            echo "::warning::Korean screenshot font unavailable; functional QA will continue"
          fi
          fc-match 'Noto Sans CJK KR' | head -1
      - name: Install browser driver
        run: |
          npm install --no-save --no-package-lock playwright-core@1.56.1
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Wait for exact deployed release assets
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ulmoa0701-a11y.github.io/ulmoa-sam/"
          # A marker in HTML can already exist in an OLD release. Compare
          # actual bytes of all relevant files to the checked-out commit.
          FILES=(support-first/me/index.html support-first/me/myself.css support-first/me/myself.js support-first/me/letter-reflection.js support-first/me/self-discovery.js)
          for attempt in $(seq 1 45); do
            all_ready=1
            for path in "${FILES[@]}"; do
              expected="$(sha256sum "$path" | cut -d ' ' -f 1)"
              downloaded="$(mktemp)"
              if curl --retry 2 -fsSL "${BASE}${path}?qa=${GITHUB_SHA}-${attempt}" -o "$downloaded"; then
                actual="$(sha256sum "$downloaded" | cut -d ' ' -f 1)"
                if [ "$actual" != "$expected" ]; then all_ready=0; fi
              else
                all_ready=0
              fi
              rm -f "$downloaded"
            done
            if [ "$all_ready" = 1 ]; then
              echo "All five public assets match current checkout: ${GITHUB_SHA}"
              exit 0
            fi
            echo "Public assets still updating (attempt ${attempt}/45)"
            sleep 8
          done
          echo "::error::Public Pages files do not yet match the commit under test"
          exit 1
      - name: Chromium mobile and desktop QA on live public site
        env:
          YOUTH_BASE: https://ulmoa0701-a11y.github.io/ulmoa-sam/
        run: node qa/youth-first-help-qa.mjs
      - name: Screenshots from public page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youth-first-help-live-screenshots
          path: qa/youth-first-help-artifacts/
          if-no-files-found: warn
