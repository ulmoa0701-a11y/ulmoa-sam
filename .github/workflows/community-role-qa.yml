name: Habom Community Role Picker QA
on:
  push:
    branches: [main]
    paths:
      - 'assets/habom-role-picker.js'
      - 'test/community-role/index.html'
      - 'request/index.html'
      - 'assets/community-board.css'
      - '.github/workflows/community-role-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  role-picker-desktop-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate selector JavaScript syntax
        run: node --check assets/habom-role-picker.js
      - name: Test synthetic form in real Chrome
        shell: bash
        run: |
          set -eu
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then echo 'Chrome not available'; exit 1; fi
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/hb-role-server.log 2>&1 &
          sleep 2
          for SIZE in 390,844 1200,900; do
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size="$SIZE" --virtual-time-budget=3000 --dump-dom "http://127.0.0.1:8765/test/community-role/?qa=1" > /tmp/hb-role-result.html 2>/tmp/hb-role-chrome.log
            if ! grep -q 'data-role-qa="PASS"' /tmp/hb-role-result.html; then
              grep -o 'data-role-qa="[^"]*"' /tmp/hb-role-result.html || true
              tail -n 25 /tmp/hb-role-chrome.log || true
              exit 1
            fi
            echo "PASS: $SIZE compact role picker + selection + form"
          done
