name: Rescue visual-body measurements
on:
  pull_request:
    paths: ['.github/workflows/rescue-body-metrics.yml']
permissions: { contents: read }
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet Pillow
      - name: Measure visible sprite body
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('thinking-garden/games/rescue/art/illustrated')
          for k in ['rabbit','pig','cow','duck']:
              im=Image.open(p/(k+'-yellow.webp')).convert('RGBA')
              a=im.getchannel('A')
              for threshold in (32,128,220):
                  bbox=a.point(lambda x:255 if x>=threshold else 0).getbbox()
                  print('BODY',k,'threshold',threshold,'canvas',im.size,'bbox',bbox,'visiblewh',((bbox[2]-bbox[0]),(bbox[3]-bbox[1])) if bbox else None)
          PY