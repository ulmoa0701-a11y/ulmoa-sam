name: Boomwhacker Live Audio Clock E2E
on:
  pull_request:
    paths:
      - 'boomwhacker/index.html'
      - 'boomwhacker/audio-clock-e2e.mjs'
      - '.github/workflows/boomwhacker-audio-clock-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audio-clock-real-time:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium browser test driver
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
      - name: Measure real-time music and visual beats PC and mobile
        run: node boomwhacker/audio-clock-e2e.mjs
