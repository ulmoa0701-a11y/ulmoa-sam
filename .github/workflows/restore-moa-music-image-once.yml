name: Restore approved Moa Music Garden illustration (one-time)
on:
  push:
    branches: [feat/moa-music-approved-art-20261011]
    paths: [.github/workflows/restore-moa-music-image-once.yml]
permissions:
  contents: write
jobs:
  restore-approved-art:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore one missing base64 character and verify original Git blob hash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request, time
          repo = 'ulmoa0701-a11y/ulmoa-sam'
          corrupted_blob = '4dcccd5fb91f63a8696c8d93b8d68fcca6bbd582'
          expected_git_sha = '36dabb2b242992aea88f0934563fb1c89880db37'
          expected_size = 9566
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/git/blobs/{corrupted_blob}',
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=35) as res:
              result = json.load(res)
          wrong_bytes = base64.b64decode(result['content'])
          canonical = base64.b64encode(wrong_bytes).decode('ascii')
          print('Corrupted byte count:',len(wrong_bytes),'Re-encoded length:',len(canonical),flush=True)
          # One character was lost during assistant transport. Repair, but commit ONLY
          # if the recovered original matches the locally computed Git blob hash.
          alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          candidates = [canonical[:-1],canonical.rstrip('='),canonical]
          found=None
          t0=time.monotonic()
          for source in dict.fromkeys(candidates):
              if len(source)!=12755: continue
              for i in range(len(source)+1):
                  left,right = source[:i],source[i:]
                  for ch in alphabet:
                      candidate=left+ch+right
                      try: raw=base64.b64decode(candidate,validate=True)
                      except Exception: continue
                      if len(raw)!=expected_size: continue
                      sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
                      if sha==expected_git_sha:
                          found=raw
                          print('Restored exact approved image at character',i,
                                'elapsed seconds',round(time.monotonic()-t0,2),flush=True)
                          break
                  if found: break
              if found: break
          if not found:
              raise SystemExit('No verified recovery: refusing to commit potentially altered artwork')
          assert found[:4]==b'RIFF' and found[8:12]==b'WEBP'
          dest=pathlib.Path('assets/moa-music-garden-approved.webp')
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_bytes(found)
          assert hashlib.sha1(b'blob '+str(len(found)).encode()+b'\0'+dest.read_bytes()).hexdigest()==expected_git_sha
          print('Restored verified asset:',str(dest),'bytes:',len(found),flush=True)
          PY
      - name: Commit approved image only to isolated development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/moa-music-garden-approved.webp
          git commit -m "asset(music-garden): save checksum-verified approved Moa illustration"
          git push origin HEAD:feat/moa-music-approved-art-20261011
