<svg xmlns="http://www.w3.org/2000/svg" width="480" height="620" viewBox="0 0 480 620" role="img" aria-labelledby="t d"><title id="t">차근차근 탐험단 활동지</title><desc id="d">칸의 위치를 찾고 그림을 살피는 활동 자료를 상징하는 격자 그림</desc><rect width="480" height="620" rx="30" fill="#f1f8f5"/><rect x="30" y="30" width="420" height="560" rx="24" fill="#fff" stroke="#aecfcb" stroke-width="3"/><rect x="30" y="30" width="420" height="116" rx="24" fill="#2c7680"/><rect x="30" y="120" width="420" height="26" fill="#2c7680"/><text x="64" y="83" font-size="30" font-weight="750" font-family="sans-serif" fill="#fff">차근차근 탐험단</text><text x="65" y="118" font-size="17" font-family="sans-serif" fill="#e0f3ee">보고 · 생각하고 · 표현하기</text><text x="72" y="202" font-size="23" font-weight="700" font-family="sans-serif" fill="#29505a">위치 탐험</text><g transform="translate(71 246)"><rect width="142" height="142" fill="#fff" stroke="#87a8ac" stroke-width="3"/><path d="M47 0V142M95 0V142M0 47H142M0 95H142" stroke="#87a8ac" stroke-width="2"/><rect x="0" y="0" width="47" height="47" fill="#72b6ab"/><rect x="95" y="47" width="47" height="48" fill="#72b6ab"/><rect x="47" y="95" width="48" height="47" fill="#72b6ab"/></g><g transform="translate(265 246)"><rect width="142" height="142" fill="#fff" stroke="#87a8ac" stroke-width="3"/><path d="M47 0V142M95 0V142M0 47H142M0 95H142" stroke="#87a8ac" stroke-width="2"/></g><path d="M229 318h23" stroke="#2c7680" stroke-width="4" stroke-linecap="round"/><path d="m244 309 9 9-9 9" fill="none" stroke="#2c7680" stroke-width="4" stroke-linecap="round"/><rect x="65" y="444" width="350" height="67" rx="16" fill="#eff7f5"/><text x="88" y="472" font-size="19" font-family="sans-serif" fill="#245b62">시각탐색 · 공간위치</text><text x="88" y="497" font-size="18" font-family="sans-serif" fill="#245b62">반응조절 · 위치기억</text><text x="360" y="558" font-size="18" font-family="sans-serif" font-weight="700" fill="#42787f">16쪽</text></svg>