<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>나만의 블로그 발견하기 · 일단 해봄</title><style>
:root{font-family:system-ui,-apple-system,"Pretendard",sans-serif;color:#293452;background:#f5f2fc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 4%,#e8dcff,transparent 35%),radial-gradient(circle at 95% 75%,#deefff,transparent 40%),#f8f6fd;min-height:100vh}main{max-width:760px;margin:auto;padding:22px 16px 90px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;color:#634da3;letter-spacing:-.5px}.small{font-size:13px;color:#77748e}.panel{margin-top:16px;background:#fff;border:1px solid #ece6fb;border-radius:28px;padding:clamp(22px,5vw,40px);box-shadow:0 15px 50px #4d3b7814}.eyebrow{color:#7561bc;font-weight:850;font-size:13px;letter-spacing:1px}.title{font-size:clamp(27px,5vw,39px);line-height:1.3;letter-spacing:-1.3px;margin:14px 0}.lead{font-size:16px;line-height:1.75;color:#5c6177}.mascot{display:inline-flex;align-items:center;justify-content:center;background:#eee7ff;border-radius:50%;width:57px;height:57px;font-size:28px}.progress{height:9px;background:#eeeaf6;border-radius:20px;overflow:hidden;margin:14px 0 6px}.fill{height:100%;background:linear-gradient(90deg,#9985ee,#7bc9ce);transition:width .25s}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin:22px 0}.choice{appearance:none;cursor:pointer;background:#faf9ff;border:2px solid #e7e3f1;border-radius:18px;min-height:85px;padding:15px 12px;text-align:left;color:#303652;font:inherit;display:flex;flex-direction:column;justify-content:center;gap:8px}.choice:hover,.choice:focus-visible{border-color:#9c87d8;outline:none}.choice[aria-pressed=true]{background:#f0eafe;border-color:#806ac6;box-shadow:0 0 0 2px #d8cef5}.emoji{font-size:27px}.choice b{font-size:15px}.color{height:42px;width:100%;border-radius:12px;border:1px solid #0001}.wide{grid-column:span 2}textarea,input{width:100%;font:inherit;border:2px solid #e3def0;border-radius:14px;padding:14px;color:#293452;background:#fff}textarea{min-height:100px;resize:vertical}.actions{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:18px}.btn{border:0;background:#765fc0;color:white;border-radius:15px;padding:14px 20px;font:inherit;font-weight:800;cursor:pointer;min-height:48px}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.alt{background:#f0edfa;color:#5d5285}.btn.ghost{background:transparent;color:#69627b}.hint{font-size:14px;line-height:1.65;color:#77758a}.summary{background:#f8f6fc;padding:18px;border-radius:16px;margin:12px 0;line-height:1.7;overflow-wrap:anywhere}.summary h3{margin:0 0 8px;font-size:16px}.pill{display:inline-block;padding:6px 10px;border-radius:99px;background:#eae7fa;font-size:13px;margin:3px}.hidden{display:none}.topright{display:flex;gap:6px;align-items:center}.mini{padding:8px 10px;border:0;border-radius:10px;background:#ede9f7;color:#665a92;cursor:pointer}footer{text-align:center;margin-top:28px;font-size:12px;color:#78758c}details{border-top:1px solid #eee;padding-top:13px;margin-top:18px}summary{cursor:pointer} @media(max-width:440px){.cards{gap:8px}.choice{padding:12px 10px;min-height:80px}.choice b{font-size:14px}.panel{border-radius:21px}.btn{padding:12px 14px}}
</style></head><body><main><header><div class="brand">🌿 일단 해봄 <span class="small">/ 나만의 블로그 발견하기</span></div><div class="topright"><button class="mini" id="save" type="button">저장</button><button class="mini" id="reset" type="button">처음부터</button></div></header><div class="progress" aria-label="진행률"><div class="fill" id="fill"></div></div><div id="stepcount" class="small" aria-live="polite"></div><section class="panel" id="app" aria-live="polite"></section><footer>정답은 없어. 네가 골라준 이야기로 네 블로그가 만들어져. 🌱<br>답변은 이 기기에만 임시 저장돼. 공개 서버로 전송하지 않아.</footer></main><script>
const questions=[
{id:"why",group:"시작",q:"블로그에 놀러 온 친구들이 어떤 기분이었으면 좋겠어?",help:"좋아하는 느낌을 골라봐. 여러 개 골라도 돼.",multi:true,opts:[["😆","재미있다!"],["🫶","나랑 비슷한 친구가 있네"],["✨","나도 해보고 싶다"],["☁️","마음이 편안하다"],["🔍","새로운 걸 알았다"],["💬","내 이야기를 들어줬으면"]]},
{id:"about",group:"나에 대해",q:"너를 소개할 때 먼저 보여주고 싶은 건?",multi:true,opts:[["🎮","좋아하는 게임"],["💻","컴퓨터로 하는 일"],["🎧","음악·영상"],["📚","일상 이야기"],["🌱","새로운 도전"],["🧩","내가 만든 것"]]},
{id:"hobby",group:"관심사",q:"요즘 시간이 가장 잘 가는 건 어떤 거야?",multi:true,opts:[["🕹️","게임하기"],["📺","영상 보기"],["🎵","음악 듣기"],["⚽","운동"],["🎨","그림·꾸미기"],["🛌","쉬기"]]},
{id:"game",group:"관심사 깊이 보기",when:a=>["좋아하는 게임","게임하기"].some(x=>(a.about||[]).includes(x)||(a.hobby||[]).includes(x)),q:"게임에서 어떤 점이 특히 재미있어?",multi:true,opts:[["🗺️","탐험과 모험"],["🏡","짓고 꾸미기"],["🏆","경쟁과 승리"],["🤝","친구와 함께하기"],["🧠","퍼즐·전략"],["🤣","예상 못한 웃긴 상황"]]},
{id:"gameTopic",group:"글 아이디어",when:a=>a.game?.length,q:"게임 이야기를 쓴다면 무엇부터 해볼까?",opts:[["⭐","좋아하는 게임 소개"],["😂","게임하다 생긴 웃긴 일"],["💡","초보자에게 알려주기"],["🔧","내가 만든 작품"]]},
{id:"otherTopic",group:"글 아이디어",q:"게임 말고도 어떤 이야기를 올리고 싶어?",multi:true,opts:[["🌤️","평범한 하루"],["🍜","먹거리·장소"],["🐱","동물·캐릭터"],["🧪","처음 해본 것"],["🗣️","내 생각·의견"],["📸","사진·그림"]]},
{id:"story",group:"경험",q:"글을 쓸 때 어떤 방식이면 편할까?",opts:[["⌨️","직접 쓰기"],["🎤","말하면 글로 정리하기"],["🔢","질문에 번호로 답하기"],["📷","사진에 짧게 설명하기"],["🔀","그때마다 다르게"]]},
{id:"tone",group:"분위기",q:"블로그의 말투는 어떤 느낌이면 좋겠어?",opts:[["😄","친구처럼 편하게"],["🤣","장난스럽고 웃기게"],["🌙","잔잔하고 따뜻하게"],["🎯","짧고 딱 핵심만"],["📖","이야기를 들려주듯"]]},
{id:"style",group:"디자인",q:"어떤 화면이 네 블로그 같아?",help:"선택하면 나중에 디자인 미리보기를 만들 때 참고할게.",opts:[["🌲","신비로운 숲"],["🌌","밤하늘과 별"],["🎮","게임·픽셀 세계"],["🏙️","도시와 미래"],["☁️","포근한 일러스트"],["⬜","아주 심플한 화면"]]},
{id:"color",group:"디자인",q:"블로그 대표 색으로 가장 마음에 드는 건?",kind:"color",opts:[["#87b9f9","하늘 파랑"],["#a8dcad","부드러운 초록"],["#c5aff0","연보라"],["#f5b6c7","연분홍"],["#f9cd82","따뜻한 노랑"],["#343b58","짙은 남색"]]},
{id:"palette",group:"디자인",q:"두 가지 색이 함께 있다면 어떤 조합이 좋아?",kind:"palette",opts:[["#a8dcad,#d7e8ff","숲과 하늘"],["#283553,#edca92","밤하늘과 별"],["#f4b8cf,#b6b3ee","핑크와 보라"],["#d8c9a8,#f6efe2","따뜻한 베이지"],["#333e61,#89c8dc","남색과 하늘"],["#fff,#242942","흰색과 검정"]]},
{id:"character",group:"디자인",q:"블로그에 함께할 캐릭터가 필요할까?",opts:[["🐈","동물 캐릭터"],["🙂","사람 캐릭터"],["👾","게임 캐릭터"],["🪄","상상 속 캐릭터"],["🚫","캐릭터 없이"]]},
{id:"nickname",group:"브랜드",q:"블로그 이름에 무엇이 들어가면 좋겠어?",opts:[["🌱","도전·성장 느낌"],["✨","특별한 상상 느낌"],["🎮","게임·취미 느낌"],["🧡","편안한 일상 느낌"],["🔤","내가 고른 별명"],["❔","아직 정하지 않기"]]},
{id:"specificName",group:"브랜드",q:"떠오르는 닉네임이나 이름이 있어?",help:"없으면 그냥 넘어가도 돼. 본명이나 학교 이름은 적지 않아도 돼.",kind:"text"},
{id:"posts",group:"운영 방식",q:"첫 번째 글로 무엇을 올리면 재미있을까?",multi:true,opts:[["🙋","나 소개하기"],["🎮","좋아하는 게임"],["🗓️","오늘의 이야기"],["✨","새로 해본 것"],["🎨","내 취향 소개"],["🤔","나만의 생각"]]},
{id:"pace",group:"운영 방식",q:"글은 얼마나 자주 올리고 싶어?",opts:[["📅","일주일 한 번"],["✌️","일주일 두 번"],["🌈","생각날 때"],["🧘","일단 한 글만 써보기"]]},
{id:"privacy",group:"내가 정하는 공개 범위",q:"블로그에 공개하고 싶지 않은 것은?",help:"여러 개 고를 수 있어. 실제 게시할 때는 보호자와 함께 공개 범위를 다시 확인하자.",multi:true,opts:[["👤","내 얼굴·실명"],["🎙️","목소리"],["🏫","학교 관련 정보"],["👥","가족·친구 정보"],["💭","힘들었던 개인적인 경험"],["🔒","아직 공개 범위를 모르겠어"]]},
{id:"school",group:"선택 이야기",q:"학교생활 이야기도 블로그에 쓰고 싶어?",help:"이 질문은 건너뛰어도 괜찮아. 어려운 경험을 억지로 공개하지 않아도 돼.",opts:[["😊","즐거웠던 일은 써볼래"],["🌱","새롭게 해본 일은 써볼래"],["💬","가끔 내 생각을 쓰고 싶어"],["🙅","학교 이야기는 빼고 싶어"]]},
{id:"dream",group:"마무리",q:"블로그를 하면서 무엇이 가장 기대돼?",multi:true,opts:[["🎉","재미있는 활동"],["🧩","내 취향으로 꾸미기"],["✍️","내 이야기 기록"],["👀","누군가 내 글 읽기"],["🚀","처음 해보는 도전"],["🌻","그냥 천천히 해보기"]]}
];
const KEY="jihan-blog-discovery-v1";let data={answers:{},index:-1,finished:false};try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&typeof x==="object"&&x.answers)data={...data,...x}}catch(e){}
const el=document.getElementById("app"),count=document.getElementById("stepcount"),fill=document.getElementById("fill");
function visible(){return questions.filter(q=>!q.when||q.when(data.answers))}
function store(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert("이 브라우저에서 자동 저장을 사용할 수 없어. 완료 후 결과를 다운로드해 줘.")}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function draw(){const qs=visible();if(data.finished)return result();const n=data.index;if(n<0){count.textContent="시작하기";fill.style.width="0%";el.innerHTML='<div class="mascot">🌱</div><p class="eyebrow">MY BLOG DISCOVERY</p><h1 class="title">내 블로그는<br>어떤 모습일까?</h1><p class="lead">좋아하는 것부터 색깔, 게임, 이야기까지 하나씩 골라보자. 꼭 잘 대답할 필요는 없어. <b>모르겠으면 건너뛰어도 괜찮아.</b></p><div class="summary">🎯 선택에 따라 질문이 조금씩 달라져.<br>🎨 내가 고른 색으로 블로그를 상상해 볼 수 있어.<br>🔒 답변은 이 기기에만 임시 저장돼.</div><div class="actions"><button class="btn" id="start">시작해 보기 →</button></div>';document.getElementById("start").onclick=()=>{data.index=0;store();draw()};return}
if(n>=qs.length){data.finished=true;store();result();return}
let q=qs[n],v=data.answers[q.id],choices=q.opts||[];count.textContent=(n+1)+" / "+qs.length+" · "+q.group;fill.style.width=Math.round(n/qs.length*100)+"%";let options=choices.map(([ico,name],i)=>{let selected=q.multi?Array.isArray(v)&&v.includes(name):v===name;let swatch=q.kind==="color"?'<span class="color" style="background:'+ico+'"></span>':q.kind==="palette"?'<span class="color" style="background:linear-gradient(115deg,'+ico.split(",").join(" 50%,")+' 50%)"></span>':'<span class="emoji">'+esc(ico)+'</span>';return '<button class="choice" type="button" data-choice="'+i+'" aria-pressed="'+selected+'">'+swatch+'<b>'+esc(name)+'</b></button>'}).join("");
el.innerHTML='<div class="mascot">💬</div><p class="eyebrow">'+esc(q.group)+'</p><h1 class="title">'+esc(q.q)+'</h1><p class="lead">'+esc(q.help||"마음에 드는 답을 골라줘. 정답은 없어!")+'</p>'+(q.kind==="text"?'<textarea id="free" maxlength="150" placeholder="생각나는 게 있으면 적어줘. 비워도 돼.">'+esc(v||"")+'</textarea>':'<div class="cards">'+options+'<button class="choice wide" id="other" type="button" aria-pressed="'+Boolean(data.answers[q.id+"_other"])+'"><span class="emoji">✏️</span><b>직접 쓰고 싶어</b></button></div><div id="otherBox" '+(!data.answers[q.id+"_other"]?'class="hidden"':'')+'><input id="otherText" maxlength="120" placeholder="내 생각을 짧게 적어줘" value="'+esc(data.answers[q.id+"_other"]||"")+'"></div>')+'<div class="actions"><button class="btn alt" id="back">← 이전</button><button class="btn ghost" id="skip">건너뛰기</button><button class="btn" id="next">'+(n===qs.length-1?"결과 보기":"다음 →")+'</button></div><p class="hint">⭐ 마음이 바뀌면 이전으로 돌아가 다시 골라도 괜찮아.</p>';
el.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>{let choice=choices[+b.dataset.choice][1];if(q.multi){let a=Array.isArray(data.answers[q.id])?[...data.answers[q.id]]:[];data.answers[q.id]=a.includes(choice)?a.filter(x=>x!==choice):[...a,choice]}else data.answers[q.id]=choice;store();draw()});
const other=document.getElementById("other");if(other)other.onclick=()=>{let box=document.getElementById("otherBox");box.classList.toggle("hidden");if(!box.classList.contains("hidden")){document.getElementById("otherText").focus();if(!data.answers[q.id+"_other"])data.answers[q.id+"_other"]=" " }else delete data.answers[q.id+"_other"];store()};
document.getElementById("back").onclick=()=>{data.index=Math.max(-1,n-1);store();draw()};document.getElementById("skip").onclick=()=>{delete data.answers[q.id];delete data.answers[q.id+"_other"];advance()};document.getElementById("next").onclick=()=>{if(q.kind==="text")data.answers[q.id]=document.getElementById("free").value.trim();else{let t=document.getElementById("otherText");if(t)data.answers[q.id+"_other"]=t.value.trim()}advance()};function advance(){const after=visible();const pos=after.findIndex(x=>x.id===q.id);data.index=pos<0?Math.min(n,after.length):pos+1;store();draw()}}
function result(){fill.style.width="100%";count.textContent="완료 · 내 블로그 발견 카드";let a=data.answers;let get=id=>Array.isArray(a[id])?a[id]:a[id]?[a[id]]:[];let themes=[...get("about"),...get("hobby"),...get("otherTopic")];let ideas=[...get("gameTopic"),...get("posts")];let nick=get("specificName")[0]||"아직 정하지 않았어";const summary=[["내가 좋아하는 것",themes],["블로그가 주고 싶은 느낌",get("why")],["어울리는 화면과 색", [...get("style"),...get("color"),...get("palette")]],["캐릭터·말투",[...get("character"),...get("tone")]],["글 아이디어",ideas],["편한 제작 방식",get("story")],["운영 주기",get("pace")],["비공개로 두고 싶은 것",get("privacy")],["블로그 이름 힌트",[...get("nickname"),nick]]];el.innerHTML='<div class="mascot">🌟</div><p class="eyebrow">DISCOVERY COMPLETE</p><h1 class="title">나만의 블로그 힌트를 찾았어!</h1><p class="lead">네가 고른 답으로 만들어진 발견 카드야. 이건 결정된 블로그가 아니라 <b>앞으로 함께 만들 때 참고할 아이디어</b>야.</p>'+summary.map(([k,v])=>'<div class="summary"><h3>'+esc(k)+'</h3>'+(v.length?v.map(x=>'<span class="pill">'+esc(x)+'</span>').join(""):'<span class="hint">아직 고르지 않았어</span>')+'</div>').join("")+'<details><summary>더 자세한 답변 보기</summary>'+visible().map(q=>'<div class="summary"><h3>'+esc(q.q)+'</h3>'+esc([...get(q.id),...get(q.id+"_other")].join(", ")||"건너뜀")+'</div>').join("")+'</details><div class="actions"><button class="btn alt" id="edit">질문 다시 보기</button><button class="btn" id="download">결과 저장 ↓</button><button class="btn alt" id="copy">결과 복사</button></div><p class="hint">🔒 이 결과는 자동으로 치료사에게 전달되지 않아. 필요한 경우 저장한 파일만 안전하게 공유해 줘.</p>';
document.getElementById("edit").onclick=()=>{data.finished=false;data.index=0;store();draw()};const exportObj={title:"나만의 블로그 발견하기",createdAt:new Date().toISOString(),answers:visible().map(q=>({question:q.q,answer:[...get(q.id),...get(q.id+"_other")]})),planningHints:Object.fromEntries(summary)};let payload=JSON.stringify(exportObj,null,2);document.getElementById("download").onclick=()=>{let url=URL.createObjectURL(new Blob([payload],{type:"application/json;charset=utf-8"}));let link=document.createElement("a");link.href=url;link.download="my-blog-discovery.json";link.click();setTimeout(()=>URL.revokeObjectURL(url),1200)};document.getElementById("copy").onclick=()=>{let txt=exportObj.answers.map(x=>x.question+"\n"+(x.answer.join(", ")||"건너뜀")).join("\n\n");if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(()=>alert("복사했어!")).catch(()=>fallback(txt));else fallback(txt)};function fallback(txt){let t=document.createElement("textarea");t.value=txt;document.body.append(t);t.select();document.execCommand("copy");t.remove();alert("복사했어!")}}
document.getElementById("save").onclick=()=>{store();alert("이 기기에 임시 저장했어. 다른 기기에는 자동으로 옮겨지지 않아.")};document.getElementById("reset").onclick=()=>{if(confirm("지금까지 고른 답변을 모두 지우고 처음부터 시작할까?")){data={answers:{},index:-1,finished:false};store();draw()}};draw();
</script></body></html>
