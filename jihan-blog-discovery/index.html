el.innerHTML='<div class="mascot">💬</div><p class="eyebrow">'+esc(q.group)+'</p><h1 class="title">'+esc(q.q)+'</h1><p class="lead">'+esc(q.help||"마음에 드는 답을 골라줘. 정답은 없어!")+'</p>'+(q.kind==="text"?'<textarea id="free" maxlength="150" placeholder="생각나는 게 있으면 적어줘. 비워도 돼.">'+esc(v||"")+'</textarea>':'<div class="cards">'+options+'<button class="choice wide" id="other" type="button" aria-pressed="'+Boolean(data.answers[q.id+"_other"])+'"><span class="emoji">✏️</span><b>직접 쓰고 싶어</b></button></div><div id="otherBox" '+(!data.answers[q.id+"_other"]?'class="hidden"':'')+'><input id="otherText" maxlength="120" placeholder="내 생각을 짧게 적어줘" value="'+esc(data.answers[q.id+"_other"]||"")+'"></div>')+(["style","color","palette","specificName"].includes(q.id)?preview():"")+'<div class="actions"><button class="btn alt" id="back">← 이전</button><button class="btn ghost" id="skip">건너뛰기</button><button class="btn alt" id="pause">오늘 여기까지</button><button class="btn" id="next">'+(n===qs.length-1?"결과 보기":"다음 →")+'</button></div><p class="hint">⭐ 마음이 바뀌면 이전으로 돌아가 다시 골라도 괜찮아.</p>';
el.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>{let choice=choices[+b.dataset.choice][1];if(q.multi){let a=Array.isArray(data.answers[q.id])?[...data.answers[q.id]]:[];data.answers[q.id]=a.includes(choice)?a.filter(x=>x!==choice):[...a,choice]}else data.answers[q.id]=choice;const current=visible().findIndex(x=>x.id===q.id);if(current>=0)data.index=current;store();draw()});
document.getElementById("pause").onclick=()=>{let free=document.getElementById("free");if(free)data.answers[q.id]=free.value.trim();let custom=document.getElementById("otherText");if(custom)data.answers[q.id+"_other"]=custom.value.trim();data.paused=true;store();draw()};const other=document.getElementById("other");if(other)other.onclick=()=>{let box=document.getElementById("otherBox");box.classList.toggle("hidden");if(!box.classList.contains("hidden")){document.getElementById("otherText").focus();if(!data.answers[q.id+"_other"])data.answers[q.id+"_other"]=" " }else delete data.answers[q.id+"_other"];store()};
document.getElementById("back").onclick=()=>{data.index=Math.max(-1,n-1);store();draw()};document.getElementById("skip").onclick=()=>{delete data.answers[q.id];delete data.answers[q.id+"_other"];advance()};document.getElementById("next").onclick=()=>{if(q.kind==="text")data.answers[q.id]=document.getElementById("free").value.trim();else{let t=document.getElementById("otherText");if(t)data.answers[q.id+"_other"]=t.value.trim()}advance()};function advance(){const after=visible();const pos=after.findIndex(x=>x.id===q.id);data.index=pos<0?Math.min(n,after.length):pos+1;store();draw()}}
async function deliver(){if(sending||data.submitted||!data.optIn)return;sending=true;let st=document.getElementById("delivery");if(st)st.textContent="선생님에게 안전하게 저장하는 중…";try{if(!data.submissionId)data.submissionId=crypto.randomUUID();store();const c=new AbortController();const tm=setTimeout(()=>c.abort(),15000);let response;try{response=await fetch("https://miohovwmhmtcvkurjamm.supabase.co/functions/v1/jihan-blog-intake",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({submissionId:data.submissionId,consent:true,answers:data.answers}),signal:c.signal})}finally{clearTimeout(tm)}const r=await response.json().catch(()=>({}));if(!response.ok||!r.ok)throw Error(r.error||"server_error");data.submitted=true;store();if(st)st.textContent="✅ 선생님 비공개 응답함에 저장됐어!"}catch(e){if(st)st.textContent="⚠️ 자동 전달이 완료되지 않았어. 아래 ‘전송 다시 시도’를 눌러줘. 결과 파일 다운로드도 가능해."}finally{sending=false}}function result(){fill.style.width="100%";count.textContent="완료 · 내 블로그 발견 카드";let a=data.answers;let get=id=>Array.isArray(a[id])?a[id]:a[id]?[a[id]]:[];let themes=[...get("about"),...get("hobby"),...get("otherTopic")];let ideas=[...get("gameTopic"),...get("posts"),...get("postDetail")];let nick=get("specificName")[0]||"아직 정하지 않았어";const summary=[["내가 좋아하는 것",[...themes,...get("favoriteGame")]],["블로그가 주고 싶은 느낌",get("why")],["어울리는 화면과 색", [...get("style"),...get("color"),...get("palette"),...get("visualWorld")]],["캐릭터·말투",[...get("character"),...get("tone")]],["글 아이디어",ideas],["블로그 운영 목적",[...get("blogBenefit"),...get("priority")]],["3개월 후 바라는 모습",get("after3m")],["참고하고 싶은 스타일",get("lookReference")],["편한 제작 방식",get("story")],["운영 주기",get("pace")],["비공개로 두고 싶은 것",get("privacy")],["블로그 이름 힌트",[...get("nickname"),nick]]];el.innerHTML='<div class="mascot">🌟</div><p class="eyebrow">DISCOVERY COMPLETE</p><h1 class="title">나만의 블로그 힌트를 찾았어!</h1><p class="lead">네가 고른 답으로 만들어진 발견 카드야. 이건 결정된 블로그가 아니라 <b>앞으로 함께 만들 때 참고할 아이디어</b>야.</p>'+summary.map(([k,v])=>'<div class="summary"><h3>'+esc(k)+'</h3>'+(v.length?v.map(x=>'<span class="pill">'+esc(x)+'</span>').join(""):'<span class="hint">아직 고르지 않았어</span>')+'</div>').join("")+preview()+'<div class="summary" role="status" id="delivery">'+(data.submitted?'✅ 선생님 비공개 응답함에 저장됐어!':data.optIn?'저장 상태 확인 중…':'현재 선생님에게 자동 전송하지 않도록 선택했어. 이 기기에만 남아 있어.')+'</div>'+'<details><summary>더 자세한 답변 보기</summary>'+visible().map(q=>'<div class="summary"><h3>'+esc(q.q)+'</h3>'+esc([...get(q.id),...get(q.id+"_other")].join(", ")||"건너뜀")+'</div>').join("")+'</details><div class="actions"><button class="btn alt" id="edit">질문 다시 보기</button><button class="btn" id="download">결과 저장 ↓</button><button class="btn alt" id="copy">결과 복사</button><button class="btn alt" id="retry">전송 다시 시도</button></div><p class="hint">🔒 처음에 자동 전달을 선택한 경우에만 비공개 서버에 저장돼. 결과 파일은 별도로 내려받을 수 있어.</p>';
document.getElementById("retry").onclick=()=>{if(!data.optIn){if(!confirm("선생님 비공개 응답함으로 결과를 전송할까?"))return;data.optIn=true;store()}deliver()};if(data.optIn&&!data.submitted)void deliver();document.getElementById("edit").onclick=()=>{data.finished=false;data.index=0;data.submitted=false;data.submissionId=null;store();draw()};const exportObj={title:"나만의 블로그 발견하기",createdAt:new Date().toISOString(),answers:visible().map(q=>({question:q.q,answer:[...get(q.id),...get(q.id+"_other")]})),planningHints:Object.fromEntries(summary)};let payload=JSON.stringify(exportObj,null,2);document.getElementById("download").onclick=()=>{let url=URL.createObjectURL(new Blob([payload],{type:"application/json;charset=utf-8"}));let link=document.createElement("a");link.href=url;link.download="my-blog-discovery.json";link.click();setTimeout(()=>URL.revokeObjectURL(url),1200)};document.getElementById("copy").onclick=()=>{let txt=exportObj.answers.map(x=>x.question+"\n"+(x.answer.join(", ")||"건너뜀")).join("\n\n");if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(()=>alert("복사했어!")).catch(()=>fallback(txt));else fallback(txt)};function fallback(txt){let t=document.createElement("textarea");t.value=txt;document.body.append(t);t.select();document.execCommand("copy");t.remove();alert("복사했어!")}}
document.getElementById("save").onclick=()=>{store();alert("이 기기에 임시 저장했어. 다른 기기에는 자동으로 옮겨지지 않아.")};document.getElementById("reset").onclick=()=>{if(confirm("지금까지 고른 답변을 모두 지우고 처음부터 시작할까?")){data={answers:{},index:-1,finished:false,paused:false,optIn:false,submitted:false,submissionId:null};store();draw()}};draw();
