<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>울모아 PlayCanvas 벤치</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111827;font-family:system-ui}canvas{width:100%;height:100%;display:block}.hud{position:fixed;left:12px;top:12px;z-index:5;background:#fffbe8ee;color:#183a2a;border:2px solid #52745f;border-radius:14px;padding:10px 12px;font-weight:800;line-height:1.45}.note{font-size:12px;font-weight:600;opacity:.8}</style></head><body><canvas id="app"></canvas><div class="hud" id="hud">PlayCanvas 로딩 중…<div class="note">동일 장면 벤치마크</div></div><script type="module">
import * as pc from 'https://cdn.jsdelivr.net/npm/playcanvas@2.23.0/+esm';
const t0=performance.now(),canvas=document.getElementById('app'),hud=document.getElementById('hud');
const app=new pc.Application(canvas,{graphicsDeviceOptions:{antialias:false,alpha:false},mouse:new pc.Mouse(canvas),touch:new pc.TouchDevice(canvas)});app.graphicsDevice.maxPixelRatio=1;app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);app.setCanvasResolution(pc.RESOLUTION_AUTO);window.addEventListener('resize',()=>app.resizeCanvas());app.scene.ambientLight=new pc.Color(.42,.46,.5);
const mats={};function mat(key,c){if(mats[key])return mats[key];const m=new pc.StandardMaterial();m.diffuse=c;m.metalness=.04;m.gloss=.22;m.update();return mats[key]=m}
function shape(parent,type,p,s,c,key){const e=new pc.Entity(type);e.addComponent('render',{type});e.setLocalPosition(...p);e.setLocalScale(...s);e.render.material=mat(key,c);(parent||app.root).addChild(e);return e}
function humanoid(name,p,c,key){const r=new pc.Entity(name);r.setPosition(...p);app.root.addChild(r);shape(r,'cylinder',[0,1,0],[.55,1.45,.55],c,key);shape(r,'sphere',[0,2.25,0],[.65,.65,.65],new pc.Color(.86,.72,.58),'skin');shape(r,'box',[-.55,1.05,0],[.28,1.1,.28],c,key);shape(r,'box',[.55,1.05,0],[.28,1.1,.28],c,key);return r}
function boss(name,p,c,key){const r=new pc.Entity(name);r.setPosition(...p);app.root.addChild(r);shape(r,'cylinder',[0,1.4,0],[1.05,2.1,1.05],c,key);shape(r,'sphere',[0,3.1,0],[1.1,.9,1.1],c,key);shape(r,'box',[-1.25,1.7,0],[.45,2.1,.45],c,key);shape(r,'box',[1.25,1.7,0],[.45,2.1,.45],c,key);return r}
function tree(x,z){const r=new pc.Entity('tree');r.setPosition(x,0,z);app.root.addChild(r);shape(r,'cylinder',[0,1,0],[.55,2,.55],new pc.Color(.42,.25,.13),'wood');shape(r,'sphere',[0,3,0],[1.7,1.35,1.7],new pc.Color(.18,.48,.2),'leaf')}
shape(null,'box',[0,-.15,0],[28,.3,22],new pc.Color(.5,.72,.42),'ground');shape(null,'box',[-7,1.5,-4],[5.5,3,3.8],new pc.Color(.78,.7,.61),'hotel');shape(null,'cylinder',[3,.05,-4],[4,.12,4],new pc.Color(.24,.58,.72),'water');[[-11,-7],[-10,4],[-3,8],[5,8],[11,4],[10,-7],[1,-9]].forEach(v=>tree(...v));
const player=humanoid('player',[-6,0,-2],new pc.Color(.12,.3,.55),'player'),gardener=humanoid('gardener',[-2,0,0],new pc.Color(.2,.5,.25),'gardener'),woods=boss('woods',[8,0,6],new pc.Color(.18,.5,.21),'woods'),eye=boss('eye',[7,0,-4],new pc.Color(.65,.45,.75),'eye'),smog=boss('smog',[11,0,-6],new pc.Color(.22,.35,.24),'smog');
const sun=new pc.Entity('sun');sun.addComponent('light',{type:'directional',intensity:1.15,color:new pc.Color(1,.93,.78),castShadows:false});sun.setEulerAngles(55,35,0);app.root.addChild(sun);const camera=new pc.Entity('camera');camera.addComponent('camera',{clearColor:new pc.Color(.53,.72,.9),farClip:80});camera.setPosition(13,16,18);camera.lookAt(0,0,0);app.root.addChild(camera);
let elapsed=0,frames=0,last=performance.now(),readyAt=0;app.on('update',dt=>{elapsed+=dt;frames++;const ph=(Math.sin(elapsed*.35)+1)/2;camera.camera.clearColor=new pc.Color(.05+.48*ph,.08+.64*ph,.16+.72*ph);sun.light.intensity=.25+.9*ph;app.scene.ambientLight=new pc.Color(.12+.33*ph,.15+.32*ph,.22+.3*ph);const pp=player.getPosition(),ep=eye.getPosition(),d=new pc.Vec3(pp.x-ep.x,0,pp.z-ep.z);if(d.length()>2.6){d.normalize().mulScalar(dt*1.5);eye.translate(d.x,0,d.z)}woods.rotate(0,dt*12,0);smog.rotate(0,-dt*8,0);const now=performance.now();if(now-last>500){const fps=readyAt?frames/((now-readyAt)/1000):0;const backend=app.graphicsDevice.isWebGPU?'WebGPU':'WebGL2';window.__bench={engine:'PlayCanvas',readyMs:+(readyAt-t0).toFixed(1),fps:+fps.toFixed(1),backend,frames};hud.innerHTML=`PlayCanvas · ${backend}<br>${fps.toFixed(1)} FPS · 시작 ${(readyAt-t0).toFixed(0)}ms<div class="note">낮/밤 + 3D 보스 + eye 추적</div>`;last=now}});app.start();readyAt=performance.now();window.__bench={engine:'PlayCanvas',readyMs:+(readyAt-t0).toFixed(1),fps:0,backend:app.graphicsDevice.isWebGPU?'WebGPU':'WebGL2'};
</script></body></html>
