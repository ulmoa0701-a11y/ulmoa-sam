<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>울모아 Babylon 벤치</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111827;font-family:system-ui}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:fixed;left:12px;top:12px;z-index:5;background:#fffbe8ee;color:#183a2a;border:2px solid #52745f;border-radius:14px;padding:10px 12px;font-weight:800;line-height:1.45}.note{font-size:12px;font-weight:600;opacity:.8}</style></head><body><canvas id="app"></canvas><div class="hud" id="hud">Babylon.js 로딩 중…<div class="note">동일 장면 벤치마크</div></div><script type="module">
import {Engine} from 'https://cdn.jsdelivr.net/npm/@babylonjs/core@9.28.0/Engines/engine.js';import {Scene} from 'https://cdn.jsdelivr.net/npm/@babylonjs/core@9.28.0/scene.js';import {Vector3,Color3,Color4} from 'https://cdn.jsdelivr.net/npm/@babylonjs/core@9.28.0/Maths/math.js';import {FreeCamera} from 'https://cdn.jsdelivr.net/npm/@babylonjs/core@9.28.0/Cameras/freeCamera.js';import {HemisphericLight} from 'https://cdn.jsdelivr.net/npm/@babylonjs/core@9.28.0/Lights/hemisphericLight.js';import {DirectionalLight} from 'https://cdn.jsdelivr.net/npm/@babylonjs/core@9.28.0/Lights/directionalLight.js';import {MeshBuilder} from 'https://cdn.jsdelivr.net/npm/@babylonjs/core@9.28.0/Meshes/meshBuilder.js';import {TransformNode} from 'https://cdn.jsdelivr.net/npm/@babylonjs/core@9.28.0/Meshes/transformNode.js';import {StandardMaterial} from 'https://cdn.jsdelivr.net/npm/@babylonjs/core@9.28.0/Materials/standardMaterial.js';
const t0=performance.now(),canvas=document.getElementById('app'),hud=document.getElementById('hud');const engine=new Engine(canvas,false,{preserveDrawingBuffer:false,stencil:false,antialias:false,adaptToDeviceRatio:false});engine.setHardwareScalingLevel(1);const scene=new Scene(engine);scene.clearColor=new Color4(.53,.72,.9,1);scene.ambientColor=new Color3(.42,.46,.5);
const mats={};function mat(key,c){if(mats[key])return mats[key];const m=new StandardMaterial(key,scene);m.diffuseColor=c;m.specularColor=new Color3(.08,.08,.08);return mats[key]=m}function shape(parent,type,p,s,c,key){let m=type==='box'?MeshBuilder.CreateBox(type,{size:1},scene):type==='sphere'?MeshBuilder.CreateSphere(type,{diameter:1,segments:12},scene):MeshBuilder.CreateCylinder(type,{height:1,diameter:1,tessellation:12},scene);m.position.set(...p);m.scaling.set(...s);m.material=mat(key,c);if(parent)m.parent=parent;return m}
function humanoid(name,p,c,key){const r=new TransformNode(name,scene);r.position.set(...p);shape(r,'cylinder',[0,1,0],[.55,1.45,.55],c,key);shape(r,'sphere',[0,2.25,0],[.65,.65,.65],new Color3(.86,.72,.58),'skin');shape(r,'box',[-.55,1.05,0],[.28,1.1,.28],c,key);shape(r,'box',[.55,1.05,0],[.28,1.1,.28],c,key);return r}function boss(name,p,c,key){const r=new TransformNode(name,scene);r.position.set(...p);shape(r,'cylinder',[0,1.4,0],[1.05,2.1,1.05],c,key);shape(r,'sphere',[0,3.1,0],[1.1,.9,1.1],c,key);shape(r,'box',[-1.25,1.7,0],[.45,2.1,.45],c,key);shape(r,'box',[1.25,1.7,0],[.45,2.1,.45],c,key);return r}function tree(x,z){const r=new TransformNode('tree',scene);r.position.set(x,0,z);shape(r,'cylinder',[0,1,0],[.55,2,.55],new Color3(.42,.25,.13),'wood');shape(r,'sphere',[0,3,0],[1.7,1.35,1.7],new Color3(.18,.48,.2),'leaf')}
shape(null,'box',[0,-.15,0],[28,.3,22],new Color3(.5,.72,.42),'ground');shape(null,'box',[-7,1.5,-4],[5.5,3,3.8],new Color3(.78,.7,.61),'hotel');shape(null,'cylinder',[3,.05,-4],[4,.12,4],new Color3(.24,.58,.72),'water');[[-11,-7],[-10,4],[-3,8],[5,8],[11,4],[10,-7],[1,-9]].forEach(v=>tree(...v));const player=humanoid('player',[-6,0,-2],new Color3(.12,.3,.55),'player');humanoid('gardener',[-2,0,0],new Color3(.2,.5,.25),'gardener');const woods=boss('woods',[8,0,6],new Color3(.18,.5,.21),'woods'),eye=boss('eye',[7,0,-4],new Color3(.65,.45,.75),'eye'),smog=boss('smog',[11,0,-6],new Color3(.22,.35,.24),'smog');const hemi=new HemisphericLight('hemi',new Vector3(0,1,0),scene);hemi.intensity=.55;const sun=new DirectionalLight('sun',new Vector3(-.6,-1,-.5),scene);sun.intensity=.8;const camera=new FreeCamera('camera',new Vector3(13,16,18),scene);camera.setTarget(Vector3.Zero());camera.minZ=.1;camera.maxZ=80;
let elapsed=0,frames=0,last=performance.now(),readyAt=performance.now();scene.onBeforeRenderObservable.add(()=>{const dt=engine.getDeltaTime()/1000;elapsed+=dt;frames++;const ph=(Math.sin(elapsed*.35)+1)/2;scene.clearColor=new Color4(.05+.48*ph,.08+.64*ph,.16+.72*ph,1);sun.intensity=.15+.75*ph;hemi.intensity=.22+.45*ph;const d=player.position.subtract(eye.position);d.y=0;if(d.length()>2.6){d.normalize().scaleInPlace(dt*1.5);eye.position.addInPlace(d)}woods.rotation.y+=dt*.2;smog.rotation.y-=dt*.14;const now=performance.now();if(now-last>500){const fps=engine.getFps();window.__bench={engine:'Babylon.js',readyMs:+(readyAt-t0).toFixed(1),fps:+fps.toFixed(1),backend:'WebGL2',frames,meshes:scene.meshes.length};hud.innerHTML=`Babylon.js · WebGL2<br>${fps.toFixed(1)} FPS · 시작 ${(readyAt-t0).toFixed(0)}ms<div class="note">낮/밤 + 3D 보스 + eye 추적</div>`;last=now}});engine.runRenderLoop(()=>scene.render());window.addEventListener('resize',()=>engine.resize());window.__bench={engine:'Babylon.js',readyMs:+(readyAt-t0).toFixed(1),fps:0,backend:'WebGL2'};
</script></body></html>
