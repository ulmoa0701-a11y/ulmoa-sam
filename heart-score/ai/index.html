<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>울모아 하트색깔악보 · AI OMR β</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f8fc}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#f7f9fc;color:#243654;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;font-weight:800;z-index:5}
#loading small{display:block;margin-top:8px;color:#718096;font-weight:600;text-align:center}
</style>
</head>
<body>
<div id="loading">🎼 AI 악보인식 화면 준비 중…<small>기존 하트악보 편집기는 그대로 두고<br>새 인식기만 격리해서 시험합니다.</small></div>
<iframe id="app" title="울모아 하트색깔악보" src="../?aiomr=680"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  const d=frame.contentDocument;
  if(!d)return;
  const s=d.createElement('script');
  s.type='module';
  s.src='../omr-ai-v680.js?v=680';
  s.onload=()=>document.getElementById('loading')?.remove();
  s.onerror=()=>{const n=document.getElementById('loading');if(n)n.innerHTML='AI 악보인식 모듈을 불러오지 못했습니다.<small>새로고침 후 다시 시도해 주세요.</small>';};
  d.body.appendChild(s);
});
</script>
</body>
</html>
