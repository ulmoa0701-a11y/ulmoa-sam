<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>붐웨커 Studio · 일단 해봄노트</title>
<style>
:root{--ink:#17233b;--muted:#738095;--line:#dce6ef;--bg:#f5f9ff;--panel:#fff;--shadow:0 12px 30px rgba(60,82,110,.10)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:linear-gradient(#f9fcff,#f2f7ff)}button,input{font:inherit}button{cursor:pointer}.app{width:min(1180px,100%);margin:auto;padding:16px 16px 60px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.brand small{display:block;color:var(--muted);font-size:12px}.brand h1{margin:2px 0 0;font-size:clamp(27px,5vw,40px);letter-spacing:-.04em}.brand p{margin:7px 0 0;color:var(--muted);font-size:14px}.back{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;text-decoration:none;font-weight:850;font-size:13px;white-space:nowrap}.layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:14px}.panel{background:rgba(255,255,255,.95);border:1px solid #e1e8ef;border-radius:24px;box-shadow:var(--shadow)}.controls{padding:18px;align-self:start;position:sticky;top:12px}.sec+.sec{border-top:1px solid #edf1f5;margin-top:15px;padding-top:15px}.label{font-size:12px;font-weight:900;color:#68758a;margin-bottom:7px}.songTitle{font-size:22px;font-weight:950}.meta,.hint{color:var(--muted);font-size:12px;line-height:1.5;margin-top:5px}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.seg button,.toggle{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 6px;font-weight:850;color:#58657a}.seg button.on{border-color:#55c89a;background:#e9faf3;color:#177652}.speed{display:flex;gap:8px;align-items:center}.speed input{flex:1}.bpm{min-width:60px;text-align:right;font-weight:900}.toggles{display:grid;grid-template-columns:1fr 1fr;gap:7px}.toggle.on{background:#eef6ff;border-color:#8cc4ff;color:#245e99}.primary{width:100%;border:0;border-radius:16px;padding:13px;background:#2378ed;color:#fff;font-weight:950;font-size:16px}.ghost{width:100%;margin-top:7px;border:1px solid var(--line);border-radius:16px;padding:11px;background:#fff;font-weight:850;color:#58657a}.stagePanel{padding:14px;min-width:0}.stageHead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}.stageHead strong{font-size:17px}.stageHead span{font-size:12px;color:var(--muted)}.stage{height:min(62vh,560px);min-height:420px;position:relative;overflow:hidden;border-radius:22px;border:1px solid #dbe9f5;background:linear-gradient(180deg,#e8f8ff 0,#f8fcff 55%,#fff 100%)}.lanes{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr)}.lane{position:relative;border-right:1px dashed rgba(90,114,139,.18)}.lane:last-child{border:0}.laneLabel{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:950;background:rgba(255,255,255,.8);padding:3px 7px;border-radius:999px;z-index:2}.hitLine{position:absolute;left:0;right:0;bottom:68px;height:3px;background:#17233b;opacity:.65}.tubes{position:absolute;left:0;right:0;bottom:0;height:68px;display:grid;grid-template-columns:repeat(8,1fr);gap:3px;padding:7px 8px;background:rgba(255,255,255,.9);border-top:1px solid #dfe8f1}.tube{border:0;border-radius:12px 12px 7px 7px;font-weight:950;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08)}.tube.inactive{opacity:.2;filter:grayscale(.5)}.tube.hit{transform:translateY(3px);filter:brightness(1.12)}.fall{position:absolute;width:34px;height:34px;border-radius:50%;transform:translate(-50%,-50%);display:grid;place-items:center;font-weight:950;border:2px solid rgba(255,255,255,.85);box-shadow:0 5px 13px rgba(42,64,90,.18);z-index:3}.playbar{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:10px;margin-top:12px}.round{width:52px;height:52px;border:0;border-radius:50%;background:#17233b;color:#fff;font-size:20px}.progress{height:12px;border-radius:999px;background:#e9eef5;overflow:hidden;cursor:pointer}.fill{height:100%;width:0;background:linear-gradient(90deg,#55c89a,#58a9f6)}.time{text-align:center;color:#6d798c;font-size:11px;margin-top:5px}.score{padding:18px;margin-top:14px}.score h2{margin:0;font-size:18px}.scoreSub{font-size:12px;color:var(--muted);margin:4px 0 12px}.scoreRows{display:flex;flex-wrap:wrap;gap:6px}.beat{min-width:54px;flex:1 1 62px;max-width:88px;border:1px solid #e0e6ee;border-radius:14px;overflow:hidden;background:#fff}.note{height:40px;display:grid;place-items:center;font-weight:950}.lyric{height:29px;display:grid;place-items:center;font-size:13px;font-weight:800;color:#536077;padding:0 3px}.beat.rest{opacity:.45}.beat.off{opacity:.17}.legend{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}.chip{display:flex;gap:5px;align-items:center;padding:6px 8px;background:#f5f7fa;border-radius:999px;font-size:11px;font-weight:800}.dot{width:11px;height:11px;border-radius:50%}.fullscreen .app{width:100%;max-width:none;padding:6px}.fullscreen .top,.fullscreen .controls,.fullscreen .score{display:none}.fullscreen .layout{display:block}.fullscreen .stagePanel{padding:0;border:0;box-shadow:none}.fullscreen .stage{height:calc(100vh - 75px);min-height:0;border-radius:0}.fullscreen .stageHead{padding:8px 12px;margin:0}.fullscreen .playbar{padding:0 10px}
@media(max-width:800px){.app{padding:12px 10px 50px}.layout{display:block}.controls{position:static;margin-bottom:10px;padding:14px}.stagePanel{padding:10px}.stage{height:56vh;min-height:390px}.score{padding:14px}.beat{min-width:46px;flex-basis:52px}.note{height:35px}.lyric{height:27px;font-size:12px}.laneLabel{font-size:11px;padding:2px 5px}.tubes{gap:2px;padding:6px 4px}.tube{font-size:11px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><small>일단 해봄노트 · 울모아쌤</small><h1>🥁 붐웨커 Studio</h1><p>색을 보고 치고, 떨어지는 노트를 따라 연주해요.</p></div><a class="back" href="../heart-score/">← 하트악보</a></header>
<main class="layout">
<aside class="panel controls">
<div class="sec"><div class="label">현재 곡</div><div class="songTitle" id="songTitle">작은별</div><div class="meta" id="songMeta">4/4 · 96 BPM</div></div>
<div class="sec"><div class="label">연습 음 범위</div><div class="seg" id="levels"><button data-level="3">3음</button><button data-level="5">5음</button><button data-level="8" class="on">8음</button></div><div class="hint">3·5음은 연습용 축약 모드예요. 범위 밖 음은 흐리게 보이고 소리는 나지 않아요.</div></div>
<div class="sec"><div class="label">속도</div><div class="speed"><span>느리게</span><input id="tempo" type="range" min="50" max="160" value="96"><span class="bpm" id="bpmLabel">96 BPM</span></div></div>
<div class="sec"><div class="toggles"><button id="repeatBtn" class="toggle on">↻ 반복</button><button id="soundBtn" class="toggle on">🔊 소리</button><button id="lyricBtn" class="toggle on">가사 표시</button><button id="fullBtn" class="toggle">⛶ 전체화면</button></div></div>
<div class="sec"><button id="startBtn" class="primary">▶ 연주 시작</button><button id="restartBtn" class="ghost">처음부터</button><div class="hint">화면 아래 색 막대를 직접 눌러도 소리가 납니다.</div></div>
</aside>
<section class="panel stagePanel"><div class="stageHead"><strong id="stageTitle">작은별</strong><span id="stageStatus">준비</span></div><div id="stage" class="stage"><div id="lanes" class="lanes"></div><div class="hitLine"></div><div id="tubes" class="tubes"></div></div><div class="playbar"><button id="playBtn" class="round">▶</button><div><div id="progress" class="progress"><div id="progressFill" class="fill"></div></div><div id="timeLabel" class="time">0:00 / 0:00</div></div><button id="resetBtn" class="round">↺</button></div></section>
</main>
<section class="panel score"><h2>붐웨커 색깔악보</h2><div id="scoreSub" class="scoreSub">연주 순서를 한눈에 봐요.</div><div id="scoreRows" class="scoreRows"></div><div id="legend" class="legend"></div></section>
</div>
<script>
const COLORS={도:'#ef4444',레:'#f97316',미:'#facc15',파:'#22c55e',솔:'#38a7e8',라:'#4f65d9',시:'#a855f7','높은도':'#ef4444'},TEXT={도:'#fff',레:'#17233b',미:'#17233b',파:'#17233b',솔:'#10233b',라:'#fff',시:'#fff','높은도':'#fff'},ORDER=['도','레','미','파','솔','라','시','높은도'],ALLOWED={3:new Set(['도','미','솔']),5:new Set(['도','레','미','솔','라']),8:new Set(ORDER)},FREQ={도:261.63,레:293.66,미:329.63,파:349.23,솔:392,라:440,시:493.88,'높은도':523.25};
const demo={title:'작은별',timeN:4,timeD:4,bpm:96,measures:[[{note:'도',dur:1,lyric:'반'},{note:'도',dur:1,lyric:'짝'},{note:'솔',dur:1,lyric:'반'},{note:'솔',dur:1,lyric:'짝'}],[{note:'라',dur:1,lyric:'작'},{note:'라',dur:1,lyric:'은'},{note:'솔',dur:2,lyric:'별'}],[{note:'파',dur:1,lyric:'아'},{note:'파',dur:1,lyric:'름'},{note:'미',dur:1,lyric:'답'},{note:'미',dur:1,lyric:'게'}],[{note:'레',dur:1,lyric:'비'},{note:'레',dur:1,lyric:'치'},{note:'도',dur:2,lyric:'네'}]]};
const $=s=>document.querySelector(s);let song=loadSong(),level=8,bpm=Number(song.bpm)||96,repeat=true,sound=true,lyrics=true,playing=false,elapsed=0,lastTs=0,raf=0,audioCtx=null,events=[],totalMs=0;
function loadSong(){try{const a=localStorage.getItem('ulmoaBoomTransfer'),b=localStorage.getItem('ulmoaBoomLast');for(const raw of [a,b])if(raw){const x=JSON.parse(raw);if(x&&Array.isArray(x.measures))return x}}catch(e){}return demo}function saveLast(){try{localStorage.setItem('ulmoaBoomLast',JSON.stringify(song))}catch(e){}}
function clean(n){n=String(n||'').replace(/\s/g,'');if(!n||n==='쉼')return'쉼';if(/^높은도/.test(n))return'높은도';return n.replace(/^높은/,'').replace(/[♯#♭b]/g,'')}function beatMs(){return 60000/Math.max(40,bpm)}
function build(){events=[];let t=1200,u=beatMs();for(const m of song.measures||[])for(const e of m){let d=Math.max(.125,Number(e.dur)||1),n=clean(e.note);events.push({note:n,lyric:e.lyric||'',start:t,dur:d*u,active:n!=='쉼'&&ALLOWED[level].has(n)});t+=d*u}totalMs=t+u*1.5;renderScore();updateTime()}
function renderLanes(){let l=$('#lanes'),t=$('#tubes');l.innerHTML=t.innerHTML='';ORDER.forEach(n=>{let a=document.createElement('div');a.className='lane';a.innerHTML=`<div class="laneLabel">${n==='높은도'?'도↑':n}</div>`;l.appendChild(a);let b=document.createElement('button');b.className='tube'+(ALLOWED[level].has(n)?'':' inactive');b.dataset.note=n;b.style.background=COLORS[n];b.style.color=TEXT[n];b.textContent=n==='높은도'?'도↑':n;b.onclick=()=>tone(n,b);t.appendChild(b)})}
function renderScore(){let w=$('#scoreRows');w.innerHTML='';for(const e of events){let d=document.createElement('div'),off=e.note!=='쉼'&&!ALLOWED[level].has(e.note);d.className='beat'+(e.note==='쉼'?' rest':'')+(off?' off':'');d.innerHTML=e.note==='쉼'?'<div class="note">쉼</div><div class="lyric"></div>':`<div class="note" style="background:${COLORS[e.note]};color:${TEXT[e.note]}">${e.note==='높은도'?'도↑':e.note}</div><div class="lyric">${lyrics?esc(e.lyric):''}</div>`;w.appendChild(d)}$('#scoreSub').textContent=`${level}음 모드 · ${events.filter(e=>e.active).length}개 연주음 · ${bpm} BPM`;let g=$('#legend');g.innerHTML='';ORDER.forEach(n=>{let c=document.createElement('div');c.className='chip';c.style.opacity=ALLOWED[level].has(n)?1:.28;c.innerHTML=`<span class="dot" style="background:${COLORS[n]}"></span>${n==='높은도'?'도↑':n}`;g.appendChild(c)})}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function audio(){if(!audioCtx){const A=window.AudioContext||window.webkitAudioContext;if(A)audioCtx=new A()}if(audioCtx?.state==='suspended')audioCtx.resume()}function tone(n,b){if(!sound||!FREQ[n])return;audio();if(!audioCtx)return;let now=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=FREQ[n];o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.001,now);g.gain.exponentialRampToValueAtTime(.3,now+.01);g.gain.exponentialRampToValueAtTime(.001,now+.28);o.start(now);o.stop(now+.3);if(b){b.classList.add('hit');setTimeout(()=>b.classList.remove('hit'),100)}}
function draw(){document.querySelectorAll('.fall').forEach(x=>x.remove());let s=$('#stage'),hit=s.clientHeight-68,fall=1500;for(const e of events){if(!e.active)continue;let dt=e.start-elapsed;if(dt>fall||dt< -180)continue;let p=1-dt/fall,i=ORDER.indexOf(e.note),n=document.createElement('div');n.className='fall';n.style.left=((i+.5)/8*s.clientWidth)+'px';n.style.top=Math.max(44,Math.min(hit,p*hit))+'px';n.style.background=COLORS[e.note];n.style.color=TEXT[e.note];n.textContent=e.note==='높은도'?'도↑':e.note;s.appendChild(n)}}
function frame(ts){if(!playing)return;if(!lastTs)lastTs=ts;let prev=elapsed;elapsed+=ts-lastTs;lastTs=ts;if(elapsed>=totalMs){if(repeat){elapsed=0;prev=0}else{elapsed=totalMs;playing=false;$('#playBtn').textContent='▶';$('#startBtn').textContent='▶ 연주 시작'}}for(const e of events)if(e.active&&e.start>prev&&e.start<=elapsed){let b=[...document.querySelectorAll('.tube')].find(x=>x.dataset.note===e.note);tone(e.note,b)}draw();updateTime();if(playing)raf=requestAnimationFrame(frame)}
function toggle(){if(playing){playing=false;cancelAnimationFrame(raf);$('#playBtn').textContent='▶';$('#startBtn').textContent='▶ 계속'}else{if(elapsed>=totalMs)elapsed=0;playing=true;lastTs=0;$('#playBtn').textContent='Ⅱ';$('#startBtn').textContent='Ⅱ 잠시 멈춤';raf=requestAnimationFrame(frame)}}function reset(){playing=false;cancelAnimationFrame(raf);elapsed=0;lastTs=0;draw();updateTime();$('#playBtn').textContent='▶';$('#startBtn').textContent='▶ 연주 시작'}function updateTime(){let f=m=>`${Math.floor(m/60000)}:${String(Math.floor(m/1000)%60).padStart(2,'0')}`;$('#timeLabel').textContent=`${f(elapsed)} / ${f(totalMs)}`;$('#progressFill').style.width=(totalMs?Math.min(100,elapsed/totalMs*100):0)+'%'}function on(btn,v){btn.classList.toggle('on',v)}
function init(){saveLast();$('#songTitle').textContent=$('#stageTitle').textContent=song.title||'제목 없는 곡';$('#songMeta').textContent=`${song.timeN||4}/${song.timeD||4} · ${bpm} BPM`;$('#tempo').value=Math.max(50,Math.min(160,bpm));$('#bpmLabel').textContent=bpm+' BPM';renderLanes();build();$('#stageStatus').textContent=localStorage.getItem('ulmoaBoomTransfer')?'하트악보에서 가져옴':'준비'}
$('#levels').onclick=e=>{let b=e.target.closest('button');if(!b)return;level=Number(b.dataset.level);document.querySelectorAll('#levels button').forEach(x=>x.classList.toggle('on',x===b));renderLanes();build();reset()};$('#tempo').oninput=e=>{bpm=Number(e.target.value);$('#bpmLabel').textContent=bpm+' BPM';$('#songMeta').textContent=`${song.timeN||4}/${song.timeD||4} · ${bpm} BPM`;build();reset()};$('#repeatBtn').onclick=()=>{repeat=!repeat;on($('#repeatBtn'),repeat)};$('#soundBtn').onclick=()=>{sound=!sound;on($('#soundBtn'),sound);$('#soundBtn').textContent=sound?'🔊 소리':'🔇 소리'};$('#lyricBtn').onclick=()=>{lyrics=!lyrics;on($('#lyricBtn'),lyrics);renderScore()};$('#fullBtn').onclick=async()=>{document.body.classList.toggle('fullscreen');on($('#fullBtn'),document.body.classList.contains('fullscreen'));try{if(document.body.classList.contains('fullscreen')&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else if(document.fullscreenElement)await document.exitFullscreen()}catch(e){}setTimeout(draw,100)};$('#startBtn').onclick=$('#playBtn').onclick=toggle;$('#restartBtn').onclick=$('#resetBtn').onclick=reset;$('#progress').onclick=e=>{let r=e.currentTarget.getBoundingClientRect();elapsed=Math.max(0,Math.min(totalMs,(e.clientX-r.left)/r.width*totalMs));lastTs=0;draw();updateTime()};window.addEventListener('resize',draw);init();
</script>
</body></html>
