<main class="layout">
<aside class="panel controls">

<div class="sec"><div class="label">샘플곡 바로 불러오기</div><select id="sampleSelect" class="sampleSelect" aria-label="샘플곡 선택"></select><div class="hint">하트악보의 샘플곡을 같은 음·리듬·가사로 불러옵니다.</div></div>

</aside>

const hometown=song('hometown-spring','고향의 봄',80,4,4,[[E('솔',1,'나'),E('솔',1,'의'),E('미',.5,'살'),E('파',.5,''),E('솔',1,'던')],[E('라',1,'고'),E('라',1,'향'),E('솔',2,'은')],[E('솔',1,'꽃'),E('높은도',1,'피'),E('높은미',1,'는'),E('높은레',.5,'산'),E('높은도',.5,'')],[E('높은레',4,'골')],[E('높은미',1,'복'),E('높은미',1,'숭'),E('높은레',1,'아'),E('높은레',1,'꽃')],[E('높은도',1,'살'),E('높은레',.5,'구'),E('높은도',.5,''),E('라',2,'꽃')],[E('솔',1,'아'),E('솔',1,'기'),E('솔',1,'진'),E('미',.5,'달'),E('레',.5,'')],[E('도',4,'래')],[E('레',1,'울'),E('레',1,'긋'),E('미',1,'불'),E('도',1,'긋')],[E('레',2,'꽃'),E('미',1,'대'),E('솔',1,'궐')],[E('라',1,'차'),E('높은도',1,'리'),E('높은미',1,'인'),E('높은레',.5,'동'),E('높은도',.5,'')],[E('높은레',4,'네')],[E('높은미',1,'그'),E('높은미',1,'속'),E('높은레',1,'에'),E('높은레',1,'서')],[E('높은도',1,'놀'),E('높은레',.5,'던'),E('높은도',.5,''),E('라',1,'때'),E('라',1,'가')],[E('솔',1,'그'),E('솔',1,'립'),E('솔',1,'습'),E('미',.5,'니'),E('레',.5,'')],[E('도',4,'다')]]);
const sixteenth=song('sixteenth','16분 리듬 예시',96,4,4,[[E('도',.25,'도'),E('레',.25,'레'),E('미',.25,'미'),E('파',.25,'파'),E('솔',.5,'솔'),E('라',.5,'라'),E('시',1,'시'),E('높은도',1,'도')],[E('도',.5,'반'),E('레',.25,'짧'),E('미',.25,'게'),E('파',.5,'반'),E('솔',.25,'짧'),E('라',.25,'게'),E('시',1,'끝'),E('높은도',1,'박')],[E('쉼',.25,''),E('도',.25,'시'),E('레',.25,'작'),E('미',.25,'해'),E('파',.5,'리'),E('솔',.5,'듬'),E('라',1,'연'),E('시',1,'습')],[E('도',1,'한'),E('레',.5,'박'),E('미',.5,'안'),E('파',.25,'넷'),E('솔',.25,'개'),E('라',.25,'로'),E('시',.25,'나'),E('높은도',1,'눠')]],'수업용');
const dotted=song('dotted','점8분·16분 예시',92,4,4,[[E('도',.75,'길'),E('레',.25,'게'),E('미',.75,'길'),E('파',.25,'게'),E('솔',.5,'반'),E('라',.5,'반'),E('시',1,'한'),E('높은도',1,'박')],[E('높은도',.25,'짧'),E('시',.75,'게'),E('라',.25,'짧'),E('솔',.75,'게'),E('파',.5,'반'),E('미',.25,'짧'),E('레',.25,'게'),E('도',1,'끝')],[E('도',.75,'점'),E('도',.25,'짝'),E('레',.75,'점'),E('레',.25,'짝'),E('미',.75,'점'),E('미',.25,'짝'),E('파',1,'연'),E('솔',1,'습')],[E('쉼',.5,''),E('도',.75,'쉬'),E('레',.25,'고'),E('미',1,'다'),E('파',.25,'시'),E('솔',.75,'한'),E('라',1,'번')]],'수업용');
function transpose(src,key,title,map){return song(key,title,src.bpm,src.timeN,src.timeD,src.measures.map(m=>m.map(e=>E(e.note==='쉼'?'쉼':(map[e.note]||e.note),e.dur,e.lyric))),src.category)}
const butterflyD=transpose(butterfly,'butterfly-d','나비야 · D장조',{'도':'레','레':'미','미':'파#','파':'솔','솔':'라','라':'시','시':'도#'});
const butterflyF=transpose(butterfly,'butterfly-f','나비야 · F장조',{'도':'파','레':'솔','미':'라','파':'시♭','솔':'도','라':'레','시':'미'});
const SAMPLES=[plane,butterfly,rabbit,twinkle,same,bicycle,bear,school,outing,hometown,butterflyD,butterflyF,sixteenth,dotted];
const $=s=>document.querySelector(s);
const clone=o=>JSON.parse(JSON.stringify(o));
let loadedFromTransfer=false,currentSampleKey='';
function findSample(key){return SAMPLES.find(x=>x.key===key)}
function loadSong(){
 try{const raw=localStorage.getItem('ulmoaBoomTransfer');if(raw){const x=JSON.parse(raw);if(x&&Array.isArray(x.measures)){localStorage.removeItem('ulmoaBoomTransfer');loadedFromTransfer=true;return x}}}catch(e){}
 const requested=new URLSearchParams(location.search).get('song');const qs=findSample(requested);if(qs){currentSampleKey=qs.key;return clone(qs)}
 try{const raw=localStorage.getItem('ulmoaBoomLast');if(raw){const x=JSON.parse(raw);if(x&&Array.isArray(x.measures)){currentSampleKey=x.sampleKey||'';return x}}}catch(e){}
 currentSampleKey='twinkle';return clone(twinkle)
}
let currentSong=loadSong(),level=8,bpm=Number(currentSong.bpm)||96,repeat=true,sound=true,lyrics=true,playing=false,elapsed=0,lastTs=0,raf=0,audioCtx=null,events=[],totalMs=0;
function saveLast(){try{localStorage.setItem('ulmoaBoomLast',JSON.stringify({...currentSong,sampleKey:currentSampleKey}))}catch(e){}}
function canonical(raw){let n=String(raw||'').replace(/\s/g,'').replace(/♯/g,'#');if(!n||n==='쉼')return'쉼';return n}
function noteLabel(n){if(n==='높은도')return'도↑';if(n.startsWith('높은'))return n.slice(2)+'↑';return n.replace('#','♯')}
function noteColor(n){return COLORS[n]||'#e2e8f0'}function noteText(n){return TEXT[n]||'#526071'}function beatMs(){return 60000/Math.max(40,bpm)}
function outOfBaseCount(){return events.filter(e=>e.note!=='쉼'&&!ALLOWED[8].has(e.note)).length}
function build(){events=[];let t=1200,u=beatMs();for(const m of currentSong.measures||[])for(const e of m){let d=Math.max(.125,Number(e.dur)||1),n=canonical(e.note);events.push({note:n,lyric:e.lyric||'',start:t,dur:d*u,active:n!=='쉼'&&ALLOWED[level].has(n),supported:n==='쉼'||ALLOWED[8].has(n)});t+=d*u}totalMs=t+u*1.5;renderScore();updateTime();updateRangeInfo()}
function buildSampleSelect(){const s=$('#sampleSelect');s.innerHTML='<option value="">현재/가져온 곡</option>';for(const group of ['동요','수업용']){const g=document.createElement('optgroup');g.label=group;for(const x of SAMPLES.filter(v=>v.category===group)){const o=document.createElement('option');o.value=x.key;o.textContent=x.title;g.appendChild(o)}s.appendChild(g)}s.value=currentSampleKey||''}
function renderLanes(){let l=$('#lanes'),t=$('#tubes');l.innerHTML=t.innerHTML='';ORDER.forEach(n=>{let a=document.createElement('div');a.className='lane';a.innerHTML=`<div class="laneLabel">${noteLabel(n)}</div>`;l.appendChild(a);let b=document.createElement('button');b.className='tube'+(ALLOWED[level].has(n)?'':' inactive');b.dataset.note=n;b.style.background=COLORS[n];b.style.color=TEXT[n];b.textContent=noteLabel(n);b.onclick=()=>tone(n,b);t.appendChild(b)})}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderScore(){let w=$('#scoreRows');w.innerHTML='';for(const e of events){let d=document.createElement('div'),off=e.note!=='쉼'&&!ALLOWED[level].has(e.note),unsupported=!e.supported;d.className='beat'+(e.note==='쉼'?' rest':'')+(off?' off':'')+(unsupported?' unsupported':'');d.innerHTML=e.note==='쉼'?'<div class="note">쉼</div><div class="lyric"></div>':`<div class="note" style="background:${noteColor(e.note)};color:${noteText(e.note)}">${esc(noteLabel(e.note))}</div><div class="lyric">${lyrics?esc(e.lyric):''}</div>`;w.appendChild(d)}let outside=outOfBaseCount(),sub=$('#scoreSub');sub.classList.toggle('warn',outside>0);sub.textContent=`${level}음 모드 · ${events.filter(e=>e.active).length}개 연주음 · ${bpm} BPM${outside?` · 기본 8음 범위 밖 ${outside}개`:''}`;let g=$('#legend');g.innerHTML='';ORDER.forEach(n=>{let c=document.createElement('div');c.className='chip';c.style.opacity=ALLOWED[level].has(n)?1:.28;c.innerHTML=`<span class="dot" style="background:${COLORS[n]}"></span>${noteLabel(n)}`;g.appendChild(c)})}
function updateRangeInfo(){let outside=outOfBaseCount(),box=$('#rangeNote');box.classList.toggle('show',outside>0);box.textContent=outside?`이 곡에는 기본 8음 붐웨커(C~높은 C) 밖의 음이 ${outside}개 있어요. 다른 음으로 바꾸지 않고 회색으로 표시하며 재생에서 제외합니다.`:'';if(outside)$('#stageStatus').textContent=`범위 밖 음 ${outside}개`;else if(loadedFromTransfer)$('#stageStatus').textContent='하트악보에서 가져옴';else $('#stageStatus').textContent='준비'}
function audio(){if(!audioCtx){const A=window.AudioContext||window.webkitAudioContext;if(A)audioCtx=new A()}if(audioCtx?.state==='suspended')audioCtx.resume()}
function tone(n,b){if(!sound||!FREQ[n])return;audio();if(!audioCtx)return;let now=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=FREQ[n];o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.001,now);g.gain.exponentialRampToValueAtTime(.3,now+.01);g.gain.exponentialRampToValueAtTime(.001,now+.28);o.start(now);o.stop(now+.3);if(b){b.classList.add('hit');setTimeout(()=>b.classList.remove('hit'),100)}}
function draw(){document.querySelectorAll('.fall').forEach(x=>x.remove());let s=$('#stage'),hit=s.clientHeight-68,fall=1500;for(const e of events){if(!e.active)continue;let dt=e.start-elapsed;if(dt>fall||dt< -180)continue;let p=1-dt/fall,i=ORDER.indexOf(e.note);if(i<0)continue;let n=document.createElement('div');n.className='fall';n.style.left=((i+.5)/8*s.clientWidth)+'px';n.style.top=Math.max(44,Math.min(hit,p*hit))+'px';n.style.background=COLORS[e.note];n.style.color=TEXT[e.note];n.textContent=noteLabel(e.note);s.appendChild(n)}}
function frame(ts){if(!playing)return;if(!lastTs)lastTs=ts;let prev=elapsed;elapsed+=ts-lastTs;lastTs=ts;if(elapsed>=totalMs){if(repeat){elapsed=0;prev=0}else{elapsed=totalMs;playing=false;$('#playBtn').textContent='▶';$('#startBtn').textContent='▶ 연주 시작'}}for(const e of events)if(e.active&&e.start>prev&&e.start<=elapsed){let b=[...document.querySelectorAll('.tube')].find(x=>x.dataset.note===e.note);tone(e.note,b)}draw();updateTime();if(playing)raf=requestAnimationFrame(frame)}
function toggle(){if(playing){playing=false;cancelAnimationFrame(raf);$('#playBtn').textContent='▶';$('#startBtn').textContent='▶ 계속'}else{if(elapsed>=totalMs)elapsed=0;playing=true;lastTs=0;$('#playBtn').textContent='Ⅱ';$('#startBtn').textContent='Ⅱ 잠시 멈춤';raf=requestAnimationFrame(frame)}}
function reset(){playing=false;cancelAnimationFrame(raf);elapsed=0;lastTs=0;draw();updateTime();$('#playBtn').textContent='▶';$('#startBtn').textContent='▶ 연주 시작'}
function updateTime(){let f=m=>`${Math.floor(m/60000)}:${String(Math.floor(m/1000)%60).padStart(2,'0')}`;$('#timeLabel').textContent=`${f(elapsed)} / ${f(totalMs)}`;$('#progressFill').style.width=(totalMs?Math.min(100,elapsed/totalMs*100):0)+'%'}
function on(btn,v){btn.classList.toggle('on',v)}
function syncSongUI(){bpm=Math.max(50,Math.min(160,Number(currentSong.bpm)||96));$('#songTitle').textContent=$('#stageTitle').textContent=currentSong.title||'제목 없는 곡';$('#songMeta').textContent=`${currentSong.timeN||4}/${currentSong.timeD||4} · ${bpm} BPM`;$('#tempo').value=bpm;$('#bpmLabel').textContent=bpm+' BPM';buildSampleSelect();renderLanes();build();reset();saveLast()}
function chooseSample(key){const s=findSample(key);if(!s)return;loadedFromTransfer=false;currentSampleKey=s.key;currentSong=clone(s);syncSongUI()}
function init(){syncSongUI()}
$('#sampleSelect').onchange=e=>{if(e.target.value)chooseSample(e.target.value)};
$('#levels').onclick=e=>{let b=e.target.closest('button');if(!b)return;level=Number(b.dataset.level);document.querySelectorAll('#levels button').forEach(x=>x.classList.toggle('on',x===b));renderLanes();build();reset()};
$('#tempo').oninput=e=>{bpm=Number(e.target.value);currentSong.bpm=bpm;$('#bpmLabel').textContent=bpm+' BPM';$('#songMeta').textContent=`${currentSong.timeN||4}/${currentSong.timeD||4} · ${bpm} BPM`;build();reset();saveLast()};
$('#repeatBtn').onclick=()=>{repeat=!repeat;on($('#repeatBtn'),repeat)};$('#soundBtn').onclick=()=>{sound=!sound;on($('#soundBtn'),sound);$('#soundBtn').textContent=sound?'🔊 소리':'🔇 소리'};$('#lyricBtn').onclick=()=>{lyrics=!lyrics;on($('#lyricBtn'),lyrics);renderScore()};
$('#fullBtn').onclick=async()=>{document.body.classList.toggle('fullscreen');on($('#fullBtn'),document.body.classList.contains('fullscreen'));try{if(document.body.classList.contains('fullscreen')&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else if(document.fullscreenElement)await document.exitFullscreen()}catch(e){}setTimeout(draw,100)};
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement){document.body.classList.remove('fullscreen');on($('#fullBtn'),false)}});
$('#startBtn').onclick=$('#playBtn').onclick=toggle;$('#restartBtn').onclick=$('#resetBtn').onclick=reset;$('#progress').onclick=e=>{let r=e.currentTarget.getBoundingClientRect();elapsed=Math.max(0,Math.min(totalMs,(e.clientX-r.left)/r.width*totalMs));lastTs=0;draw();updateTime()};window.addEventListener('resize',draw);init();
</script>
</body>
